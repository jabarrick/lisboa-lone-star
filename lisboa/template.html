 lucia:{n:['露西娅·雷耶斯','Lucía Reyes','Lucía Reyes'],s:['露西娅','Lucía','Lucía'],p:['她','her','ela'],role:['牧场主之女，兽医助理','Rancher\'s daughter, vet tech','Filha do rancheiro, auxiliar veterinária'],romance:1,group:'root',loc:'ranch',accentLove:1,
  meet:['她把一扇冻牛胸肉扔在你的砧板上：“若泽每周四从我们家拿肉。你要是想继续，就别迟到。”她走的时候回头看了你一眼——不是那种看，是在估价。','She drops a frozen brisket on your cutting board. "José picked up meat from us every Thursday. If you want to keep that up, don\'t be late." On her way out she looks back at you — not that kind of look. She\'s pricing you.','Ela atira um peito de vaca congelado para a tua tábua. «O José vinha buscar carne a nossa casa todas as quintas. Se quiseres continuar, não te atrases.» À saída, olha para trás — não é esse tipo de olhar. Está a avaliar-te.'],

 clara:{n:['克拉拉·博蒙特','Clara Beaumont','Clara Beaumont'],s:['克拉拉','Clara','Clara'],p:['她','her','ela'],role:['社区大学图书馆员','Community college librarian','Bibliotecária do politécnico'],romance:1,group:'mirror',loc:'college',cond:s=>s.week>=2,

  beats:[['她说她一直想去里斯本，又不敢去，“我怕它没有书里的好。”','She says she\'s always wanted to see Lisbon and never dared. "I\'m scared it won\'t be as good as the books."','Diz que sempre quis ir a Lisboa e nunca teve coragem. «Tenho medo que não seja tão bonita como nos livros.»'],

   ['她连值了三个夜班。你给她送去一锅 羽衣甘蓝汤，她站着喝完。','She pulls three night shifts in a row. You bring her a pot of kale soup and she drinks it standing up.','Faz três turnos da noite seguidos. Levas-lhe uma panela de caldo verde e ela bebe-o de pé.']],
  truth:['“你怕什么？我是医生，我问这个是认真的。”','"What are you afraid of? I\'m a doctor. I\'m asking seriously."','«De que tens medo? Sou médica, estou a perguntar a sério.»']},
 brooke:{n:['布鲁克·坦纳','Brooke Tanner','Brooke Tanner'],s:['布鲁克','Brooke','Brooke'],p:['她','her','ela'],role:['桶赛骑手，巡回赛来往','Barrel racer on the circuit','Cavaleira de barris, sempre na estrada'],romance:1,group:'leave',loc:'ranch',cond:s=>s.week>=6,
  meet:['一辆挂着马拖车的皮卡开进牧场，女孩跳下来：“巡回赛路过，借个水管。你就是那个会做蛋挞的？”','A pickup hauling a horse trailer pulls into the ranch. A girl jumps out. "Passing through on the circuit, need a hose. You the guy who makes the custard tarts?"','Uma carrinha com um atrelado de cavalos entra no rancho. Salta lá de dentro uma rapariga. «Estou de passagem no circuito, preciso de uma mangueira. És tu o dos pastéis de nata?»'],
  beats:[['她一年在路上开四万英里。“家？家就是这辆车。”','She drives forty thousand miles a year. "Home? Home is this truck."','Faz sessenta mil quilómetros por ano. «Casa? A minha casa é esta carrinha.»'],
   ['她让你骑她的马绕一个桶。你差点摔下去，她笑到蹲在地上。','She lets you ride her horse around one barrel. You nearly fall off. She laughs so hard she has to crouch.','Deixa-te dar uma volta a um barril no cavalo dela. Quase cais. Ela ri-se tanto que tem de se agachar.'],
   ['她给你看一张地图，上面密密麻麻标满了她去过的小镇。','She shows you a map crowded with every small town she\'s been to.','Mostra-te um mapa cheio de todas as vilas por onde já passou.']],
  truth:['“我下个月去俄克拉荷马。你能不能跟车一个月？”','"I\'m heading to Oklahoma next month. Would you ride along for a month?"','«No mês que vem vou para o Oklahoma. Vens comigo um mês?»']},
 megan:{n:['梅根·金凯德','Megan Kincaid','Megan Kincaid'],s:['梅根','Megan','Megan'],p:['她','her','ela'],role:['牧师的女儿，唱诗班','The pastor\'s daughter, choir','Filha do pastor, coro da igreja'],romance:1,group:'root',loc:'church',
  meet:['唱诗班散场，牧师的女儿在门口拦住你：“我爸说你想卖酒。真的吗？——我希望是真的。”','After choir, the pastor\'s daughter stops you at the door. "Dad says you want to sell liquor. Is it true? — I hope it\'s true."','Depois do coro, a filha do pastor trava-te à porta. «O meu pai diz que queres vender álcool. É verdade? — Espero que seja.»'],
  beats:[['她偷偷来店里吃了一个蛋挞，要你发誓不告诉她爸。','She sneaks into the shop for a custard tart and makes you swear not to tell her father.','Entra às escondidas para comer um pastel de nata e obriga-te a jurar que não contas ao pai.'],
   ['她在空教堂里唱了一首赞美诗给你听，声音亮得像玻璃。','In the empty church she sings you a hymn. Her voice is bright as glass.','Na igreja vazia canta-te um hino. A voz dela é límpida como vidro.'],
   ['“我这辈子都站在别人看得见的地方。”','"I\'ve spent my whole life standing where people can see me."','«Passei a vida inteira onde toda a gente me vê.»']],
  truth:['“如果我们在一起，你敢当着我爸的面说吗？”','"If we were together, would you say it to my father\'s face?"','«Se ficássemos juntos, eras capaz de o dizer à frente do meu pai?»']},
 colleen:{n:['科琳·菲茨杰拉德','Colleen Fitzgerald','Colleen Fitzgerald'],s:['科琳','Colleen','Colleen'],p:['她','her','ela'],role:['《圣鲁伊斯号角报》唯一的记者','Sole reporter at the San Luís Clarion','A única jornalista do San Luís Clarion'],romance:1,group:'mirror',loc:'main',cond:s=>s.week>=3,
  meet:['记者拦住你：“镇上第一个葡萄牙老板——不对，第二个。我能采访你吗？”','The reporter flags you down. "The town\'s first Portuguese business owner — no, second. Can I interview you?"','A jornalista faz-te sinal. «O primeiro dono português de um negócio na vila — não, o segundo. Posso entrevistar-te?»'],
  beats:[['她的问题都问得很准，准得让你不太舒服。','Her questions are precise. Precise enough to make you uneasy.','As perguntas dela são certeiras. Certeiras demais para o teu gosto.'],
   ['她祖父是罐头厂最后一任工头。“他提过你舅舅。”','Her grandfather was the cannery\'s last foreman. "He\'s mentioned your uncle."','O avô dela foi o último capataz da fábrica de conservas. «Ele já me falou do teu tio.»'],
   ['她给你看报道初稿，把你写得比你本人好一点。','She shows you a draft of the story. She\'s written you a little better than you are.','Mostra-te o rascunho do artigo. Pintou-te um bocadinho melhor do que és.']],
  truth:['“这篇关于你的报道，你想让我发，还是不发？”','"This story about you — do you want me to run it, or not?"','«Este artigo sobre ti — queres que o publique ou não?»']},
 wade:{n:['韦德·哈兰','Wade Harlan','Wade Harlan'],s:['韦德','Wade','Wade'],p:['他','him','ele'],role:['牧场工头，寡言','Ranch foreman, few words','Capataz do rancho, de poucas palavras'],romance:1,group:'root',loc:'ranch',
  meet:['牧场工头只对你点了点头。过了一个小时，他说了第一句话：“手套戴反了。”','The foreman just nods at you. An hour later he says his first words: "Gloves are on the wrong hands."','O capataz limita-se a acenar com a cabeça. Uma hora depois diz as primeiras palavras: «As luvas estão trocadas.»'],
  beats:[['你们修了一下午栅栏。他一共说了七个字，每个都有用。','You fix fences all afternoon. He says about five words total. Every one of them useful.','Passam a tarde a arranjar cercas. Ele diz umas cinco palavras ao todo. Todas úteis.'],
   ['他问你为什么没读完建筑。你说“以后再说”。他没追问。','He asks why you never finished architecture. You say "another time." He doesn\'t push.','Pergunta porque não acabaste arquitetura. Dizes «fica para outra altura». Ele não insiste.'],
   ['他把自己的旧帽子扔给你：“太阳会把你脑子晒坏。”','He tosses you his old hat. "Sun\'ll cook your brain."','Atira-te o chapéu velho dele. «O sol vai-te cozer os miolos.»']],
  truth:['他看着远处：“你为什么不读了？真正的原因。”','He looks out at the horizon. "Why\'d you quit school? The real reason."','Olha para o horizonte. «Porque deixaste o curso? A razão verdadeira.»']},
 ashley:{n:['阿什莉·邓恩','Ashley Dunn','Ashley Dunn'],s:['阿什莉','Ashley','Ashley'],p:['她','her','ela'],role:['高中橄榄球队体能教练','High school football strength coach','Preparadora física da equipa de futebol americano do liceu'],romance:1,group:'root',loc:'gym',
  meet:['有人纠正你的深蹲：“膝盖别内扣。我是校队体能教练，阿什莉。你练得像在跳法多。”','Someone corrects your squat. "Don\'t let your knees cave. I\'m Ashley, strength coach for the high school team. You lift like you\'re dancing fado."','Alguém te corrige o agachamento. «Não deixes os joelhos fugir para dentro. Sou a Ashley, preparadora física da equipa do liceu. Treinas como quem dança fado.»'],
  beats:[['她给你写了一张训练计划，字迹像军令。','She writes you a training plan in handwriting like military orders.','Escreve-te um plano de treino com uma letra que parece uma ordem militar.'],
   ['“身体不会撒谎，”她说，“人会。”','"Bodies don\'t lie," she says. "People do."','«O corpo não mente», diz ela. «As pessoas mentem.»'],
   ['她请你去看周五晚上的比赛，坐在教练席正后方。','She invites you to Friday night\'s game, seats right behind the bench.','Convida-te para o jogo de sexta à noite, mesmo atrás do banco.']],
  truth:['“你练这些，是为了被看见吗？说实话。”','"Do you train so people will look at you? Be honest."','«Treinas para que reparem em ti? Sê sincero.»']},
 ines:{n:['伊内丝·卡瓦略','Inês Carvalho','Inês Carvalho'],s:['伊内丝','Inês','Inês'],p:['她','her','ela'],role:['里斯本的前女友','Ex-girlfriend from Lisbon','A ex-namorada de Lisboa'],romance:1,group:'leave',loc:'shop',cond:s=>s.week>=25,
  meet:['店门口站着一个你认识的人。伊内丝，从里斯本飞了十一个小时。“你没回我的信。所以我来了。”','Someone you know is standing at the door. Inês, eleven hours from Lisbon. "You didn\'t answer my letters. So I came."','Está alguém que conheces à porta. A Inês, onze horas de voo desde Lisboa. «Não respondeste às minhas cartas. Por isso vim.»'],
  beats:[['她吃了你烤的沙丁鱼，说“你妈做的更好”，然后哭了。','She eats your grilled sardines, says "your mother\'s are better," and then cries.','Come as tuas sardinhas, diz «as da tua mãe são melhores» e depois chora.'],
   ['你们在主街走。她说这里的天太大了，大得让人害怕。','You walk down Main Street. She says the sky here is too big. Frighteningly big.','Andam pela rua principal. Ela diz que o céu aqui é grande demais. Dá medo.'],
   ['她明天就走。','She leaves tomorrow.','Ela parte amanhã.']],
  truth:['“当年你为什么走？我要真正的答案。”','"Why did you leave back then? I want the real answer."','«Porque é que foste embora? Quero a resposta verdadeira.»']},
 roz:{n:['罗兹·梅菲尔德','Roz Mayfield','Roz Mayfield'],s:['罗兹','Roz','Roz'],p:['她','her','ela'],role:['油田公司工程师','Oilfield engineer','Engenheira petrolífera'],romance:1,group:'mirror',loc:'bar',cond:s=>s.week>=7,
  meet:['穿着油田工装的女工程师坐到你旁边：“我在特拉维斯手下干活。别紧张，我也不喜欢他。”','An engineer in oilfield coveralls sits down next to you. "I work for Travis. Relax — I don\'t like him either."','Uma engenheira de fato-macaco senta-se ao teu lado. «Trabalho para o Travis. Calma, eu também não gosto dele.»'],
  beats:[['她给你讲钻井，讲得像在讲诗。','She talks about drilling like she\'s reciting poetry.','Fala de perfuração como quem recita poesia.'],
   ['“特拉维斯想要你那块地，不是为了店。”她没再说下去。','"Travis wants your land, and it isn\'t for the restaurant." She doesn\'t say more.','«O Travis quer o teu terreno, e não é por causa do restaurante.» Não diz mais nada.'],
   ['她说她需要这份工作，但不需要这个老板。','She says she needs the job, not the boss.','Diz que precisa do emprego, não do patrão.']],
  truth:['“你知道一些关于特拉维斯的事，对吧？告诉我。”','"You know something about Travis, don\'t you? Tell me."','«Sabes alguma coisa sobre o Travis, não sabes? Conta-me.»']},
 kyle:{n:['凯尔·布伦南','Kyle Brennan','Kyle Brennan'],s:['凯尔','Kyle','Kyle'],p:['他','him','ele'],role:['农机修理工，想组乐队','Tractor mechanic, wants a band','Mecânico de tratores, quer formar uma banda'],romance:1,group:'mirror',loc:'bar',cond:s=>s.week>=5,
  meet:['舞台上，一个修农机的家伙抱着吉他把威利·尼尔森唱跑了调。他看见你的琴盒：“你也弹？来，救救我。”','On stage, a tractor mechanic is mangling Willie Nelson on guitar. He spots your case. "You play? Get up here and save me."','No palco, um mecânico de tratores está a massacrar Willie Nelson à guitarra. Vê o teu estojo. «Tocas? Anda cá salvar-me.»'],
  beats:[['他连乐队名字都想好了：孤星法多。','He\'s already named the band: Lone Star Fado.','Já tem nome para a banda: Lone Star Fado.'],
   ['你教他葡萄牙吉他的指法。他学得很笨，但很认真。','You teach him Portuguese guitar fingering. He\'s clumsy but serious.','Ensinas-lhe a dedilhar a guitarra portuguesa. É desajeitado, mas leva aquilo a sério.'],
   ['你们唱了半首歌，厄尔没让你们下台。','You get through half a song and Earl won\'t let you off the stage.','Cantam meia canção e o Earl não vos deixa sair do palco.']],
  truth:['“我们把那首法多改编唱完吧。整首。你敢吗？”','"Let\'s finish that fado cover. The whole thing. You in?"','«Vamos cantar aquele fado até ao fim. Inteiro. Tens coragem?»']},
 delphine:{n:['德尔菲娜·马尔凯蒂','Delphine Marchetti','Delphine Marchetti'],s:['德尔菲娜','Delphine','Delphine'],p:['她','her','ela'],role:['奥斯汀来的食评博主','Food blogger from Austin','Crítica gastronómica de Austin'],romance:1,group:'leave',loc:'shop',story:1,
  meet:['拿相机的女人点了菜单上的每一道菜：“奥斯汀的食评博主。别紧张，我只写真话。”','A woman with a camera orders everything on the menu. "Food blogger, Austin. Relax, I only write the truth."','Uma mulher de máquina fotográfica pede tudo o que está na ementa. «Crítica gastronómica, Austin. Calma, só escrevo a verdade.»'],
  beats:[['她说你的店“有故事，但菜单还没想好要讲哪一个”。','She says your place "has a story, but the menu hasn\'t decided which one to tell."','Diz que o teu restaurante «tem uma história, mas a ementa ainda não decidiu qual contar».'],
   ['她给你拍了一组照片，标题叫《孤星下的里斯本》。','She shoots a photo series of you titled "Lisbon Under the Lone Star."','Faz-te uma série de fotografias chamada «Lisboa sob a Estrela Solitária».'],
   ['她建议你把店名改成一个更好念的英文名。','She suggests renaming the place to something easier to say in English.','Sugere que mudes o nome do restaurante para algo mais fácil de dizer em inglês.']],
  truth:['“我还是觉得你该改店名。‘泽家’这个名字，美国人念不出来。你同意吗？”','"I still think you should rename it. Nobody can say Zé\'s. Agree?"','«Continuo a achar que devias mudar o nome. Ninguém sabe dizer Zé\'s. Concordas?»']},
 grace:{n:['格蕾丝·霍洛韦','Grace Holloway','Grace Holloway'],s:['格蕾丝','Grace','Grace'],p:['她','her','ela'],role:['处理遗产的市政律师','Town attorney handling the estate','Advogada municipal responsável pela herança'],romance:1,group:'root',loc:'main',formal:1,story:1,
  beats:[['她把遗产文件一页一页讲给你听，没有一句废话。','She walks you through the estate papers page by page, not a wasted word.','Explica-te os papéis da herança página a página, sem uma palavra a mais.'],
   ['“若泽签字的时候说，你会来的。他很确定。”','"When José signed, he said you\'d come. He was certain."','«Quando o José assinou, disse que tu virias. Tinha a certeza.»'],
   ['她下班后在主街夜跑，跟你打了个照面，第一次笑了。','She jogs down Main Street after work, passes you, and smiles for the first time.','Vai a correr pela rua principal depois do trabalho, cruza-se contigo e sorri pela primeira vez.']],
  truth:['“一年快到了。你要留下吗？我问的是你，不是遗嘱。”','"The year\'s nearly up. Are you staying? I\'m asking you, not the will."','«O ano está quase a acabar. Vais ficar? Estou a perguntar-te a ti, não ao testamento.»']},
 maya:{n:['陈玛雅','Maya Chen','Maya Chen'],s:['玛雅','Maya','Maya'],p:['她','her','ela'],role:['社区大学讲师，从休斯敦来','College instructor from Houston','Professora do politécnico, vinda de Houston'],romance:1,group:'leave',loc:'college',cond:s=>s.week>=2,accentLove:1,
  meet:['走廊里，一个年轻讲师抱着一摞作业：“你是开烧烤店的那个？我是玛雅。这里没有像样的咖啡，你那儿有吗？”','In the hallway, a young instructor juggles a stack of papers. "You\'re the barbecue guy? I\'m Maya. There\'s no decent coffee in this town. Do you have any?"','No corredor, uma jovem professora equilibra uma pilha de trabalhos. «És o do churrasco? Sou a Maya. Não há café decente nesta terra. Tens algum?»'],
  beats:[['她每周五都劝你去奥斯汀：“那儿才有你这样的人。”','Every Friday she tells you to go to Austin. "That\'s where people like you are."','Todas as sextas diz-te para ires para Austin. «É lá que está gente como tu.»'],
   ['她一边改作业一边骂学生，骂完又给他们加了分。','She curses her students while grading, then bumps their scores.','Pragueja contra os alunos enquanto corrige e depois sobe-lhes a nota.'],
   ['“我们都只是暂时在这儿，对吧？”','"We\'re both just passing through, right?"','«Estamos os dois aqui só de passagem, não é?»']],
  truth:['“说实话——你也想走，对不对？”','"Be honest — you want to leave too, don\'t you?"','«Sê sincero — também queres ir embora, não queres?»']},
 earl:{n:['厄尔·惠特莫尔','Earl Whitmore','Earl Whitmore'],s:['厄尔','Earl','Earl'],p:['他','him','ele'],role:['孤星酒吧老板，老兵','Owner of the Lone Star Saloon, veteran','Dono do Lone Star Saloon, veterano de guerra'],loc:'bar',
  meet:['吧台后的老头上下打量你：“若泽的外甥。他欠我一瓶波本，你还。”他倒了两杯，自己喝了一杯。“开车会吗？不会？上帝啊。”','The old man behind the bar looks you up and down. "José\'s nephew. He owed me a bottle of bourbon. You\'re paying." He pours two and drinks one himself. "Can you drive? No? Lord."','O velho do balcão mede-te de cima a baixo. «O sobrinho do José. Ele devia-me uma garrafa de bourbon. Pagas tu.» Serve dois copos e bebe um. «Sabes conduzir? Não? Valha-me Deus.»'],
  beats:[['厄尔讲了一个关于若泽和一头逃跑的公牛的故事，你不确定是真的。','Earl tells a story about José and a runaway bull. You\'re not sure it\'s true.','O Earl conta uma história sobre o José e um touro fugido. Não tens a certeza de que seja verdade.'],
   ['“这镇子不喜欢新东西，”他说，“但它会习惯。像习惯天气。”','"This town don\'t like new things," he says. "But it gets used to them. Like weather."','«Esta terra não gosta de coisas novas», diz ele. «Mas habitua-se. Como ao tempo.»']]},
 albertina:{n:['阿尔贝蒂娜太太','Dona Albertina','Dona Albertina'],s:['阿尔贝蒂娜','Albertina','Albertina'],p:['她','her','ela'],role:['亚速尔裔老太太，教堂义工','Azorean-born church volunteer','Senhora açoriana, voluntária da igreja'],loc:'church',accentLove:1,
  beats:[['她用半吊子葡语给你讲 1958 年坐船来的事，讲到一半换成英语。','In half-remembered Portuguese she tells you about the boat in 1958, switching to English halfway.','No português meio esquecido conta-te a viagem de barco em 1958 e, a meio, passa para inglês.'],
   ['她摸你的脸：“太瘦了。若泽也是这么瘦着来的。”','She pats your cheek. "Too thin. José came over this thin too."','Dá-te uma palmadinha na cara. «Magro demais. O José também chegou assim magrinho.»']]},
 dale:{n:['戴尔·金凯德牧师','Pastor Dale Kincaid','Pastor Dale Kincaid'],s:['戴尔牧师','Pastor Dale','Pastor Dale'],p:['他','him','ele'],role:['浸信会牧师，镇议员','Baptist pastor, town councilman','Pastor batista, vereador'],loc:'church',formal:1,accentHard:1,
  beats:[['牧师握手很用力。“我们这里欢迎勤劳的人。”他强调了“勤劳”。','The pastor\'s handshake is firm. "We welcome hard-working folks here." He leans on "hard-working."','O aperto de mão do pastor é forte. «Aqui recebemos bem quem trabalha.» Carrega no «trabalha».'],
   ['“酒是另一回事，孩子。”','"Liquor\'s another matter, son."','«O álcool é outra conversa, filho.»']]},
 travis:{n:['特拉维斯·博伊德','Travis Boyd','Travis Boyd'],s:['特拉维斯','Travis','Travis'],p:['他','him','ele'],role:['油田服务公司老板','Oilfield services boss','Patrão de uma empresa de serviços petrolíferos'],loc:'gym',
  beats:[['特拉维斯卧推的时候让你帮他数数，数到十二他还不肯停。','Travis makes you count his bench reps. At twelve he still won\'t stop.','O Travis pede-te que lhe contes as repetições no supino. Aos doze ainda não quer parar.'],
   ['“那块地你留着干嘛？”他笑着问，好像在开玩笑。','"What do you even want that land for?" he asks, smiling like it\'s a joke.','«Para que queres aquele terreno?», pergunta a sorrir, como se fosse brincadeira.']]},
 beto:{n:['贝托·雷耶斯','Beto Reyes','Beto Reyes'],s:['贝托','Beto','Beto'],p:['他','him','ele'],role:['牧场主，露西娅的父亲','Rancher, Lucía\'s father','Rancheiro, pai da Lucía'],loc:'ranch',accentHard:1,

/* ---------- shop simulation ---------- */
function simShop(mode){
 const slot=S.slot,wknd=S.day>=6;
 const types=Object.keys(CUST).filter(k=>CUST[k].slots.includes(slot)&&(!CUST[k].weekend||wknd));
 let n=Math.round([3,5,5][slot]*(0.6+Math.max(0,S.rep)/60)*R(0.75,1.25)*trafficMult()+(wknd&&slot===1?2:0)+(slot===2?Math.floor(S.online/25)+(has('fado')?2:0):0));
 n=clamp(n,1,18);
 const {sK,sH,sE}=staffSums();
 const kitchen=1.2+sK+S.stats.oficio/45+(mode==='cook'?2:mode?0.6:0)+(has('smoker')?1.2:0);
 const groups=[];
 for(let i=0;i<n;i++){const ty=pick(types);groups.push({t:ty,arr:RI(0,3),size:RI(1,CUST[ty].size),w:0})}
 groups.sort((a,b)=>a.arr-b.arr);
 const rows=[];let rev=0,tips=0,left=0,errs=0,served=0,acc=0,seated=[];
 for(let r=0;r<7;r++){
  groups.filter(g=>g.arr===r).forEach(g=>{if(seated.length>=seats()){left++;rows.push({c:g.t,s:g.size,d:null,o:'full',ok:0,m:0});S.rep-=0.3}else seated.push(g)});
  acc+=kitchen;let cap=Math.floor(acc);acc-=cap;
  const still=[];
  for(const g of seated){
   if(cap>0){cap--;const res=serve(g,mode,sE,sH);rows.push(res);rev+=res.m;tips+=res.tip||0;if(res.ok===1)served++;if(res.err)errs++;if(res.ok===0)left++}
   else{g.w++;if(g.w>CUST[g.t].pat){left++;rows.push({c:g.t,s:g.size,d:null,o:'wait',ok:0,m:0});S.rep-=0.5}else still.push(g)}
  }
  seated=still;
 }
 seated.forEach(g=>{left++;rows.push({c:g.t,s:g.size,d:null,o:'closed',ok:0,m:0})});
 if(slot===1&&has('tablet')){const dl=Math.round(R(20,60)*(0.5+S.online/100));rev+=dl}
 if(mode==='cook')S.grillQ=1;
 S.wk.rev+=rev+tips;S.cash+=rev+tips;
 dirty(n);
 lastReport={slot,mode,rows,rev:Math.round(rev),tips:Math.round(tips),left,errs,served,week:S.week,day:S.day};
 return lastReport;
}
function serve(g,mode,sE,sH){
 const c=CUST[g.t];
 const cand=S.menu.filter(Boolean).filter(k=>{const d=DISH[k];return !d.ing||S.inv[d.ing]>=g.size});
 if(!cand.length){S.rep-=0.4;return {c:g.t,s:g.size,d:null,o:'empty',ok:0,m:0}}
 let best=null,bs=-9;
 for(const k of cand){const d=DISH[k];let sc=(d.pref[g.t]||0)+R(0,0.8)+(k===S.special?1.2:0)+(k==='coffee'&&has('espresso')&&(g.t==='trucker'||g.t==='student')?1:0);if(dishPrice(k)*PRICE[S.price].pm>c.bud*1.2)sc-=2;if(mode==='upsell')sc+=d.price/20;if(sc>bs){bs=sc;best=k}}
 const d=DISH[best];let pref=(d.pref[g.t]||0)+(best===S.special?1:0)+(mode==='cook'?(S.grillQ-1)*2.5:0)-(S.price==='premium'&&S.rep<50?0.7:0);
 if(d.ing)S.inv[d.ing]-=g.size;
 let m=dishPrice(best)*PRICE[S.price].pm*g.size*(mode==='upsell'?1+S.stats.oficio/200:1);
 let er=0.03+sE+hygieneErr()+(mode==='host'?{'浓':0.15,'中':0.05,'淡':0}[S.accent]:0);
 if(mode==='cook')er*=0.5;if(S.legs)er*=2;
 const err=Math.random()<er;
 let tip=0;
 if(mode==='host')tip=g.size*charm()/75*R(0.5,1.5);else if(sH)tip=g.size*sH*R(0.3,1);if(mode==='cook')tip=g.size*R(0.3,1)*S.grillQ*S.grillQ;
 if(err){m*=0.5;S.rep-=0.6;return {c:g.t,s:g.size,d:best,o:'error',ok:2,m,err:1,tip:0}}
 S.rep+=pref>=2?0.25*(1-Math.max(0,S.rep)/130)+(S.price==='cheap'?0.05:0):pref<1?-0.1:0.05*(1-Math.max(0,S.rep)/130);if(pref>=2){S.wk.happy++;S.happyTotal++}
 if(g.t==='student'||g.t==='oil'){const up=(pref>=2?0.4:0)+(d.fusion?0.4:0);S.online=clamp(S.online+up*(1-S.online/110)-(pref>=2?0:0.2),0,100)}
 return {c:g.t,s:g.size,d:best,o:pref>=2?'happy':pref>=1?'ok':'meh',ok:1,m,tip};
}
const OUT=k=>({full:t('满座离开','Left: no tables','Saiu: sem mesa'),wait:t('等太久走了','Left: waited too long','Saiu: esperou demais'),closed:t('打烊没轮上','Didn\'t get served','Não foi atendido'),empty:t('没菜了','Nothing left to eat','Já não havia comida'),error:t('上错菜，打半价','Wrong order, half price','Prato trocado, meio preço'),happy:t('吃得很开心','Loved it','Adorou'),ok:t('还行','Fine','Razoável'),meh:t('有点失望','Disappointed','Desiludido')}[k]);
function reportHTML(r){
 const head=t(`<p>${SLOT()[r.slot]}营业：来了 ${r.rows.length} 组，服务 ${r.served} 组，走掉 ${r.left} 组${r.errs?`，上错 ${r.errs} 次`:''}。收入 <b>$${r.rev}</b>${r.tips?`，小费 <b>$${r.tips}</b>`:''}。</p>`,

 return head+roomHTML(r)+`<div class="tblwrap"><table class="rep"><tr><th>${t('客群','Party','Grupo')}</th><th>${t('人数','Size','Pessoas')}</th><th>${t('点了','Ordered','Pediu')}</th><th>${t('结果','Result','Resultado')}</th><th>${t('收入','Paid','Pagou')}</th></tr>${rows}</table></div>`;

/* ===================== v0.3 — shop layer: hygiene & inspections, crew morale & training, standing orders =====================
   S.clean 0–100: every service dirties the kitchen; under 40 the error rate rises, under 20 it rises again.
   S.grade A/B/C: county health inspections (random, roughly monthly) post a grade that changes foot traffic.
   S.sm[id] = {m: morale 0–10, lv: training 0–2}: trained crew work faster and make fewer mistakes;
     morale falls by one each week (two if you can't make payroll) and a crew member at 0 quits.

  const tick=()=>{x+=dir*(1.1+flips*0.35)*(reduce?0.5:1);if(x>=100){x=100;dir=-1}if(x<=0){x=0;dir=1}nEl.style.left=x+'%';miniRAF=requestAnimationFrame(tick)};tick();
  btn.onclick=()=>{const ok=x>=zone&&x<=zone+width;hits+=ok?1:0;flips++;fEl.textContent=Array.from({length:3},(_,i)=>i<flips?(i<hits?'●':'✕'):'○').join(' ');toast(ok?t('火候正好！','Perfect sear!','No ponto!'):t('烤焦了一点','A little charred','Um pouco queimado'));
   if(flips>=3){cancelAnimationFrame(miniRAF);miniRAF=null;btn.disabled=true;setTimeout(()=>grillFinish(hits),450)}else place()};
 }
 if(cur.mini==='arm'){
  const need=cur.need;let taps=0,start=0,done=false;const fill=$('#afill'),cnt=$('#acount');
  const end=()=>{done=true;cancelAnimationFrame(miniRAF);miniRAF=null;btn.disabled=true;const win=taps>=need;setTimeout(()=>{cur=null;queue.unshift(armResult(win,true));next()},400)};
  const tick=()=>{const left=Math.max(0,5-(performance.now()-start)/1000);cnt.textContent=`${taps} / ${need} · ${left.toFixed(1)}s`;if(left<=0&&!done)end();else miniRAF=requestAnimationFrame(tick)};
  btn.onclick=()=>{if(done)return;if(!start){start=performance.now();btn.textContent=res(t('用力！','Push!','Força!'));tick()}taps++;fill.style.width=Math.min(100,taps/need*100)+'%';if(taps>=need)end()};
 }
}

function maybeDaily(){
 if(S.week<2||S.dailyLast===dayIndex()||Math.random()>0.2)return;
 const pool=DAILY.filter(e=>(!e.cond||e.cond())&&(S.dailySeen[e.id]||0)<2);if(!pool.length)return;
 const tot=pool.reduce((a,e)=>a+e.w,0);let r=Math.random()*tot,e=pool[0];for(const x of pool){r-=x.w;if(r<=0){e=x;break}}
 S.dailyLast=dayIndex();S.dailySeen[e.id]=(S.dailySeen[e.id]||0)+1;queue.push(e.run());
}

function costOf(a){return Math.max(0,a.cost+(a.costMod?a.costMod():0))}
function doAction(a){
 if(cur)return;if(S.flags.dbgInfEnergy)S.energy=10;
 const req=a.req?a.req():true;
 if(req!==true){toast(req);return}
 const c=costOf(a);
 if(S.energy<c){toast(t('精力不够了，回去睡吧','Out of energy — go to bed','Sem energia — vai dormir'));return}
 S.energy-=c;if(a.money)S.cash-=a.money;if(a.pre)a.pre();if(a.city&&S.tripWith&&a.id!=='home'){addLike(S.tripWith,0.5)}
 if(a.noSlot){push(a.run());return}
 if(!(a.loc==='shop'&&['host','cook','upsell'].includes(a.id)))autoShop();awayShop();
 pendingAdvance=true;
 const sc=a.run();
 if(sc)push(sc);else next();
}

// the stretch of highway a trip actually uses: walk the via list from home, clipping each road between junctions
function routePath(id){
 const c=CITIES[id];if(!c||!c.via||!c.via.length)return null;
 const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
 const near=(pts,p)=>{let bi=0,bd=1e9;pts.forEach((q,i)=>{const d=d2(q,p);if(d<bd){bd=d;bi=i}});return bi};
 let pos=[TX_PT.home[0],TX_PT.home[1]];const out=[pos];
 c.via.forEach((k,i)=>{const r=ROADS[k];if(!r)return;const a=near(r.pts,pos);let target;
  if(i<c.via.length-1&&ROADS[c.via[i+1]]){const nx=ROADS[c.via[i+1]].pts;let best=1e9;for(const q of r.pts)for(const w of nx){const d=d2(q,w)+0.001*d2(q,pos);if(d<best){best=d;target=q}}}
  else target=[cityPos(id)[0],cityPos(id)[1]];
  const b=near(r.pts,target);const seg=a<=b?r.pts.slice(a,b+1):r.pts.slice(b,a+1).reverse();out.push(...seg);pos=seg[seg.length-1]});
 out.push([cityPos(id)[0],cityPos(id)[1]]);return out;
}
function roadName(k){return ROADS[k]?tt(ROADS[k].n):''}
function viaText(c){const v=(c&&c.via)||[];return v.length?v.map(roadName).join(' → '):''}
function cityPos(id){return id==='home'?TX_PT.home:TX_PT[id]}
function legMiles(a,b){const A=cityPos(a),B=cityPos(b);if(!A||!B)return 0;const r=Math.PI/180,R=3959;const dLa=(B[1]-A[1])*r,dLo=(B[0]-A[0])*r;const h=Math.sin(dLa/2)**2+Math.cos(A[1]*r)*Math.cos(B[1]*r)*Math.sin(dLo/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h))*1.25)}
function legFare(m){if(S&&S.flags&&S.flags.dbgFreeTravel)return 0;return canDrive()?Math.round(m*CAR().gas):Math.round(8+m*0.12)}
// keep driving to another city without going home first
function roadTripScene(){
 const here=S.where;const ids=Object.keys(CITIES).filter(k=>k!==here&&cityPos(k)).sort((a,b)=>legMiles(here,a)-legMiles(here,b));
 const ch=ids.slice(0,8).map(id=>{const m=legMiles(here,id),f=legFare(m);return {t:t(`${res(CITIES[id].n,'zh')} · ${m} 英里 · $${f}`,`${res(CITIES[id].n,'en')} · ${m} mi · $${f}`,`${res(CITIES[id].n,'pt')} · ${m} mi · $${f}`),req:()=>S.slot>1?t('太晚了，明早再走','Too late — leave in the morning','É tarde — parte de manhã'):S.energy<2?t('精力不够','Not enough energy','Sem energia'):MONEY(f)(),fx:()=>{pendingAdvance=true;S.cash-=f;S.wk.spend+=f;S.energy-=2;S.tripLegs=(S.tripLegs||0)+1;carDrive(m);const from=S.where;S.where=id;S.innTonight=null;S.visited[id]=(S.visited[id]||0)+1;log(`从${res(CITIES[from].n,'zh')}开到${res(CITIES[id].n,'zh')}`,`Drove on from ${res(CITIES[from].n,'en')} to ${res(CITIES[id].n,'en')}`,`Seguiste de ${res(CITIES[from].n,'pt')} para ${res(CITIES[id].n,'pt')}`)},
  next:()=>{const c=CITIES[id];const road=ROAD_EVENTS.filter(e=>!e.cond||e.cond(c));const v=viaText(c);return {title:c.n,meta:REGION(c.region)+(v?' · '+v:''),text:[t('你没有回家，而是继续往前开。','You don\'t head home — you keep driving.','Não voltas para casa — continuas a conduzir.'),tt(c.desc),...(c.arrive?c.arrive():[])],choices:[{t:t('到了','Arrive','Chegar'),next:()=>road.length&&Math.random()<0.4?pick(road).run(c):null}]}}}});
 ch.push({t:t('算了，留在这里','Never mind, stay here','Deixa, ficar aqui')});
 return {title:t('继续上路','Keep driving','Seguir viagem'),meta:t('公路旅行','Road trip','Viagem de estrada'),text:[t(`从${res(CITIES[here].n,'zh')}出发，按距离列出最近的八座城市。一路开下去，不必先回圣鲁伊斯；回家时按最后所在城市的距离付路费。`,`From ${res(CITIES[here].n,'en')}, the eight nearest cities by road. Drive on without going back to San Luís; when you finally head home you pay the fare from wherever you are.`,`A partir de ${res(CITIES[here].n,'pt')}, as oito cidades mais próximas por estrada. Segue sem voltar a San Luís; quando voltares, pagas a viagem a partir de onde estiveres.`)],choices:ch};
}
// map drawing helper: one highway polyline + its label
function roadsSVG(){
 return Object.keys(ROADS).map(k=>{const r=ROADS[k];const pts=r.pts.map(([a,b])=>`${txX(a)},${txY(b)}`).join(' ');const mid=r.lab||r.pts[Math.floor(r.pts.length/2)];
  return `<polyline points="${pts}" class="${r.main?'txm-road':'txm-hwy'}"><title>${tt(r.n)}</title></polyline>${r.main||r.nolab?'':`<text x="${txX(mid[0])+4}" y="${txY(mid[1])-4}" class="txm-hwylab">${r.n[1]}</text>`}`}).join('');
}

const GUIDE=[
 [['时间与精力','Time and energy','Tempo e energia'],['一天分早晨、午间、夜晚三个时段，每个时段做一件事。每天精力 10 点，行动消耗 1–4 点；灰色的行动点一下会告诉你还差什么。睡觉恢复，乡愁太重会睡不好。周日夜里结算账本，一年 48 周，第 49 周迎来一周年结局。','A day has three slots — morning, midday, night — and you do one thing per slot. You get 10 energy a day; actions cost 1–4, and tapping a greyed-out action tells you what\'s missing. Sleep restores it; heavy homesickness ruins sleep. The books close every Sunday night; the year is 48 weeks, with the one-year ending in week 49.','Um dia tem três períodos — manhã, almoço, noite — e fazes uma coisa por período. Tens 10 de energia por dia; as ações custam 1–4, e tocar numa ação a cinzento diz-te o que falta. O sono recupera-a; muita saudade estraga o sono. As contas fecham ao domingo à noite; o ano tem 48 semanas e o final de um ano chega na semana 49.']],
 [['四项属性','The four stats','Os quatro atributos'],['魅力（基础值加上口音、肌肉、衣着的加成，加成最多 +30）、手艺、德州味、乡愁。属性越高涨得越慢。德州味上升会压低乡愁，乡愁上升也会拖累德州味；德州味够高之后，不碰家乡的东西乡愁反而会下降。','Charm (base plus bonuses from accent, muscle and clothes, at most +30), Craft, Texanness and Homesickness. The higher a stat, the slower it grows. Rising Texanness pushes homesickness down and vice versa; once you are Texan enough, homesickness fades if you avoid things from home.','Charme (base mais bónus de sotaque, músculo e roupa, no máximo +30), Ofício, Texanidade e Saudade. Quanto mais alto um atributo, mais devagar sobe. A Texanidade empurra a saudade para baixo e vice-versa; quando já és texano o suficiente, a saudade desvanece se evitares coisas de casa.']],
 [['口音与肌肉','Accent and muscle','Sotaque e músculo'],['口音分浓、中、淡三档，每周只能在店里的镜子前挪一档。浓口音魅力最高，但正式场合吃亏、上错菜多、某些人信任涨得慢。肌肉 0–5 级，每级魅力 +4，要连续训练维持，两周不练掉一级。','Accent has three settings — heavy, medium, light — and you can move one step a week at the shop mirror. Heavy gives the most charm but hurts in formal settings, causes wrong orders and slows some people\'s trust. Muscle runs 0–5, +4 charm per level; keep training or lose a level after two weeks off.','O sotaque tem três níveis — carregado, médio, leve — e só podes mudar um passo por semana, ao espelho do restaurante. O carregado dá mais charme mas prejudica em contextos formais, causa pratos trocados e atrasa a confiança de algumas pessoas. O músculo vai de 0 a 5, +4 de charme por nível; continua a treinar ou perdes um nível ao fim de duas semanas.']],
 [['营业','Running the shop','O restaurante'],['三种营业方式：亲自招呼（魅力与口音生效、小费多）、下厨帮忙（烤架小游戏决定火候）、推荐贵菜。8 张桌子（露天座位升级后 12 张），客人有耐心和预算，等太久会走。每周房租 $250，另有营收 16% 的杂费。','Three ways to open: work the floor (charm and accent count, more tips), work the kitchen (the grill mini-game sets the quality) or upsell. Eight tables (twelve with the patio), and customers have patience and budgets — wait too long and they leave. Rent is $250 a week plus 16% of revenue in overheads.','Três maneiras de abrir: atender (contam o charme e o sotaque, mais gorjetas), cozinhar (o minijogo da grelha decide a qualidade) ou sugerir pratos caros. Oito mesas (doze com a esplanada); os clientes têm paciência e orçamento — se esperarem demais, vão-se embora. Renda de $250 por semana mais 16% da receita em despesas.']],
 [['经营面板','The Business panel','O painel Negócio'],['定价（平价 / 正常 / 高档）、本周招牌菜（+$2、所有人更想点）、浮动市价（每周一变动，偶有紧缺或降价）、外烩订单（备齐食材后交付，过期掉口碑）、店铺升级、长期供货（在各地结交的人给的永久折扣）。','Pricing (budget / standard / premium), the house special (+$2, everyone orders it more), a market whose prices change every Monday (with shortages and sales), catering orders (stock the ingredients and deliver; missed deadlines cost reputation), upgrades, and supply deals — permanent discounts from people you befriend around Texas.','Preços (económico / normal / premium), prato da casa (+$2, toda a gente o pede mais), um mercado que muda todas as segundas (com faltas e promoções), encomendas de catering (junta os ingredientes e entrega; prazos falhados custam reputação), melhorias e acordos de fornecimento — descontos permanentes de pessoas que conheces pelo Texas.']],
 [['卫生、员工与订货','Hygiene, staff and standing orders','Higiene, equipa e encomendas fixas'],['每次营业都会弄脏厨房，太脏出错多；县卫生检查大约每月一次，评级影响客流。最多可雇 5 名员工（乔琳、玛丽索尔、汤米，以及认识后可雇的德肖恩和露丝·安）。员工有士气与培训等级：员工餐和培训能提升，发不出工资士气会掉，降到零会辞职。长期订货每周一按固定价送到，不受市价影响。','Every service dirties the kitchen, and a dirty kitchen makes mistakes; county health inspections come roughly monthly and the grade changes foot traffic. You can hire up to five staff (Jolene, Marisol, Tommy, and — once you know them — DeShawn and Ruth Ann). Staff have morale and training: family meals and training raise them, missed payroll lowers morale, and at zero they quit. Standing orders arrive every Monday at a fixed price, whatever the market does.','Cada serviço suja a cozinha, e uma cozinha suja erra mais; a inspeção sanitária do condado vem mais ou menos uma vez por mês e a nota muda a clientela. Podes contratar até cinco pessoas (Jolene, Marisol, Tommy e, depois de os conheceres, o DeShawn e a Ruth Ann). A equipa tem moral e formação: refeições do pessoal e formação melhoram-nas, salários em atraso baixam a moral e, a zero, despedem-se. As encomendas fixas chegam todas as segundas a preço fixo, faça o mercado o que fizer.']],
 [['出行、旅店与公路旅行','Travel, lodging and road trips','Viagens, alojamento e viagens de estrada'],['早晨或午间可以出门，花 2 点精力。没车坐灰狗巴士；在镇上的辅路二手车场买辆车并跟厄尔学会开车后只付油钱。车场每周换一批具体的二手车，从 1968 年的福特野马到 2019 年的福特皮卡，各有年份、里程、价钱、油耗和每周保险保养费；便宜的老车会半路抛锚，开得越多折价越低，餐车能在外地城市出摊卖菜。近处城市当天往返，远处要过夜；每座城市都有三档旅店，订房就能多住（一趟最多 7 晚）。在外地可以“继续上路去别的城市”，回家时按所在城市的距离付路费。你不在时，有员工就照常营业，没员工就关门掉口碑。','Leave in the morning or at midday for 2 energy. Without a car you take the Greyhound; buy one at the frontage-road car lot and learn to drive with Earl and you only pay for gas. The lot gets a new batch of specific used vehicles every week, from a 1968 Ford Mustang to a 2019 Ford F-150, each with its own year, mileage, price, gas and weekly insurance; cheap old ones break down on the road, every mile you drive lowers the trade-in, and a food truck lets you sell food in other cities. Nearby cities are day trips, far ones need a night; every city has three tiers of lodging, and booking lets you stay longer (up to 7 nights a trip). From any city you can drive on to another; the trip home is priced from wherever you are. While you are away, staff keep the shop open — without staff it stays shut and reputation slips.','Parte de manhã ou ao almoço, por 2 de energia. Sem carro vais de Greyhound; compra um no stand da via de serviço e aprende a conduzir com o Earl e só pagas gasolina. O stand recebe todas as semanas um lote de veículos usados concretos, de um Ford Mustang de 1968 a uma Ford F-150 de 2019, cada um com ano, milhas, preço, gasolina e seguro semanal; os velhos e baratos avariam na estrada, cada milha baixa o valor de retoma, e uma roulote deixa-te vender comida noutras cidades. As cidades perto são ida e volta, as longe pedem dormida; todas têm três níveis de alojamento e reservar deixa-te ficar mais (até 7 noites por viagem). De qualquer cidade podes seguir para outra; o regresso paga-se a partir de onde estiveres. Enquanto estás fora, a equipa mantém o restaurante aberto — sem equipa fica fechado e a reputação cai.']],
 [['恋爱','Romance','Romance'],['16 位恋爱对象各有 7 段剧情、一次真话时刻、一场约会、一场关系危机。魅力只加好感，信任要靠真心话；用“靠脸”捷径会记轻浮计数，满 3 次全镇流言、所有人信任 −1。同时好感 ≥5 的超过 3 人会出事。信任 ≥8 时可以“定下来”，之后可以求婚、在圣安东尼节结婚，一周年选择留下进入第五章「家」。','Sixteen romance options, each with seven story beats, a moment of truth, a date and a crisis. Charm only raises affection; trust comes from honesty. Using the charm shortcut adds to a flirt count — three and the whole town talks, costing everyone\'s trust. More than three people at affection 5+ means trouble. At trust 8 you can settle down, then propose, marry at the Santo António festival and, staying at the one-year mark, enter Chapter 5, "Home".','Dezasseis romances, cada um com sete momentos, um momento da verdade, um encontro e uma crise. O charme só sobe o afeto; a confiança vem da sinceridade. O atalho do charme soma ao contador de namoricos — à terceira, a vila inteira fala e toda a gente perde confiança. Mais de três pessoas com afeto 5+ dá problemas. Com confiança 8 podes assentar, depois pedir em casamento, casar na festa de Santo António e, ficando ao fim de um ano, entrar no Capítulo 5, «Casa».']],
 [['主线与结局','Main story and endings','História e finais'],['四章主线围绕若泽的 12 封信、罐头厂的污染和特拉维斯的阴谋。第四章议会投票看证据、证人、执照、冰暴时是否开火、牧师的信任和口碑；你在德州各地收集的旁证和结交的朋友也会算进去。一周年结局：回里斯本需要乡愁 ≥70；去奥斯汀需要玛雅好感 ≥7；留下时——魅力 ≥80 且信任总和 <20 是「花瓶」，德州味 ≥70 且乡愁 ≤40 是「孤星之子」，德州味与乡愁都 ≥50 且信任总和 ≥40 是「两个家」，其余是「体面的异乡人」。','Four chapters follow José\'s 12 letters, the cannery\'s pollution and Travis\'s scheme. The chapter-4 council vote weighs evidence, witnesses, the liquor license, whether you lit the fire in the ice storm, Pastor Dale\'s trust and your reputation — side evidence and friends from around Texas count too. One-year endings: going home needs homesickness 70+; Austin needs Maya\'s affection 7+; if you stay — charm 80+ with total trust under 20 is "Pretty face", Texanness 70+ with homesickness 40 or less is "Son of the Lone Star", both 50+ with total trust 40+ is "Two homes", anything else is "A decent stranger".','Quatro capítulos seguem as 12 cartas do José, a poluição da fábrica e o esquema do Travis. A votação da câmara no capítulo 4 pesa provas, testemunhas, a licença, se acendeste a lareira na tempestade de gelo, a confiança do pastor e a tua reputação — provas e amigos de todo o Texas também contam. Finais de um ano: voltar a casa pede saudade 70+; Austin pede afeto da Maya 7+; se ficares — charme 80+ com confiança total abaixo de 20 é «Cara bonita», Texanidade 70+ com saudade até 40 é «Filho da Estrela Solitária», ambos 50+ com confiança total 40+ é «Duas casas», e o resto é «Um estrangeiro digno».']]
];
function wikiMatch(...xs){if(!WIKI_Q)return true;const q=WIKI_Q.toLowerCase();return xs.some(x=>['zh','en','pt'].some(l=>res(x,l).toLowerCase().includes(q)))}
function wikiPanel(){
 const secs=[['guide',t('玩法','Guide','Guia')],['people',t('人物','People','Pessoas')],['cities',t('城市','Cities','Cidades')],['roads',t('公路','Roads','Estradas')],['dishes',t('菜谱','Recipes','Receitas')],['cars',t('车辆','Vehicles','Veículos')],['letters',t('信','Letters','Cartas')]];
 const nav=`<div class="acts wiki-nav">${secs.map(([k,n])=>`<button class="btn-s ${WIKI_SEC===k?'on':''}" data-wsec="${k}">${n}</button>`).join('')}</div><label class="mini" for="wikiq">${t('搜索','Search','Pesquisar')}<input type="search" id="wikiq" class="wiki-q" value="${WIKI_Q.replace(/"/g,'&quot;')}"></label>`;
 const one=sec=>{let body='';
 if(sec==='guide')body=GUIDE.filter(([h,b])=>wikiMatch(tt(h),tt(b))).map(([h,b])=>`<div class="wiki-e"><b>${tt(h)}</b><p class="mini">${tt(b)}</p></div>`).join('');
 if(sec==='people'){const ids=Object.keys(NPCS).filter(k=>wikiMatch(tt(NPCS[k].n),tt(NPCS[k].role)));const met=ids.filter(k=>rel(k).met).length;
  body=`<p class="mini">${t(`已认识 ${Object.keys(NPCS).filter(k=>rel(k).met).length}/${Object.keys(NPCS).length}`,`Met ${Object.keys(NPCS).filter(k=>rel(k).met).length}/${Object.keys(NPCS).length}`,`Conhecidos ${Object.keys(NPCS).filter(k=>rel(k).met).length}/${Object.keys(NPCS).length}`)}</p>`+ids.map(k=>{const n=NPCS[k],r=rel(k),known=r.met||debugOn();const where=locName(n.loc)||(CITIES[n.loc]&&CITIES[n.loc].n)||'';
   return `<div class="wiki-e"><b>${known?tt(n.n):'？？？'}</b> ${n.romance?`<span class="grp">${GRP(n.group)}</span>`:''}<p class="mini">${known?tt(n.role)+' · '+where+(r.met?` · ${t('好感','Affection','Afeto')} ${Math.round(r.like)} · ${t('信任','Trust','Confiança')} ${Math.round(r.trust)}`:''):t(`还没见过。常在：${res(where,'zh')}`,`Not met yet. Usually found: ${res(where,'en')}`,`Ainda não conheces. Costuma estar em: ${res(where,'pt')}`)}</p></div>`}).join('')}
 if(sec==='cities')body=Object.keys(CITIES).sort((a,b)=>CITIES[a].miles-CITIES[b].miles).filter(id=>wikiMatch(CITIES[id].n,CITIES[id].desc)).map(id=>{const c=CITIES[id];const v=S.visited[id]||0;
  return `<div class="wiki-e"><b>${c.n}</b> <span class="grp">${REGION(c.region)} · ${c.miles} ${t('英里','mi','mi')}</span><p class="mini">${tt(c.desc)}</p><p class="mini">${t('地点：','Places: ','Locais: ')}${c.locs.map(L=>L.n).join(' · ')}${c.via?' · '+t('路线：','Route: ','Percurso: ')+viaText(c):''}${v?' · '+t(`去过 ${v} 次`,`visited ${v}×`,`visitado ${v}×`):''}</p></div>`}).join('');
 if(sec==='roads')body=Object.keys(ROADS).filter(k=>wikiMatch(tt(ROADS[k].n))).map(k=>{const r=ROADS[k];const on=Object.keys(CITIES).filter(id=>(CITIES[id].via||[]).includes(k));return `<div class="wiki-e"><b>${tt(r.n)}</b> <span class="grp">${r.n[1]}</span><p class="mini">${on.length?t('经过这条路去：','Taken to reach: ','Usada para ir a: ')+on.map(id=>CITIES[id].n).join(' · '):''}</p></div>`}).join('');
 if(sec==='dishes')body=Object.keys(DISH).filter(k=>wikiMatch(tt(DISH[k].n))).map(k=>{const d=DISH[k];const locked=(d.unlock&&!S.flags['dish_'+k])||(d.fusion&&!S.fusion.unlocked);const fans=Object.keys(d.pref||{}).filter(c=>d.pref[c]>=3).map(c=>tt(CUST[c].n)).join('、');
  return `<div class="wiki-e wiki-pic">${dishArt(k,locked&&!debugOn()?'art-locked':'')}<div><b>${locked&&!debugOn()?'？？？':tt(d.n)}</b> <span class="grp">$${d.price} · ${d.ing?tt(ING[d.ing].n):t('无需食材','no ingredient','sem ingrediente')}${d.luso?' · '+t('葡萄牙菜','Portuguese','português'):''}${d.fusion?' · '+t('融合菜','fusion','fusão'):''}</span><p class="mini">${locked?(d.fusion?t('研发融合菜后解锁','Unlocks once you develop fusion dishes','Desbloqueia ao criar pratos de fusão'):t('在德州某地学会后解锁','Learn it somewhere in Texas to unlock','Aprende-o algures no Texas para desbloquear')):(fans?t('最爱的客人：','Favourite with: ','Preferido de: ')+fans:'')}</p></div></div>`}).join('');
 if(sec==='cars')body=`<p class="mini">${t('辅路二手车场每周挂出其中 6 辆。','The frontage-road lot shows six of these each week.','O stand da via de serviço mostra seis destes por semana.')}</p>`+Object.keys(VEHICLES).sort((x,y)=>VEHICLES[x].cost-VEHICLES[y].cost).filter(k=>wikiMatch(carFull(VEHICLES[k]))).map(k=>{const v=VEHICLES[k];return `<div class="wiki-e wiki-pic">${carArt(k)}<div><b>${carFull(v)}</b> <span class="grp">$${fmtMi(v.cost)} · ${fmtMi(v.miles)} ${t('英里','mi','mi')}</span><p class="mini">${tt(v.quirk)}</p></div></div>`}).join('');
 if(sec==='letters')body=`<p class="mini">${t(`你已找到若泽的 ${S.letters}/12 封信。信的全文只在剧情里出现——留意第一到第四章的每一个抽屉、保险柜和旧箱子。`,`You have found ${S.letters}/12 of José's letters. Their full text appears only in the story — watch every drawer, safe and old crate from Chapter 1 to 4.`,`Encontraste ${S.letters}/12 cartas do José. O texto completo só aparece na história — atenção a cada gaveta, cofre e caixa velha do capítulo 1 ao 4.`)}</p><div class="room">${Array.from({length:12},(_,i)=>`<span class="seat ${i<S.letters?'s-happy':'s-gone'}" title="${i+1}"></span>`).join('')}</div>`;
 return body};
 let body;if(WIKI_Q){body=secs.filter(([k])=>k!=='letters').map(([k,n])=>{const b=one(k);return b&&b.includes('wiki-e')?`<h3 class="sub">${n}</h3>`+b:''}).join('')}else body=one(WIKI_SEC);
 const dbg=`<div class="wiki-dbg"><span class="mini">${t('开发者','Developer','Programador')}</span><button class="btn-s ${debugOn()?'on':''}" id="dbgtoggle">${debugOn()?t('关闭调试模式','Turn debug mode off','Desligar modo de depuração'):t('开启调试模式（作弊）','Turn on debug mode (cheats)','Ligar modo de depuração (batotas)')}</button></div>`;
 return nav+(body||`<p class="mini">${t('没有找到。','Nothing found.','Nada encontrado.')}</p>`)+dbg;
}

function bindWikiDebug(){
 document.querySelectorAll('[data-wsec]').forEach(b=>b.onclick=()=>{WIKI_SEC=b.dataset.wsec;render()});
 const q=$('#wikiq');if(q&&q.addEventListener){q.addEventListener('input',()=>{WIKI_Q=q.value;const pos=q.selectionStart;render();const q2=$('#wikiq');if(q2){q2.focus();try{q2.setSelectionRange(pos,pos)}catch(e){}}})}
 const dt=$('#dbgtoggle');if(dt&&dt.addEventListener)dt.onclick=()=>setDebug(!debugOn());
 document.querySelectorAll('[data-cheat]').forEach(b=>b.onclick=()=>{const c=CHEATS.find(x=>x[0]===b.dataset.cheat);cheat(c[2],c[1][0],c[1][1],c[1][2])});
 document.querySelectorAll('[data-dtog]').forEach(b=>b.onclick=()=>{const k=b.dataset.dtog;cheat(()=>{S.flags[k]=!S.flags[k]},'切换开关','Toggle switched','Interruptor alterado')});
 const wk=$('#dbgweek');if(wk&&wk.addEventListener)wk.onchange=()=>cheat(()=>{S.week=+wk.value;S.day=1;S.slot=0;mondaySystems()},'跳到第 '+wk.value+' 周','Jumped to week '+wk.value,'Saltaste para a semana '+wk.value);
 const ct=$('#dbgcity');if(ct&&ct.addEventListener)ct.onchange=()=>cheat(()=>{S.where=ct.value||null;S.tripNights=0;S.tripLegs=0;if(ct.value)S.visited[ct.value]=(S.visited[ct.value]||0)+1},'瞬移','Teleported','Teletransportado');
 const ac=$('#dbgaccent');if(ac&&ac.addEventListener)ac.onchange=()=>cheat(()=>{S.accent=ac.value},'改口音','Accent changed','Sotaque alterado');

function mapPanel(){
 const all=Object.keys(CITIES).sort((a,b)=>CITIES[a].miles-CITIES[b].miles);
 const partners=Object.keys(NPCS).filter(k=>NPCS[k].romance&&rel(k).met&&rel(k).like>=5&&rel(k).trust>=3);

 const how=canDrive()?t(`你开${carName()}，自己开只付油钱（每英里 $${CAR().gas.toFixed(2)}）。`,`You drive your ${carName()}: gas only ($${CAR().gas.toFixed(2)} a mile).`,`Vais de ${carName()}: só pagas gasolina ($${CAR().gas.toFixed(2)} por milha).`):carId()?t(`你有${carName()}，但还没学会开（跟厄尔学开车到第 2 课）。现在只能坐巴士。`,`You own a ${carName()} but can't drive yet (reach lesson 2 with Earl). Bus for now.`,`Tens ${carName()} mas ainda não conduzes (chega à 2.ª aula com o Earl). Por agora, autocarro.`):t('没车就坐灰狗巴士。去镇上的辅路二手车场买辆车，再跟厄尔学会开车，出门会便宜很多。','No car means the Greyhound. Buy one at the frontage-road car lot in town and learn to drive with Earl to travel far cheaper.','Sem carro, vais de Greyhound. Compra um no stand da via de serviço e aprende a conduzir com o Earl para viajares muito mais barato.');
 const here=away()?`<p class="mini">${t('你现在在','You are in','Estás em')} <b>${CITIES[S.where].n}</b>${S.tripWith?' · '+t('同行：','with ','com ')+SH(S.tripWith):''}。${t('在下方的行动板上选「回圣鲁伊斯」回家。','Choose "Go back to San Luís" on the board below to return.','Escolhe «Voltar para San Luís» no painel de ações para regressar.')}</p>`:'';
 const regs=['all',...['central','hill','north','coast','west'].filter(r=>all.some(id=>CITIES[id].region===r))];
 const ids=all.filter(id=>MAP_RG==='all'||CITIES[id].region===MAP_RG);

 if(MAP_FOCUS&&ids.includes(MAP_FOCUS))MAP_PG=Math.floor(ids.indexOf(MAP_FOCUS)/MAP_PER);
 MAP_PG=Math.min(Math.max(0,MAP_PG),pages-1);
 const chips=`<div class="mp-bar">${regs.map(r=>`<button class="btn-s ${MAP_RG===r?'on':''}" data-mrg="${r}">${r==='all'?t('全部','All','Todas'):({central:t('中部','Central','Centro'),hill:t('山地','Hill','Hill'),north:t('北部','North','Norte'),coast:t('沿岸','Coast','Costa'),west:t('西部','West','Oeste')}[r])}</button>`).join('')}</div>`;
 const busy=cur||away()||S.slot>1||S.energy<2;
 const rows=ids.slice(MAP_PG*MAP_PER,(MAP_PG+1)*MAP_PER).map(id=>{const c=CITIES[id],f=fare(c),v=S.visited[id]||0,h=hotelBase(id);const dis=busy||S.cash<f;
  return `<div class="mp-row${MAP_FOCUS===id?' mp-focus':''}" title="${res(tt(c.desc)).replace(/"/g,'&quot;')}"><div class="mp-main"><span class="nm">${c.n}</span>${v?`<span class="mp-v" title="${t(`去过 ${v} 次`,`visited ${v}×`,`visitado ${v}×`)}">✓${v>1?v:''}</span>`:''}<div class="mini mp-meta">${REGION(c.region)} · ${c.miles} ${t('英里','mi','mi')} · ${c.trip==='day'?t('当天往返','day trip','ida e volta'):t('需过夜','overnight','com dormida')} · ${t('住','inn','dormida')} $${Math.round(h*0.6)}+</div></div><button class="btn-s mp-go" data-go="${id}" ${dis?'disabled':''}>$${f} ${t('出发','Go','Partir')}</button></div>`}).join('');
 const pager=pages>1?`<div class="mp-pager"><button class="btn-s" data-mpg="${MAP_PG-1}" ${MAP_PG===0?'disabled':''} aria-label="${res(t('上一页','Previous page','Página anterior'))}">‹</button>${Array.from({length:pages},(_,i)=>`<button class="btn-s ${i===MAP_PG?'on':''}" data-mpg="${i}">${i+1}</button>`).join('')}<button class="btn-s" data-mpg="${MAP_PG+1}" ${MAP_PG>=pages-1?'disabled':''} aria-label="${res(t('下一页','Next page','Página seguinte'))}">›</button><span class="mini">${MAP_PG*MAP_PER+1}–${Math.min(ids.length,(MAP_PG+1)*MAP_PER)} / ${ids.length}</span></div>`:'';
 const why=busy&&!away()?`<p class="mini mp-why">${cur?t('先把眼前的事处理完。','Finish the current scene first.','Acaba primeiro a cena atual.'):S.slot>1?t('太晚了，明早或午间再出发。','Too late — leave in the morning or at midday.','É tarde — parte de manhã ou ao almoço.'):t('精力不够（出门要 2 点）。','Not enough energy (a trip takes 2).','Sem energia (viajar custa 2).')}</p>`:'';
 return `<details class="mp-help"><summary class="mini">${t('出行说明','How travel works','Como funciona viajar')}</summary><p class="mini">${t('圣鲁伊斯在 35 号州际公路上，奥斯汀和韦科之间。早晨或午间可以出发，出门要 2 点精力。每座城市都有旅店，订房就能多住几天（一趟最多 7 晚）。你不在时，有员工就照常营业，没员工店就关门，口碑会掉。','San Luís sits on I-35 between Austin and Waco. Leave in the morning or at midday; a trip costs 2 energy. Every city has lodging — book a room to stay longer (up to 7 nights a trip). While you\'re away, staff keep the shop open — without staff it stays shut and reputation slips.','San Luís fica na I-35, entre Austin e Waco. Parte de manhã ou ao almoço; viajar custa 2 de energia. Todas as cidades têm alojamento — reserva um quarto para ficar mais tempo (até 7 noites por viagem). Enquanto estás fora, a equipa mantém o restaurante aberto — sem equipa fica fechado e a reputação cai.')}</p><p class="mini">${how}</p></details>${here}${comp}${why}${chips}<div class="mp-list">${rows}</div>${pager}`;
}

(function(){
const C={
lucia:[
 [`露西娅教你开饲料车穿过牧场，每道门都要你停车、下车、关好再走。“这儿的第一条规矩：门怎么开的，就怎么关。对人也一样。”`,`Lucía teaches you to drive the feed truck across the pasture and makes you stop at every gate, get out, close it behind you. "Rule one out here: you leave a gate the way you found it. Same goes for people."`,`A Lucía ensina-te a conduzir a carrinha da ração pelo pasto e obriga-te a parar em todas as cancelas, sair e fechá-las. «Primeira regra aqui: deixas a cancela como a encontraste. Com as pessoas é igual.»`],
 [`贝托在牛栏边撞见你们俩牵着手。他什么都没说，只递给你一双更厚的手套。露西娅小声说：“这是我爸的‘欢迎进家门’。别搞得太煽情。”`,`Beto catches the two of you holding hands at the chute. He says nothing, just hands you a heavier pair of gloves. Lucía mutters: "That's Dad for 'welcome to the family.' Don't make it weird."`,`O Beto apanha-vos de mãos dadas junto à manga. Não diz nada; só te passa umas luvas mais grossas. A Lucía resmunga: «Isto é o meu pai a dizer "bem-vindo à família". Não faças disso um drama.»`],
 [`晚上你刷烤架，她坐在柜台边看兽医期刊，专挑最恶心的段落念出来，看你会不会皱眉。你已经不皱了。她看起来既失望又得意。`,`At night you scrub the grill while she reads vet journals at your counter, picking out the grossest passages to read aloud and watching to see if you flinch. You've stopped flinching. She looks disappointed and pleased at once.`,`À noite esfregas a grelha enquanto ela lê revistas de veterinária ao balcão, escolhendo os parágrafos mais nojentos para ler em voz alta e ver se estremeces. Já não estremeces. Ela parece desiludida e orgulhosa ao mesmo tempo.`]],
jolene:[
 [`凌晨两点，空荡荡的酒吧里，她给你弹一首新歌。这一次不是关于离开，是关于一盏门廊灯。唱到一半她停了：“别说话。还没写完。我们也是。”`,`Two a.m., the saloon empty, she plays you a new song. For once it isn't about leaving; it's about a porch light. Halfway through she stops. "Don't say anything. It isn't finished. Neither are we."`,`Duas da manhã, o bar vazio, ela toca-te uma canção nova. Pela primeira vez não é sobre partir; é sobre uma luz de alpendre. A meio para. «Não digas nada. Ainda não está acabada. Nós também não.»`],
 [`厄尔知道了。他把同一个杯子擦了十分钟，然后对你说：“她要走，你就让她走。她回来，你就开门。这活儿就这么多。”`,`Earl finds out. He polishes the same glass for ten minutes, then says to you: "She leaves, you let her. She comes back, you let her in. That's the whole job."`,`O Earl descobre. Passa dez minutos a limpar o mesmo copo e depois diz-te: «Se ela for, deixas ir. Se voltar, abres a porta. O trabalho é só isso.»`],
 [`她让你把那个咖啡罐里的积蓄分成两个罐子，一个写“纳什维尔”，一个写“这儿”。小费她两个罐子都放，就是不告诉你哪个更满。`,`She has you split the coffee-can savings into two jars, one labeled "Nashville," one labeled "Here." She keeps feeding tips into both and won't tell you which is fuller.`,`Pede-te para dividires as poupanças da lata de café em dois frascos: um diz «Nashville», o outro diz «Aqui». Ela continua a pôr gorjetas nos dois e não te diz qual está mais cheio.`]],
savannah:[
 [`她问你喜欢什么花。十二年里没人问过她，也没人问过你。你说：六月里里斯本窗台上一盆盆的罗勒。第二天早上，你的柜台上多了一盆罗勒，没有字条。`,`She asks what flower you like. Nobody asked her for twelve years, and nobody's asked you either. You say: the pots of basil on Lisbon windowsills in June. Next morning there's a pot of basil on your counter. No note.`,`Ela pergunta-te de que flor gostas. Ninguém lhe perguntou isso em doze anos, e a ti também ninguém. Dizes: os manjericos nos parapeitos de Lisboa em junho. Na manhã seguinte há um manjerico no teu balcão. Sem bilhete.`],
 [`你帮她搬水桶时，警长的巡逻车又从门口开过。这一次她抬起头，冲车子高高兴兴地挥了挥手。“让他去告诉全县吧。”`,`The sheriff's patrol car rolls past while you're hauling buckets for her. This time she looks up and gives it a cheerful wave. "Let him tell the whole county."`,`O carro-patrulha do xerife passa enquanto lhe carregas os baldes. Desta vez ela levanta a cabeça e acena-lhe toda contente. «Ele que conte ao condado inteiro.»`],
 [`阿尔贝蒂娜带来的薰衣草插枝活了。她剪下第一束，倒挂在你的厨房里。“靠近热的地方干得好。有些人也是。”`,`The lavender from Albertina's cuttings has taken. She cuts the first bunch and hangs it upside down in your kitchen. "Dries better near the heat. Like some people."`,`A alfazema das estacas da Albertina pegou. Ela corta o primeiro ramo e pendura-o de cabeça para baixo na tua cozinha. «Seca melhor perto do calor. Como certas pessoas.»`]],
clara:[
 [`她开了一个本子，每次约会记一个你教她的葡语词。第一页写的是“saudade”，又划掉了：“这个我已经有了。”`,`She starts a notebook: one Portuguese word you teach her per date. On page one she's written "saudade," then crossed it out. "Already have that one."`,`Ela começa um caderno: uma palavra portuguesa que lhe ensinas por cada encontro. Na primeira página escreveu «saudade» e depois riscou. «Essa já eu tenho.»`],
 [`闭馆后的图书馆里，你把佩索阿念出声来。她改你的英译，你改她的葡语发音。到半夜，你们俩都说不清那句话原本是谁的语言了。`,`In the library after closing you read Pessoa aloud. She corrects your English translation; you correct her Portuguese vowels. By midnight neither of you can say whose language the line was in the first place.`,`Na biblioteca, depois de fechar, lês Pessoa em voz alta. Ela corrige a tua tradução inglesa; tu corriges-lhe as vogais. À meia-noite, já nenhum dos dois sabe de quem era a língua daquele verso.`],
 [`她又拿出那本空白护照。签证页上多了一行铅笔字：“里斯本——和你一起。”她说用铅笔，是为了还能擦掉。“不过我不觉得我会擦。”`,`She brings out the blank passport again. On a visa page there's a new line in pencil: "Lisbon — with you." Pencil, she says, so it can still be erased. "I don't think I will."`,`Volta a mostrar-te o passaporte em branco. Numa página de vistos há uma linha nova a lápis: «Lisboa — contigo.» A lápis, diz ela, para ainda se poder apagar. «Acho que não vou apagar.»`]],
hannah:[
 [`连轴转了三十个小时，她坐在你的柜台边，话说到一半就睡着了。你在她手边放了一个蛋挞和一杯咖啡，让整个店都轻手轻脚。她醒来说：“这是这个镇子第一次有人让我睡觉。”`,`After a thirty-hour shift she falls asleep at your counter mid-sentence. You set a custard tart and a coffee by her hand and keep the whole shop tiptoeing. When she wakes she says: "First time anybody in this town has let me sleep."`,`Depois de um turno de trinta horas adormece ao teu balcão a meio de uma frase. Pões-lhe um pastel de nata e um café ao pé da mão e o restaurante inteiro anda em bicos de pés. Quando acorda diz: «É a primeira vez que alguém nesta terra me deixa dormir.»`],
 [`她和明尼苏达那边视频。屏幕里，她父亲很客气地问你是谁。你告诉他。十分钟后他又问了一遍，你又高高兴兴地告诉他一遍。汉娜不得不走出房间。`,`A video call to Minnesota. On the screen her father asks, very politely, who you are. You tell him. Ten minutes later he asks again, and you tell him again, gladly. Hannah has to step out of the room.`,`Uma videochamada para o Minnesota. No ecrã, o pai dela pergunta, muito educado, quem és. Dizes-lhe. Dez minutos depois volta a perguntar, e tu voltas a dizer, com gosto. A Hannah tem de sair da sala.`],
 [`她给你一把诊所的钥匙，“紧急情况用”，然后马上列出什么算紧急情况。清单两页长。最后一行写着：“或者你只是想见我。”`,`She gives you a key to the clinic "for emergencies," then immediately lists what counts as one. The list runs two pages. The last line says: "Or if you just want to see me."`,`Dá-te uma chave da clínica «para emergências» e logo a seguir escreve o que conta como emergência. A lista tem duas páginas. A última linha diz: «Ou se só quiseres ver-me.»`]],
brooke:[
 [`两场比赛之间，她把拖车停在你店后面，葡萄干在空地上吃草。镇上的人开始管那块地叫“马场”。她假装很讨厌这个名字。`,`Between races she parks the trailer behind your shop and Raisin grazes the empty lot. The town starts calling it "the horse lot." She pretends to hate that.`,`Entre corridas estaciona o atrelado atrás do restaurante e o Passa pasta no terreno. A vila começa a chamar-lhe «o terreno do cavalo». Ela finge que detesta.`],
 [`她让你骑葡萄干——只许慢走。葡萄干认可了你，驮着你一路走到店后门，等你给它一个蛋挞。“它从来没为谁这么做过，”她说，“叛徒。”`,`She lets you ride Raisin — walking only. Raisin decides you'll do and carries you straight to the shop's back door to wait for a tart. "He's never done that for anybody," she says. "Traitor."`,`Deixa-te montar o Passa — só a passo. O Passa decide que serves e leva-te direitinho à porta das traseiras à espera de um pastel de nata. «Nunca fez isto por ninguém», diz ela. «Traidor.»`],
 [`她地图上圣鲁伊斯那个圈，被描了太多遍，纸都磨破了。她从背面贴了一条胶带，什么也没解释。`,`On her map, the circle around San Luís has been traced so many times the paper's worn through. She tapes it from behind and doesn't explain.`,`No mapa dela, o círculo à volta de San Luís foi desenhado tantas vezes que o papel rompeu. Ela cola-o por trás com fita e não explica nada.`]],
megan:[
 [`一个星期二晚上，她在你店里唱歌——不是赞美诗，是一首老乡村歌。四位教会的太太进来坐下，点了甜点。没人告诉她父亲。所有人都告诉了她父亲。`,`One Tuesday night she sings in your shop — not a hymn, an old country song. Four of the church ladies come in, sit down and order dessert. Nobody tells her father. Everybody tells her father.`,`Numa terça à noite ela canta no restaurante — não é um hino, é uma canção country antiga. Quatro senhoras da igreja entram, sentam-se e pedem sobremesa. Ninguém conta ao pai dela. Toda a gente conta ao pai dela.`],
 [`戴尔牧师一个人来了，点了杯咖啡，对你说：“她现在在教堂里唱她自己编的和声。很大声。”他听起来不像生气，像一个听见了什么的人。`,`Pastor Dale comes in alone, orders a coffee and says to you: "She's singing her own harmonies in church now. Loud." He doesn't sound angry. He sounds like a man who's heard something.`,`O Pastor Dale entra sozinho, pede um café e diz-te: «Agora canta as harmonias dela na igreja. Alto.» Não parece zangado. Parece um homem que ouviu alguma coisa.`],
 [`她给你看休斯敦音乐学院暑期班的申请表。填好了，没寄。“我要你在我寄出去的时候站在旁边。当证人。”`,`She shows you the Houston conservatory's summer program application. Filled in, not sent. "I want you standing there when I mail it. As a witness."`,`Mostra-te a candidatura ao curso de verão do conservatório de Houston. Preenchida, por enviar. «Quero-te ao meu lado quando a puser no correio. Como testemunha.»`]],
colleen:[
 [`她给报纸写一篇软文——《本地情侣最爱的地方》——追问的问题多到最后变成了对你袜子抽屉的调查报道。`,`She's writing a soft feature for the paper — "Local Couple's Favorite Spots" — and asks so many follow-up questions it turns into an investigation of your sock drawer.`,`Está a escrever uma peça ligeira para o jornal — «Os sítios preferidos de um casal da terra» — e faz tantas perguntas de seguimento que aquilo vira uma investigação à tua gaveta das meias.`],
 [`老菲茨杰拉德在养老院点名要一盘你的沙丁鱼。他用手抓着吃，吃完说：“若泽以前也带这个来。你可以娶我孙女。”科琳：“爷爷，没人问你。”老头：“我提前回答。”`,`Old Man Fitzgerald asks for a plate of your sardines at the nursing home. He eats with his fingers, then says: "José used to bring these. You may marry my granddaughter." Colleen: "Grandpa, nobody asked." The old man: "I'm answering early."`,`O velho Fitzgerald pede um prato das tuas sardinhas no lar. Come à mão e depois diz: «O José trazia-me disto. Podes casar com a minha neta.» A Colleen: «Avô, ninguém perguntou.» O velho: «Estou a responder adiantado.»`],
 [`凌晨一点，《号角报》截稿夜，你带着吃的过去。她把几个标题念给你听，你挑了最烂的那个。她还是用了，因为是你挑的。`,`One a.m., deadline night at the Clarion; you bring food. She reads you her headline options and you pick the worst one. She runs it anyway, because you picked it.`,`Uma da manhã, noite de fecho no Clarion; levas comida. Ela lê-te as hipóteses de título e tu escolhes a pior. Ela publica-a na mesma, porque foste tu que escolheste.`]],
wade:[
 [`他用旧谷仓的木板给店里钉了一个架子，一句话没说，装好，点个头，走了。架子底面刻着“W +”，后面一个字母只刻了一半，像是刻到那儿没了胆子。`,`He builds a shelf for the shop out of old barn wood, says nothing, puts it up, nods, leaves. Carved on the underside: "W +", then half of a second letter, as if he lost his nerve.`,`Faz uma prateleira para o restaurante com tábuas do celeiro velho, não diz nada, pendura-a, acena e vai-se embora. Gravado por baixo: «W +», e meia letra a seguir, como se lhe tivesse faltado a coragem.`],
 [`你在皮卡后挡板上给他画像。他一动不动坐了四十分钟。你给他看，他看了很久：“不知道我是这个样子。”“什么样子？”“像有人在看我。”`,`You sketch him on the tailgate. He holds still for forty minutes. When you show him, he looks a long time. "Didn't know I looked like that." "Like what?" "Like somebody's looking."`,`Desenha-lo sentado na traseira da carrinha. Fica quieto quarenta minutos. Quando lhe mostras, olha muito tempo. «Não sabia que era assim.» «Assim como?» «Como se alguém estivesse a olhar para mim.»`],
 [`他讲了他这辈子最长的一段话：他妈妈以前唱西班牙语的摇篮曲，他全忘了。你哼了一段法多，他说就是那个调子。其实不是。你让他留着这个调子。`,`He says the longest thing you've ever heard from him: his mother used to sing him Spanish lullabies, and he's forgotten every one. You hum a fado and he says that's the tune. It isn't. You let him keep it.`,`Diz a coisa mais comprida que alguma vez lhe ouviste: a mãe cantava-lhe canções de embalar em espanhol, e ele esqueceu-as todas. Trauteias um fado e ele diz que é aquela música. Não é. Deixas que fique com ela.`]],
ashley:[
 [`她给你们俩做了一份训练计划。她自己那一栏“为什么”，第一次不是空的：“为了在看台上跟得上他。”`,`She writes a training plan for the two of you. In her own "Why" column, for the first time, there's something written: "So I can keep up with him on the bleachers."`,`Faz um plano de treino para os dois. Na coluna «Porquê» dela, pela primeira vez, há qualquer coisa escrita: «Para conseguir acompanhá-lo nas bancadas.»`],
 [`周五晚上的橄榄球赛，她在场边，你在看台上，给球队带了一盒蛋挞。小伙子们开始叫你“葡萄牙教练”。她也跟着叫，故意气你。`,`Friday night football. She's on the sideline; you're in the stands with a box of tarts for the team. The boys start calling you "Coach Portugal." She does too, just to annoy you.`,`Sexta à noite, futebol americano. Ela está junto à linha; tu estás na bancada com uma caixa de pastéis de nata para a equipa. Os rapazes começam a chamar-te «Treinador Portugal». Ela também, só para te irritar.`],
 [`她给你看膝盖上的疤。她公寓里那面盖了一年的镜子，现在掀开了，镜框一角贴着你们俩的一张合照。`,`She lets you see the scar on her knee. In her apartment, the mirror she kept covered for a year is uncovered now, a photo of the two of you tucked into one corner of the frame.`,`Mostra-te a cicatriz do joelho. No apartamento dela, o espelho que esteve tapado um ano inteiro está agora descoberto, com uma fotografia dos dois presa num canto da moldura.`]],
ines:[
 [`现在她每个星期天都用你店里的电话打给你妈妈。要等电话的人，变成了你。`,`Every Sunday she calls your mother from the shop phone now. You're the one who has to wait for a turn.`,`Agora, todos os domingos, é ela que liga à tua mãe do telefone do restaurante. Quem tem de esperar a vez és tu.`],
 [`她在你那件旧外套里翻出一张里斯本电车票，日期是你走的那天。她收起来了。“证据，”她说，“证明你也有犯傻的时候。”`,`In your old jacket she finds a Lisbon tram ticket dated the day you left. She keeps it. "Evidence," she says. "That you were stupid once."`,`No teu casaco velho encontra um bilhete de elétrico de Lisboa com a data do dia em que partiste. Guarda-o. «Prova», diz ela. «De que já foste parvo.»`],
 [`深夜她问：“要是我们留下来，会不会变成阿尔贝蒂娜教堂里那些老人，天天讲一个早就不存在的里斯本？”“大概会。”“那就好。我想在那儿跟你一起变老。”`,`Late at night she asks: "If we stay, will we turn into those old people at Albertina's church, talking about a Lisbon that's gone?" "Probably." "Good. I'd like to get old with you there."`,`Tarde, à noite, pergunta: «Se ficarmos, vamos virar aqueles velhotes da igreja da Albertina, a falar de uma Lisboa que já não existe?» «Provavelmente.» «Ainda bem. Gostava de envelhecer contigo ali.»`]],
roz:[
 [`她就着一瓶啤酒，在方格纸上把你的厨房重新设计了一遍。新布局每小时能让你少走四十步。她按步收费：一步一个牛胸肉夹包。`,`Over a beer she redraws your kitchen on graph paper. The new layout saves you forty steps an hour. She charges by the step: one brisket sandwich each.`,`Com uma cerveja à frente, redesenha-te a cozinha em papel quadriculado. A nova disposição poupa-te quarenta passos por hora. Cobra ao passo: uma sanduíche de peito fumado cada.`],
 [`她写好了给特拉维斯的辞职信，一直揣在工装口袋里，“像一枚幸运硬币”。还没交。`,`She's written her resignation letter to Travis and carries it in the pocket of her coveralls "like a lucky coin." She hasn't handed it in. Yet.`,`Escreveu a carta de demissão para o Travis e trá-la no bolso do fato-macaco «como uma moeda da sorte». Ainda não a entregou. Ainda.`],
 [`星期天早上她在公路边的岩壁前给你讲地层，你教她法多的词。她最喜欢“fadista”：“唱自己命运的人。跟地质学家差不多，只是更伤心。”`,`Sunday mornings she teaches you rock layers at a road cut, and you teach her fado words. Her favorite is "fadista": "Someone who sings their own fate. Like a geologist, only sadder."`,`Aos domingos de manhã ensina-te as camadas de rocha num talude da estrada, e tu ensinas-lhe palavras do fado. A preferida dela é «fadista»: «Alguém que canta o próprio destino. Como um geólogo, mas mais triste.»`]],
kyle:[
 [`“孤星法多”接到了第一场正式演出——星期六，韦科。凯尔为此修好了一辆面包车，没有空调，车身上被他画了一条沙丁鱼。`,`Lone Star Fado lands its first real gig — a Saturday in Waco. Kyle has fixed up a van for it. It has no air conditioning, and he's painted a sardine on the side.`,`Os Lone Star Fado conseguem o primeiro concerto a sério — um sábado em Waco. O Kyle arranjou uma carrinha para isso. Não tem ar condicionado, e ele pintou-lhe uma sardinha de lado.`],
 [`他第一次在酒吧里、当着所有人的面牵你的手。大概持续了四秒。厄尔往点唱机里投了一首歌，什么都没说。那就是厄尔的祝福。`,`For the first time he holds your hand in the saloon, in front of everybody. It lasts about four seconds. Earl puts a song on the jukebox and says nothing. That's Earl's blessing.`,`Pela primeira vez dá-te a mão no bar, à frente de toda a gente. Dura uns quatro segundos. O Earl põe uma música na jukebox e não diz nada. É a bênção do Earl.`],
 [`他写了乐队的第一首原创，一半英语，一半是跟你学的葡语，副歌把“saudade”和“孤星柠檬水”押在一起。难听极了。全场跟着唱。`,`He writes the band's first original, half in English, half in the Portuguese he's learned from you. The chorus rhymes "saudade" with "Lone Star lemonade." It's terrible. The whole room sings it back.`,`Escreve o primeiro original da banda, metade em inglês, metade no português que aprendeu contigo. O refrão rima «saudade» com «Lone Star lemonade». É péssimo. A sala inteira canta com ele.`]],
delphine:[
 [`她不再写你的店了——“利益冲突”——这差点要了她的命。她照样写草稿，只念给你一个人听。`,`She stops posting about your place — "conflict of interest" — and it nearly kills her. She still writes the drafts and reads them only to you.`,`Deixa de escrever sobre o restaurante — «conflito de interesses» — e isso quase a mata. Continua a escrever os rascunhos e lê-os só a ti.`],
 [`她带了一群奥斯汀的朋友来，很吵。她提前跟你溜出去，坐在后门台阶上。“我想让他们看看你。可我不想把你分给他们。”`,`She brings a crowd of Austin friends. They're loud. She slips out early with you to sit on the back step. "I wanted them to see you. I didn't want to share you."`,`Traz um grupo de amigos de Austin. São barulhentos. Ela escapa-se cedo contigo para o degrau das traseiras. «Queria que te vissem. Não queria dividir-te com eles.»`],
 [`她得了流感，你开车把汤送到奥斯汀。她对着那碗汤哭了，说是被热气熏的。`,`She comes down with the flu and you drive soup all the way to Austin. She cries over the bowl and blames the steam.`,`Apanha uma gripe e tu levas-lhe sopa até Austin. Ela chora em cima da tigela e culpa o vapor.`]],
grace:[
 [`夜跑到教堂台阶，她停下来：“我们要是继续这样下去，跟你那份遗嘱有关的事我都得回避。”“然后呢？”“回避声明我已经起草好了。”`,`On the night run she stops at the church steps. "If we keep doing this, I'll have to recuse myself from anything to do with your will." "And?" "I've already drafted the recusal."`,`Na corrida da noite para nos degraus da igreja. «Se continuarmos com isto, vou ter de me declarar impedida em tudo o que tenha a ver com o teu testamento.» «E então?» «Já redigi a declaração.»`],
 [`她拿合同给你练英语，你那些最精彩的错，她用绿笔圈，不用红笔。`,`She brings you contracts to practice your legal English on. She circles your best mistakes in green, not red.`,`Traz-te contratos para treinares o inglês jurídico. Os teus erros mais bonitos, sublinha-os a verde, não a vermelho.`],
 [`她又讲起达拉斯那部电梯。这一次她说她知道自己该去哪一层了：“底层。主街。你这儿。”`,`She tells you about the elevator in Dallas again. This time she says she knows which floor she belongs to. "Ground floor. Main Street. Yours."`,`Volta a falar-te do elevador de Dallas. Desta vez diz que já sabe qual é o andar dela. «Rés-do-chão. Rua principal. O teu.»`]],
maya:[
 [`她爸妈打来电话，她开着免提坐在你柜台边，介绍你是“那个烤肉的”。她妈妈第一句话就问你有没有好好吃饭。`,`Her parents call while she's at your counter and she puts them on speaker, introducing you as "the barbecue guy." Her mother's first question is whether you're eating enough.`,`Os pais dela ligam enquanto está ao teu balcão e ela põe em alta voz, apresentando-te como «o tipo do churrasco». A primeira pergunta da mãe é se andas a comer bem.`],
 [`她不再划奥斯汀的招聘了。她带来一张传单：圣鲁伊斯社区大学招一位正式讲师。“就看看。”这次只有一页。`,`She's stopped highlighting Austin listings. Instead she brings you a flyer: San Luís Community College is hiring a permanent instructor. "Just looking." One page this time.`,`Deixou de sublinhar anúncios de Austin. Em vez disso traz-te um folheto: o Politécnico de San Luís procura um docente efetivo. «Só a ver.» Desta vez é uma página.`],
 [`你打烊时她在柜台上改卷子，教你批改的缩写——“awk”（别扭）、“?”。你把它们写在了她的小票上。`,`She grades on your counter while you close and teaches you her shorthand — "awk," "?" — and you start using it on her receipts.`,`Corrige testes ao teu balcão enquanto fechas e ensina-te as abreviaturas — «awk» (esquisito), «?» — e tu começas a usá-las nos talões dela.`]]
};
Object.keys(C).forEach(k=>{if(NPCS[k])NPCS[k].couple=C[k]});

/* per-partner lines for Chapter 6: kid = a parenting habit (school-day scene), grad = at the graduation */
const K={
lucia:{kid:[`孩子五岁那年，露西娅就教会了孩子分辨哪头牛要生了。老师打电话来，说孩子在课上给全班讲了一遍接生，“非常详细”。`,`Lucía taught the kid at five how to tell which cow is about to calve. The teacher calls: the kid explained calving to the whole class. "In great detail."`,`A Lucía ensinou a criança, aos cinco anos, a perceber qual vaca está para parir. A professora liga: explicou um parto à turma inteira. «Com muito pormenor.»`],
 grad:[`露西娅没哭。她说牛栏里的灰尘太大。体育场里没有牛栏。`,`Lucía doesn't cry. She says the dust from the cattle pens got in her eyes. There are no cattle pens in a football stadium.`,`A Lucía não chora. Diz que lhe entrou pó dos currais nos olhos. Num estádio de futebol não há currais.`]},
jolene:{kid:[`乔琳每次巡演回来，都给孩子带一块不同城市的吉他拨片。床头那个罐子快装满了，孩子说要等满了才学吉他。`,`Every time Jolene comes back from touring she brings the kid a guitar pick from a different city. The jar by the bed is nearly full; the kid says lessons start when it is.`,`Sempre que a Jolene volta de digressão traz à criança uma palheta de uma cidade diferente. O frasco ao pé da cama está quase cheio; a criança diz que só aprende guitarra quando encher.`],
 grad:[`乔琳在看台上唱了一句什么，只有你们这一排听见了。是那首门廊灯的歌，她终于写完了。`,`Up in the stands Jolene sings a line that only your row can hear. It's the porch-light song. She finally finished it.`,`Na bancada, a Jolene canta um verso que só a vossa fila ouve. É a canção da luz do alpendre. Finalmente acabou-a.`]},
savannah:{kid:[`萨凡纳让孩子在花店里有一个自己的水桶，卖自己插的花，一枝一块钱。孩子最好的生意是警长——每周五一枝，从不还价。`,`Savannah gives the kid a bucket of their own at the flower shop, a dollar a stem. The kid's best customer is the sheriff — one stem every Friday, never haggles.`,`A Savannah dá à criança um balde só seu na florista, a um dólar o pé. O melhor cliente é o xerife — um pé todas as sextas, nunca regateia.`],
 grad:[`萨凡纳给每个毕业生都别了一小枝薰衣草，是从阿尔贝蒂娜那批插枝传下来的。全场一股你厨房的味道。`,`Savannah pins a sprig of lavender on every graduate, grown from Albertina's old cuttings. The whole stadium smells like your kitchen.`,`A Savannah prende um raminho de alfazema em cada finalista, das estacas antigas da Albertina. O estádio inteiro cheira à tua cozinha.`]},
clara:{kid:[`克拉拉的睡前故事是佩索阿，删节版。孩子在学校说自己“有四个异名”，老师查了半天才知道是什么意思。`,`Clara's bedtime stories are Pessoa, abridged. At school the kid announces they have "four heteronyms," and the teacher has to look it up.`,`As histórias de deitar da Clara são Pessoa, em versão resumida. Na escola a criança anuncia que tem «quatro heterónimos», e a professora tem de ir ver o que isso é.`],
 grad:[`克拉拉把那本护照带来了，上面已经盖满了章。她在最后一页给孩子留了位置：“下一个章，你自己去盖。”`,`Clara brings the passport — full of stamps now. She's saved the last page for the kid. "The next stamp is yours to get."`,`A Clara traz o passaporte — agora cheio de carimbos. Guardou a última página para a criança. «O próximo carimbo vais buscá-lo tu.»`]},
hannah:{kid:[`汉娜医生给孩子的急救包比诊所的还全。孩子在学校给同学贴创可贴，按汉娜的规矩先问：“最坏的情况是什么？”`,`Dr. Hannah's first-aid kit for the kid is better stocked than the clinic's. At school the kid hands out bandages and, by Hannah's rule, asks first: "What's the worst it could be?"`,`O estojo de primeiros socorros que a Dra. Hannah preparou para a criança está mais bem fornecido do que o da clínica. Na escola distribui pensos e, pela regra da Hannah, pergunta primeiro: «Qual é o pior que pode ser?»`],
 grad:[`汉娜的呼机在念到第三十个名字时响了。她看了一眼，关掉了。这是你认识她以来，她第一次关掉呼机。`,`Hannah's pager goes off at the thirtieth name. She glances at it and switches it off. In all the years you've known her, it's the first time.`,`O pager da Hannah toca ao trigésimo nome. Ela olha e desliga-o. Em todos os anos que a conheces, é a primeira vez.`]},
brooke:{kid:[`布鲁克教孩子骑葡萄干绕桶跑，计时用的是厨房定时器。孩子的最好成绩写在店里冰箱门上，比你的任何账都显眼。`,`Brooke teaches the kid to run barrels on old Raisin, timed with the kitchen timer. The kid's best time is written on the shop fridge, bigger than any of your accounts.`,`A Brooke ensina a criança a fazer barris no velho Passa, cronometrada com o temporizador da cozinha. O melhor tempo está escrito na porta do frigorífico do restaurante, maior do que qualquer conta tua.`],
 grad:[`布鲁克把那张磨破的地图带来了，在背面写：“哪儿都能去。记得这儿是个圈。”`,`Brooke brings the worn-through map and writes on the back: "Go anywhere. Remember this one's a circle."`,`A Brooke traz o mapa rompido e escreve no verso: «Vai a qualquer lado. Lembra-te de que este é um círculo.»`]},
megan:{kid:[`梅根让孩子进了教会唱诗班，唱的是她自己改的和声。戴尔牧师——现在是外公了——假装没听出来。`,`Megan puts the kid in the church choir, singing her own rewritten harmonies. Pastor Dale — Grandpa now — pretends not to notice.`,`A Megan põe a criança no coro da igreja, a cantar as harmonias que ela própria reescreveu. O Pastor Dale — agora avô — finge que não repara.`],
 grad:[`戴尔牧师做毕业祷告。念到最后，他用一句带口音的葡语说了一句“感谢上帝”。是梅根偷偷教的。`,`Pastor Dale gives the graduation prayer. At the very end he says "Graças a Deus" in heavily accented Portuguese. Megan taught him in secret.`,`O Pastor Dale faz a oração da formatura. No fim diz «Graças a Deus» num português com muito sotaque. Foi a Megan que lhe ensinou às escondidas.`]},
colleen:{kid:[`科琳教孩子在笔记本封面上写“谁都别信，包括我”。家长会上，老师小心地问你们，家里是不是有什么事。`,`Colleen teaches the kid to write DON'T TRUST ANYBODY, INCLUDING ME on every notebook cover. At the parent-teacher conference, the teacher carefully asks if everything's all right at home.`,`A Colleen ensina a criança a escrever NÃO CONFIES EM NINGUÉM, NEM EM MIM na capa de todos os cadernos. Na reunião de pais, a professora pergunta com cuidado se está tudo bem em casa.`],
 grad:[`第二天的《号角报》头版是毕业典礼。署名是科琳，标题是你挑的——还是最烂的那种。`,`Next day the Clarion runs the graduation on the front page. Colleen's byline; you picked the headline. Still the worst one.`,`No dia seguinte a formatura faz a primeira página do Clarion. Assinatura da Colleen; o título escolheste-o tu. Continua a ser o pior.`]},
wade:{kid:[`韦德教孩子甩绳子，第一次套中的是一根栅栏桩。韦德说：“桩也算。”孩子把这句话写在了作文里。`,`Wade teaches the kid to throw a rope. The first catch is a fence post. Wade says, "Post counts." The kid puts it in a school essay.`,`O Wade ensina a criança a laçar. A primeira laçada apanha um poste da cerca. O Wade diz: «Poste conta.» A criança põe isso numa composição da escola.`],
 grad:[`韦德站起来鼓掌，持续了很久，久到周围的人都看他。他没坐下。他这辈子说的话加起来，都没有那一阵掌声多。`,`Wade stands up and claps, for a long time, long enough that people turn to look. He doesn't sit down. Everything he's ever said doesn't add up to that much applause.`,`O Wade levanta-se e aplaude muito tempo, tanto que as pessoas se viram para ver. Não se senta. Tudo o que disse na vida não chega àquela salva de palmas.`]},
ashley:{kid:[`阿什莉给孩子也做了一份训练计划，“为什么”那一栏，孩子写的是“为了赢过爸爸”。阿什莉给这一条打了满分。`,`Ashley writes the kid a training plan too. In the "Why" column the kid writes: "To beat Dad." Ashley gives that one full marks.`,`A Ashley também faz um plano de treino para a criança. Na coluna «Porquê», a criança escreve: «Para ganhar ao pai.» A Ashley dá nota máxima.`],
 grad:[`典礼在阿什莉执教了二十年的那座体育场里。她从看台上看着孩子走过球场，第一次没有在心里数步伐。`,`The ceremony is in the stadium where Ashley has coached for twenty years. She watches the kid cross the field and, for once, doesn't count the strides.`,`A cerimónia é no estádio onde a Ashley treina há vinte anos. Vê a criança atravessar o relvado e, pela primeira vez, não conta as passadas.`]},
ines:{kid:[`伊内丝坚持家里只说葡语。孩子的英语是在店里跟卡车司机学的，所以说起来像一个六十岁的卡车司机。`,`Inês insists on Portuguese only at home, so the kid learned English from the truckers in the shop and talks like a sixty-year-old trucker.`,`A Inês insiste em só se falar português em casa, por isso a criança aprendeu inglês com os camionistas do restaurante e fala como um camionista de sessenta anos.`],
 grad:[`伊内丝把那张里斯本电车票塞进孩子的毕业礼服口袋里。“证据，”她说，“证明你爸犯过傻，然后一切都还好。”`,`Inês slips the old Lisbon tram ticket into the pocket of the kid's gown. "Evidence," she says. "That your father was stupid once, and it all turned out fine."`,`A Inês mete o velho bilhete de elétrico no bolso da beca. «Prova», diz ela. «De que o teu pai já foi parvo, e no fim correu tudo bem.»`]},
roz:{kid:[`罗兹带孩子去公路边认岩层，孩子在学校的科学展上拿了二等奖，题目是《为什么石油不是湖》。`,`Roz takes the kid to road cuts to read the rock. At the school science fair the kid takes second place with "Why Oil Isn't a Lake."`,`A Roz leva a criança aos taludes da estrada a ler as rochas. Na feira de ciências da escola fica em segundo lugar com «Porque é que o petróleo não é um lago».`],
 grad:[`罗兹算了一下：从这个体育场到你的店，正好是若泽当年画的那三条线交汇的地方。“巧合，”她说，“我不信巧合。”`,`Roz has worked it out: the line from this stadium to your shop runs right through the spot where José's three lines met. "Coincidence," she says. "I don't believe in coincidence."`,`A Roz fez as contas: a linha deste estádio até ao restaurante passa mesmo pelo ponto onde se cruzavam as três linhas do José. «Coincidência», diz ela. «Não acredito em coincidências.»`]},
