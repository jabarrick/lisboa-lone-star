kyle:{kid:[`凯尔把孩子的第一辆自行车拆了又装，装完多出两个零件。孩子骑了三年，一直没出事。凯尔说那两个零件是“备用的运气”。`,`Kyle takes the kid's first bike apart and puts it back together with two parts left over. The kid rides it for three years without trouble. Kyle says the spares are "backup luck."`,`O Kyle desmonta a primeira bicicleta da criança e volta a montá-la com duas peças a mais. A criança anda nela três anos sem problemas. O Kyle diz que as peças são «sorte de reserva».`],
 grad:[`典礼结束，凯尔在停车场把面包车后门一开，“孤星法多”给毕业生们来了一场免费演出。副歌还是那句“saudade”配柠檬水。`,`After the ceremony Kyle throws open the back of the van in the parking lot and Lone Star Fado plays the graduates a free show. The chorus still rhymes "saudade" with lemonade.`,`No fim, o Kyle abre a traseira da carrinha no parque de estacionamento e os Lone Star Fado dão um concerto grátis aos finalistas. O refrão continua a rimar «saudade» com limonada.`]},
delphine:{kid:[`德尔菲娜给孩子开了一个美食账号，只有一个规矩：只许写真话。第一篇是“爸爸的辣肉酱太咸”，转发量是她自己账号的三倍。`,`Delphine sets the kid up with a food account and one rule: only the truth. The first post is "Dad's chili is too salty." It gets three times the shares of anything on her own blog.`,`A Delphine abre à criança uma conta de comida com uma só regra: só a verdade. A primeira publicação é «O chili do pai está salgado demais». Tem três vezes mais partilhas do que qualquer coisa do blogue dela.`],
 grad:[`德尔菲娜一张照片都没拍。她说有些东西不用发出去，留着就行。`,`Delphine doesn't take a single photo. Some things, she says, you don't post. You just keep them.`,`A Delphine não tira uma única fotografia. Há coisas, diz ela, que não se publicam. Guardam-se.`]},
grace:{kid:[`格蕾丝教孩子“合同要读到最后一页”。孩子拿这条规矩去对付学校的午餐菜单，挑出了三处“漏洞”。`,`Grace teaches the kid to "always read to the last page of the contract." The kid applies this to the school lunch menu and finds three loopholes.`,`A Grace ensina a criança a «ler sempre o contrato até à última página». A criança aplica isso à ementa da cantina e descobre três lacunas.`],
 grad:[`格蕾丝把那支按了一整年的圆珠笔送给了孩子。“签你自己的东西用。”`,`Grace gives the kid the ballpoint she clicked through that whole first year. "For signing things of your own."`,`A Grace dá à criança a esferográfica que esteve a clicar durante aquele primeiro ano inteiro. «Para assinares coisas tuas.»`]},
maya:{kid:[`玛雅批改孩子的作业比批改大学生还狠。孩子的作文退回来，空白处只有一个批注：“别扭”。孩子学会了查字典。`,`Maya grades the kid's homework harder than her college students'. An essay comes back with one word in the margin — "awk" — and the kid learns to use a dictionary.`,`A Maya corrige os trabalhos da criança com mais rigor do que os dos alunos dela. Uma composição volta com uma só palavra na margem — «awk» — e a criança aprende a usar o dicionário.`],
 grad:[`玛雅从休斯敦把她爸妈接来了。洗衣店关了一天，二十五年来第一次。`,`Maya brings her parents in from Houston. The laundromat is closed for the day, for the first time in twenty-five years.`,`A Maya traz os pais de Houston. A lavandaria fecha um dia, pela primeira vez em vinte e cinco anos.`]}
};
Object.keys(K).forEach(k=>{if(PARTNER[k]){PARTNER[k].kid=K[k].kid;PARTNER[k].grad=K[k].grad}});
})();

/* ===================== v0.3 — Chapter 6 «Raízes» and Chapter 5 «Ficar» =====================
   Chapter 6 (c6*): after Chapter 5 «Lar» when there is a child — the child grows up (years 4–18).
     flags: f6_word, f6_acc, f6_show, f6_two, f6_sat, f6_flood, f6_lis, f6_mom, f6_future, f6_done
   Chapter 5 «Ficar» (s5*): staying in America without marrying — alone, or with a partner who says
     "we don't need the paper". The E-2 visa keeps you tied to the shop.
     flags: f5_unwed, f5_inv, f5_god, f5_visa, f5_mom, f5_late, f5_new, f5_done
   Both end by calling the year's final scene (F1.fin). */
const C6M=(z,e,p)=>t('第六章 · 根 · '+z,'Chapter 6 · Roots · '+e,'Capítulo 6 · Raízes · '+p);
const S5M=(z,e,p)=>t('第五章 · 留下 · '+z,'Chapter 5 · Staying · '+e,'Capítulo 5 · Ficar · '+p);
const c6K=()=>F1.kid();
const c6Fin=()=>F1G()();
const c6Say=(nx,text,fx)=>()=>{if(fx)fx();const sc=say('',text);sc.choices[0].next=nx;return sc};

function c6Open(){
 const K=c6K();
 return {title:t('柜台上的婴儿椅','The high chair on the counter','A cadeirinha no balcão'),meta:C6M('第四年','Year four','Quarto ano'),text:[
  t(`每天午市，${K}都坐在柜台上的婴儿椅里，像个收银员。单词已经会了一大把，就是不肯连成一句。店里的常客开了个赌局，赌第一句完整的话是英语还是葡语，赔率用粉笔写在若泽那块旧黑板上。`,`Every lunch rush ${K} sits in the high chair on the counter like a cashier. Plenty of words by now, but never strung together. The regulars have opened a book on whether the first whole sentence will be English or Portuguese; the odds are chalked on José's old blackboard.`,`Todos os almoços, ${K} fica na cadeirinha em cima do balcão, como quem está na caixa. Já sabe uma data de palavras, mas nunca as junta. Os clientes habituais abriram apostas sobre se a primeira frase inteira será em inglês ou em português; as probabilidades estão escritas a giz no velho quadro do José.`),
  t(`一个星期二，${K}指着烤架，清清楚楚地说了一整句。`,`One Tuesday ${K} points at the grill and says a whole sentence, clear as a bell.`,`Numa terça-feira, ${K} aponta para a grelha e diz uma frase inteira, clarinha.`)],choices:[
  {t:t('“再加点炭！”——用葡语喊的。','"Mais brasa!" Portuguese for "More coals!"','«Mais brasa!»'),next:c6Say(c6Accent,t('葡语那一边赢了十四块钱。阿尔贝蒂娜把钱全捐给了教堂，说圣安东尼也下了注。','The Portuguese side wins fourteen dollars. Albertina gives it all to the church and says Saint Anthony had money on it too.','O lado português ganha catorze dólares. A Albertina dá tudo à igreja e diz que o Santo António também tinha apostado.'),()=>{S.flags.f6_word='brasa';stat('saud',-2)})},
  {t:t('“大伙儿好！”——学的是德州腔。','"Howdy, y\'all!"','«Howdy, y\'all!» — o «olá a todos» do Texas'),next:c6Say(c6Accent,t('厄尔赢了。他把那张赌单裱起来挂在酒吧墙上，写着：本镇最年轻的德州人。','Earl wins. He frames the betting slip and hangs it in the saloon: YOUNGEST TEXAN IN TOWN.','Ganha o Earl. Emoldura o boletim e pendura-o no bar: O TEXANO MAIS NOVO DA VILA.'),()=>{S.flags.f6_word='howdy';stat('tex',2)})},
  {t:t('“若泽开门了！”——指着墙上若泽的照片','"Zé\'s open!" Pointing at José\'s photo on the wall','«O Zé está aberto!» A apontar para a fotografia do José na parede'),next:c6Say(c6Accent,t('没人押这个。赌金原封不动，你们把它放进了若泽照片后面的信封里。','Nobody bet on that one. The pot stays untouched; you tuck it into an envelope behind José\'s photo.','Ninguém apostou nessa. O dinheiro fica intacto; guardam-no num envelope atrás da fotografia do José.'),()=>{S.flags.f6_word='ze';stat('saud',-1)})}]};
}
function c6Accent(){
 const K=c6K();
 const q={'浓':t(`幼儿园放学，${K}爬上吧台凳，很认真地看着你：“你为什么把每个词都说得那么奇怪？老师说‘喔特’（水）不是那么念的。”`,`Home from kindergarten, ${K} climbs onto a bar stool and studies you seriously. "Why do you say every word funny? My teacher says that's not how you say 'water.'"`,`Vindo da pré-primária, ${K} sobe para um banco do balcão e olha para ti muito a sério. «Porque é que dizes as palavras todas esquisitas? A professora diz que "water" não se diz assim.»`),
  '中':t(`幼儿园放学，${K}爬上吧台凳：“你说“y'all”的时候，为什么听起来像在说别的东西？”`,`Home from kindergarten, ${K} climbs onto a bar stool. "When you say 'y'all,' why does it sound like something else?"`,`Vindo da pré-primária, ${K} sobe para um banco do balcão. «Quando dizes "y'all", porque é que parece outra coisa?»`),
  '淡':t(`幼儿园放学，${K}爬上吧台凳：“你说英语跟别人一样。可你一给奶奶打电话，声音就变了。哪个才是你？”`,`Home from kindergarten, ${K} climbs onto a bar stool. "You talk English like everybody else. But when you call Grandma your voice changes. Which one is you?"`,`Vindo da pré-primária, ${K} sobe para um banco do balcão. «Falas inglês como toda a gente. Mas quando ligas à avó a tua voz muda. Qual deles és tu?»`)}[S.accent]||'';
 return {title:t('你说错了','You\'re saying it wrong','Estás a dizer mal'),meta:C6M('第六年','Year six','Sexto ano'),text:[q,
  t('你的口音一直是你的本钱，也是你的账单。现在轮到一个五岁的孩子来结账了。','Your accent has always been your capital and your bill. Now a five-year-old wants to settle the account.','O teu sotaque sempre foi o teu capital e a tua conta. Agora é uma criança de cinco anos que vem pedir o acerto.')],choices:[
  {t:t('“没说错。这是我的说法。”','"It\'s not wrong. It\'s mine."','«Não está mal. É a minha maneira.»'),next:c6Say(c6School,t(`${K}想了想，用你的口音把“喔特”（水）说了一遍，又用老师的口音说了一遍。“那我两个都要。”`,`${K} thinks about it, says "water" your way, then the teacher's way. "Then I'll keep both."`,`${K} pensa, diz «water» à tua maneira e depois à maneira da professora. «Então fico com as duas.»`),()=>{S.flags.f6_acc='keep';stat('charme',1)})},
  {t:t('“那你教我。”','"Then teach me."','«Então ensina-me.»'),next:c6Say(c6School,t('从那天起，每天晚饭前有五分钟的“英语课”。老师很严，学生很差。三个月后，卡车司机们说你的“y\'all”终于用对了。','From then on there are five minutes of "English class" before dinner every night. The teacher is strict; the student is hopeless. Three months later the truckers say your "y\'all" is finally right.','A partir desse dia há cinco minutos de «aula de inglês» antes do jantar. Quem ensina é exigente; quem aprende não tem emenda. Três meses depois os camionistas dizem que o teu «y\'all» está finalmente certo.'),()=>{S.flags.f6_acc='learn';stat('tex',2)})},
  {t:t('“在家里，我们说葡语。”','"At home, we speak Portuguese."','«Em casa falamos português.»'),next:c6Say(c6School,t(`${K}抗议了一个星期，然后开始用葡语抗议。阿尔贝蒂娜听说了，送来一本她小时候的识字课本，书页黄得像蛋挞皮。`,`${K} protests for a week, then starts protesting in Portuguese. Albertina hears about it and sends over the primer she learned to read from, its pages as yellow as tart pastry.`,`${K} protesta durante uma semana e depois começa a protestar em português. A Albertina sabe e manda a cartilha por onde aprendeu a ler, com as páginas amarelas como massa de pastel de nata.`),()=>{S.flags.f6_acc='home';stat('saud',-2)})}]};
}
function c6School(){
 const K=c6K();
 return {title:t('我们家从哪里来','Where my family is from','De onde vem a minha família'),meta:C6M('第八年 · 二年级','Year eight · Second grade','Oitavo ano · 2.º ano'),text:[
  t('二年级的“展示与讲述”，题目是“我们家从哪里来”。别的孩子带来了曾祖父的军功章、奶奶的被子、一张俄克拉何马的老地图。','Second-grade show-and-tell. The topic: "Where my family is from." The other kids bring a great-grandfather\'s medal, a grandmother\'s quilt, an old map of Oklahoma.','Na turma do 2.º ano há «mostrar e contar». O tema: «De onde vem a minha família». Os outros miúdos levam a medalha de um bisavô, a manta de uma avó, um mapa velho de Oklahoma.'),
  F1.L('kid'),
  t(`前一天晚上，${K}在店里转了三圈，还没决定带什么。`,`The night before, ${K} walks three laps of the shop and still hasn't decided what to bring.`,`Na noite anterior, ${K} dá três voltas ao restaurante e ainda não decidiu o que levar.`)].filter(Boolean),choices:[
  {t:t('若泽的那把烤肉夹','José\'s grill tongs','A tenaz da grelha do José'),next:c6Say(c6Sibling,t(`老师后来告诉你：${K}举着夹子说，“我舅公从里斯本来，什么都没带，就带了这个。后来我爸也来了，也什么都没带。”全班鼓掌。夹子其实是在韦科的五金店买的。你没纠正。`,`The teacher tells you later: ${K} held up the tongs and said, "My great-uncle came from Lisbon with nothing but these. Then my dad came with nothing too." The class applauded. The tongs are actually from a hardware store in Waco. You don't correct anyone.`,`A professora conta-te depois: ${K} levantou a tenaz e disse: «O meu tio-avô veio de Lisboa só com isto. Depois o meu pai também veio sem nada.» A turma aplaudiu. Na verdade a tenaz é de uma loja de ferragens de Waco. Não corriges ninguém.`),()=>{S.flags.f6_show='tongs'})},
  {t:t('墙上那块松动的蓝瓷砖','The loose blue tile from the wall','O azulejo azul solto da parede'),next:c6Say(c6Sibling,t(`${K}把那块蓝瓷砖从墙上撬下来，用擦碗布包着带去了学校。回来时瓷砖背面多了二十二个签名，全班的。你把它重新贴回墙上，签名朝里。`,`${K} pries the blue tile off the wall and carries it to school wrapped in a dish towel. It comes back with twenty-two signatures on the back — the whole class. You glue it back on the wall, signatures facing in.`,`${K} arranca da parede o azulejo azul e leva-o para a escola embrulhado num pano de cozinha. Volta com vinte e dois nomes nas costas — a turma toda. Voltas a colá-lo na parede, com as assinaturas para dentro.`),()=>{S.flags.f6_show='tile'})},
  {t:t('你那张灰狗巴士的票根','Your old Greyhound ticket stub','O teu velho talão do Greyhound'),next:c6Say(c6Sibling,t(`${K}给全班讲：“我爸坐灰狗巴士来的，带着一把吉他和一箱沙丁鱼罐头。没人去接他。”一个小男孩举手问：“那后来呢？”${K}说：“后来就有我了。”`,`${K} tells the class: "My dad came on the Greyhound with a guitar and a box of sardine cans. Nobody came to meet him." A little boy raises his hand. "Then what?" ${K} says: "Then there was me."`,`${K} conta à turma: «O meu pai veio no Greyhound com uma guitarra e uma caixa de latas de sardinha. Ninguém o foi buscar.» Um rapazinho põe o dedo no ar: «E depois?» ${K} responde: «Depois vim eu.»`),()=>{S.flags.f6_show='ticket'})}]};
}
function c6Sibling(){
 const K=c6K(),ch=[];
 if(F1.carry())ch.push({t:t('再要一个孩子','Another baby','Mais um bebé'),next:c6Say(c6Saturday,t(`第二个孩子在一个普通的星期三出生，没有雷暴，没有节日，什么故事都没有。${K}说这样最好：“这样我的故事就还是最好的。”`,`The second baby is born on an ordinary Wednesday — no thunderstorm, no festival, no story at all. ${K} says that's best: "That way mine's still the best story."`,`O segundo bebé nasce numa quarta-feira qualquer — sem trovoada, sem festa, sem história nenhuma. ${K} diz que é melhor assim: «Assim a minha história continua a ser a melhor.»`),()=>{S.flags.f6_two='baby';addLike(F1.id(),1)})});
 ch.push({t:t('再当一次寄养家庭','Become a foster home again','Voltar a ser família de acolhimento'),next:c6Say(c6Saturday,t(`社工还是那位从休斯敦调来的女人，头发白了一半。这一次来的是一个八岁的男孩，只背着一个书包，书包里全是石头。${K}看了一眼，说：“我以前也卖石头。”当天下午，两个人就在柜台底下开了一家店。`,`The caseworker is the same woman from Houston, half grey now. This time it's an eight-year-old boy with one backpack, full of rocks. ${K} takes one look and says, "I used to sell rocks." By that afternoon the two of them have opened a shop under the counter.`,`A assistente social é a mesma de Houston, agora meio grisalha. Desta vez vem um rapaz de oito anos com uma só mochila, cheia de pedras. ${K} olha e diz: «Eu também vendia pedras.» Nessa tarde os dois já abriram uma loja debaixo do balcão.`),()=>{S.flags.f6_two='foster';addTrust(F1.id(),1)})});
 ch.push({t:t('三把椅子就对了','Three chairs is right','Três cadeiras é o certo'),next:c6Say(c6Saturday,t(`你把第四把椅子放回桌上。${P1()}笑了，把${K}叫过来，三个人挤在两把椅子上。“看，”${K}说，“还有空。”`,`You put the fourth chair back on the table. ${P1()} laughs and calls ${K} over, and the three of you squeeze onto two chairs. "See," ${K} says, "there's room left."`,`Voltas a pôr a quarta cadeira em cima da mesa. ${P1()} ri-se e chama ${K}, e os três apertam-se em duas cadeiras. «Estás a ver», diz ${K}, «ainda sobra espaço.»`),()=>{S.flags.f6_two='no'})});
 return {title:t('第四把椅子','A fourth chair','Uma quarta cadeira'),meta:C6M('第九年','Year nine','Nono ano'),text:[
  t(`${K}开始问一个你们俩都答不上来的问题：“为什么别人都有弟弟妹妹？”`,`${K} has started asking a question neither of you can answer: "Why does everybody else have a brother or a sister?"`,`${K} começou a fazer uma pergunta a que nenhum dos dois sabe responder: «Porque é que os outros têm todos irmãos?»`),
  t(`打烊后，${P1()}从桌上翻下四把椅子，摆好，坐在其中一把上，看着你。`,`After closing, ${P1()} takes four chairs down off a table, sets them out, sits in one, and looks at you.`,`Depois de fechar, ${P1()} tira quatro cadeiras de cima de uma mesa, arruma-as, senta-se numa e olha para ti.`)],choices:ch};
}
function c6Saturday(){
 const K=c6K();
 return {title:t('星期六的葡语学校','Saturday Portuguese school','A escola de português ao sábado'),meta:C6M('第十年','Year ten','Décimo ano'),text:[
  t('阿尔贝蒂娜九十岁了，还在教堂地下室开星期六葡语班。一把尺子，一盒饼干，七个学生。尺子是用来指黑板的——她说的。','Albertina is ninety and still runs Saturday Portuguese school in the church basement. One ruler, one tin of biscuits, seven pupils. The ruler is for pointing at the blackboard. So she says.','A Albertina tem noventa anos e continua a dar a escola de português ao sábado na cave da igreja. Uma régua, uma lata de bolachas, sete alunos. A régua é para apontar para o quadro. Diz ela.'),
  t(`同样是星期六上午，贝托的牧场有 4-H 少年俱乐部：每个孩子养一头小牛，养到秋天去县集市上比赛。${K}两样都想要。星期六只有一个上午。`,`The same Saturday mornings, Beto's ranch hosts the 4-H club: each kid raises a calf to show at the county fair in the fall. ${K} wants both. Saturday only has one morning.`,`Nas mesmas manhãs de sábado, o rancho do Beto recebe o clube 4-H: cada miúdo cria um vitelo para apresentar na feira do condado no outono. ${K} quer as duas coisas. O sábado só tem uma manhã.`)],choices:[
  {t:t('去阿尔贝蒂娜的葡语课','Albertina\'s Portuguese class','A aula de português da Albertina'),next:c6Say(c6Albertina,t(`第一堂课，阿尔贝蒂娜让每个孩子说一句家里人常说的话。${K}说的是你骂炭火的那一句。阿尔贝蒂娜用尺子敲了敲桌子，然后笑得把饼干盒都碰翻了。`,`First lesson, Albertina has each child say something their family always says. ${K} repeats what you say when you curse at the coals. Albertina raps the desk with the ruler, then laughs so hard she knocks over the biscuit tin.`,`Na primeira aula, a Albertina pede a cada criança que diga uma coisa que se diz sempre lá em casa. ${K} repete o que tu dizes quando ralhas com as brasas. A Albertina bate na mesa com a régua e depois ri-se tanto que entorna a lata das bolachas.`),()=>{S.flags.f6_sat='pt';stat('saud',-2)})},
  {t:t('去牧场养小牛','Raise a calf at the ranch','Criar um vitelo no rancho'),next:c6Say(c6Albertina,t(`那头小牛叫“沙丁鱼”，秋天在县集市上拿了第三名。评委问名字的由来，${K}说：“因为它是我爸的。”评委没听懂，照样发了缎带。`,`The calf is named Sardine, and in the fall it takes third at the county fair. The judge asks about the name. ${K} says, "Because it's my dad's." The judge doesn't get it and hands over the ribbon anyway.`,`O vitelo chama-se Sardinha e no outono fica em terceiro na feira do condado. O júri pergunta porquê o nome. ${K} diz: «Porque é do meu pai.» O júri não percebe e dá a fita na mesma.`),()=>{S.flags.f6_sat='4h';stat('tex',2)})},
  {t:t('两样都去，你开车','Both — you drive','As duas — tu conduzes'),req:()=>S.course.drive>=1||NEED(t('开车 1','Driving 1','Condução 1')),next:c6Say(c6Albertina,t(`每个星期六你开着皮卡在教堂和牧场之间跑两趟。${K}在后座换衣服，从葡语课本换到牛仔靴，二十分钟换一种语言。`,`Every Saturday you run the pickup twice between church and ranch. ${K} changes in the back seat, from the Portuguese primer to cowboy boots, a new language every twenty minutes.`,`Todos os sábados fazes duas viagens de carrinha entre a igreja e o rancho. ${K} muda de roupa no banco de trás, da cartilha portuguesa para as botas de cowboy, uma língua nova a cada vinte minutos.`),()=>{S.flags.f6_sat='both';stat('tex',1);stat('saud',-1)})}]};
}
function c6Albertina(){
 const K=c6K();
 return {title:t('最后一盆罗勒','The last pot of basil','O último manjerico'),meta:C6M('第十一年 · 六月','Year eleven · June','Décimo primeiro ano · junho'),text:[
  t('圣安东尼节前一个星期，阿尔贝蒂娜没有来店里拿面包。神父说她走得很安静，在自己的椅子上，膝盖上放着一件没织完的毛线活。','A week before Santo António, Albertina doesn\'t come by for her bread. The priest says she went quietly, in her own chair, a piece of unfinished knitting on her lap.','Uma semana antes do Santo António, a Albertina não aparece para buscar o pão. O padre diz que se foi em paz, na sua cadeira, com um tricô por acabar no colo.'),
  t(`她留下一张字条，字写得很大：教堂地下室的罗勒种子，交给${K}。“孩子知道怎么种。我教过。”`,`She left a note in big handwriting: the basil seed in the church basement goes to ${K}. "The little one knows how to sow it. I made sure."`,`Deixou um bilhete em letra grande: as sementes de manjerico da cave da igreja ficam para ${K}. «Sabe como se semeia. Eu ensinei.»`),
  t('葬礼在圣安东尼教堂。人比任何一次弥撒都多，一半的人不会说葡语，但都跟着唱了。','The funeral is at St. Anthony\'s. More people than at any Mass. Half of them don\'t speak Portuguese. They all sing anyway.','O funeral é na Igreja de Santo António. Mais gente do que em qualquer missa. Metade não fala português. Cantam todos na mesma.')],choices:[
  {t:t('在最后唱一首她最喜欢的法多','At the end, sing her favorite fado','No fim, cantar o fado preferido dela'),next:c6Say(c6Flood,t('第二段的词你记不全，前排的老太太们替你唱完了。','You don\'t remember all of the second verse. The old ladies in the front pew finish it for you.','Não te lembras da segunda quadra toda. As senhoras do primeiro banco acabam-na por ti.'),()=>stat('saud',-3))},
  {t:t(`让${res(K,'zh')}用葡语念一段经文`,`Let ${res(K,'en')} read a passage in Portuguese`,`Deixar ${res(K,'pt')} ler uma passagem em português`),req:()=>['pt','both'].includes(S.flags.f6_sat)||S.flags.f6_acc==='home'||NEED(t('上过葡语课，或在家说葡语','Portuguese school, or Portuguese at home','Escola de português, ou português em casa')),next:c6Say(c6Flood,t(`${K}念得很慢，有两个词念错了，就像你当年在婚礼上一样。没人在乎。神父念完最后一句，补了一句：“她会说，发音还得练。”`,`${K} reads slowly and gets two words wrong, just as you did at your wedding. Nobody minds. The priest says the last line and adds: "She'd say the pronunciation needs work."`,`${K} lê devagar e troca duas palavras, tal como tu no teu casamento. Ninguém se importa. O padre diz a última frase e acrescenta: «Ela diria que a pronúncia ainda precisa de treino.»`),()=>stat('saud',-2))},
  {t:t('关店一天，在空地上为所有人做饭','Close the shop and cook for everyone on the lot','Fechar o restaurante e cozinhar para todos no terreno'),next:c6Say(c6Flood,t('你在空地上摆了长桌：烤沙丁鱼、羽衣甘蓝汤，还有她的甜面包——照着她写在面粉袋上的方子做的，第一次就成了。','You set long tables out on the lot: grilled sardines, kale soup, and her sweet bread, made from the recipe she wrote on a flour sack. It comes out right the first time.','Pões mesas compridas no terreno: sardinhas assadas, caldo verde e a massa sovada dela, feita pela receita que escreveu num saco de farinha. Sai bem à primeira.'),()=>{S.rep+=2})}]};
}
function c6Flood(){
 const K=c6K();
 return {title:t('布拉索斯河涨水','The Brazos comes up','O Brazos sobe'),meta:C6M('第十二年 · 五月','Year twelve · May','Décimo segundo ano · maio'),text:[
  t('五月下了三天雨。第三天夜里，河水漫过了州际公路的辅路，主街变成了一条浅浅的、棕色的河。','It rains for three days in May. On the third night the river tops the I-35 frontage road and Main Street turns into a shallow brown river of its own.','Chove três dias em maio. Na terceira noite o rio galga a via de serviço da I-35 e a rua principal vira um rio castanho e raso.'),
  t(`早上水退了，墙上留下两英尺高的泥线。冷库停了电，烤架泡了水，瓷砖掉了一排。${K}从柜台底下抢出来一样东西，紧紧抱着：若泽的账本。`,`By morning the water has gone, leaving a mud line two feet up the walls. The cooler is dead, the grill drowned, a row of tiles fallen. ${K} has rescued one thing from under the counter and is hugging it tight: José's ledger.`,`De manhã a água já se foi, deixando uma marca de lama a sessenta centímetros nas paredes. A câmara frigorífica morreu, a grelha afogou-se, caiu uma fila de azulejos. ${K} salvou uma coisa de debaixo do balcão e tem-na bem abraçada: o livro de contas do José.`),
  S.rep>=40?t('九点钟，门口来了一排皮卡：牧场的、酒吧的、教会的，还有几个你叫不出名字的卡车司机。没人打电话叫他们。','At nine a line of pickups pulls up outside: ranch, saloon, church, and a couple of truckers whose names you never knew. Nobody called them.','Às nove chega uma fila de carrinhas: do rancho, do bar, da igreja, e uns camionistas de quem nunca soubeste o nome. Ninguém os chamou.')
   :t('九点钟，厄尔一个人开着皮卡来了，后斗里放着两把铁锹。“其他人会来的，”他说，“等他们把自己家的水舀完。”','At nine Earl turns up alone, two shovels in the bed of his pickup. "The others\'ll come," he says. "Once they\'ve bailed out their own places."','Às nove aparece o Earl sozinho, com duas pás na caixa da carrinha. «Os outros vêm», diz ele. «Quando acabarem de tirar a água das casas deles.»')],choices:[
  {t:t('照着若泽的样子，原样修好','Put it back exactly the way José had it','Repor tudo tal e qual como o José tinha'),next:c6Say(c6Summer,t('你们把店恢复了原样，连那块签了名的瓷砖也贴回了原处。重新开门那天，常客们说什么都没变。这正是你想听的。','You put the shop back exactly as it was, down to the tile with the signatures. On reopening day the regulars say nothing has changed. That is exactly what you wanted to hear.','Repõem o restaurante tal e qual como estava, até o azulejo com as assinaturas. No dia da reabertura, os clientes dizem que nada mudou. Era isso mesmo que querias ouvir.'),()=>{S.flags.f6_flood='same';S.cash-=Math.min(Math.max(S.cash,0),1500)})},
  {t:t('把厨房垫高一英尺，从里斯本订新瓷砖','Raise the kitchen a foot and order new tiles from Lisbon','Subir a cozinha trinta centímetros e encomendar azulejos novos de Lisboa'),req:MONEY(2500),next:c6Say(c6Summer,t(`你把厨房整个垫高了一英尺，又从里斯本订了一批新瓷砖。旧的那排，你让${K}挑一块留着。新墙上的蓝色多了一点。若泽大概不会介意。`,`You raise the whole kitchen a foot and order a batch of new tiles from Lisbon. Of the old row, ${K} picks one to keep. The new wall is a little bluer. José probably wouldn't mind.`,`Sobes a cozinha inteira trinta centímetros e encomendas azulejos novos de Lisboa. Da fila antiga, ${K} escolhe um para guardar. A parede nova é um pouco mais azul. O José não se havia de importar.`),()=>{S.flags.f6_flood='raise';S.cash-=2500;stat('saud',-2)})},
  {t:t('先在空地上支起烤架，被淹的人家免费吃一周','Set up the grill on the lot first — a free week for every flooded family','Montar primeiro a grelha no terreno — uma semana grátis para quem ficou alagado'),next:c6Say(c6Summer,t(`店还没修，你先在空地上支起了烤架。整整一周，谁家被淹了，谁就来吃，不收钱。${K}负责记账，每一页都写着“$0”，写得工工整整。`,`Before fixing the shop you set up the grill on the lot. For a whole week, anyone who got flooded eats free. ${K} keeps the books, every page reading "$0" in very neat handwriting.`,`Antes de arranjar o restaurante montas a grelha no terreno. Durante uma semana inteira, quem ficou com a casa alagada come de graça. ${K} faz as contas, e todas as páginas dizem «$0», em letra muito caprichada.`),()=>{S.flags.f6_flood='free';S.rep+=4})}]};
}
function c6Summer(){
 const K=c6K();
 return {title:t('在外婆家的夏天','A summer at Grandma\'s','Um verão em casa da avó'),meta:C6M('第十三年 · 八月','Year thirteen · August','Décimo terceiro ano · agosto'),text:[
  t(`十二岁那年夏天，${K}第一次一个人飞去里斯本，脖子上挂着“无人陪伴儿童”的牌子，口袋里揣着一张写满电话号码的纸。`,`The summer ${K} turns twelve comes the first flight to Lisbon alone: an "unaccompanied minor" lanyard round the neck, a sheet of phone numbers in one pocket.`,`No verão dos doze anos, ${K} faz o primeiro voo sem os pais para Lisboa, com o cordão de «menor não acompanhado» ao pescoço e uma folha cheia de números de telefone no bolso.`),
  t('八月初来了一个电话。背景里有电车声，楼下有人在吆喝卖沙丁鱼。“外婆说这里的学校也很好。我能不能……再待一年？”','Early August, a phone call. Trams in the background, someone downstairs calling out sardines for sale. "Grandma says the schools here are good too. Can I… stay a year?"','No início de agosto, um telefonema. Ao fundo, elétricos e alguém lá em baixo a apregoar sardinhas. «A avó diz que as escolas aqui também são boas. Posso… ficar um ano?»'),
  t(`${P1()}在你旁边听完，没说话，只是把手放在你的手背上。`,`${P1()}, beside you, hears it all, says nothing, and puts a hand over yours.`,`${P1()}, ao teu lado, ouve tudo, não diz nada e pousa a mão sobre a tua.`)],choices:[
  {t:t('“八月底回家。”','"Home at the end of August."','«Em casa no fim de agosto.»'),next:c6Say(c6Mom,t('电话那头沉默了三秒。“好吧。”又过了三秒：“那我能把外婆的猫带回去吗？”不能。','Three seconds of silence on the line. "Okay." Three more: "Can I bring Grandma\'s cat back?" No.','Três segundos de silêncio. «Está bem.» Mais três: «Posso levar o gato da avó?» Não.'),()=>{S.flags.f6_lis='summer'})},
  {t:t('“待一年，然后你自己决定。”','"One year. Then you decide."','«Um ano. Depois decides tu.»'),next:c6Say(c6Mom,t(`那一年店里少了一个记账的人。你每个星期天早上打电话，听着${K}的葡语一个月比一个月更像你妈妈，英语一个月比一个月更像你。第二年六月，${K}自己订了回程的机票。`,`That year the shop is short one bookkeeper. You call every Sunday morning and hear ${K}'s Portuguese sound more like your mother's each month, and the English more like yours. The next June, ${K} books the flight home without being asked.`,`Nesse ano o restaurante fica sem quem faça as contas. Ligas todos os domingos de manhã e ouves o português de ${K} soar cada mês mais à tua mãe, e o inglês cada mês mais a ti. No junho seguinte, ${K} marca o voo de regresso sem ninguém pedir.`),()=>{S.flags.f6_lis='year';stat('saud',-3)})},
  {t:t('“先听我讲讲若泽。”','"First, let me tell you about José."','«Primeiro, deixa-me contar-te do José.»'),next:c6Say(c6Mom,t(`你在电话里讲了若泽：一个在德州待了三十年、一直说“明年就回去”的人。电话那头安静了很久。“那我八月回来，”${K}说，“明年再来看外婆。每年都来。”`,`Over the phone you tell the story of José: a man who spent thirty years in Texas always saying "next year I'll go home." A long quiet on the line. "Then I'll come back in August," ${K} says. "And visit Grandma next year. Every year."`,`Ao telefone contas a história do José: um homem que passou trinta anos no Texas a dizer «para o ano volto». Um silêncio comprido. «Então volto em agosto», diz ${K}. «E venho ver a avó para o ano. Todos os anos.»`),()=>{S.flags.f6_lis='story';stat('saud',-1)})}]};
}
function c6Mom(){
 const K=c6K();
 return {title:t('妈妈老了','Mom is getting old','A mãe está a ficar velha'),meta:C6M('第十四年','Year fourteen','Décimo quarto ano'),text:[
  t('鲁伊打来电话，声音和很多年前一样累：“妈上个月在楼梯上摔了一跤。没大事。可阿尔法马的楼梯，她一个人已经上不去了。”','Rui calls, sounding as tired as he did years ago. "Mom fell on the stairs last month. Nothing serious. But she can\'t manage the Alfama steps alone anymore."','O Rui liga, com a mesma voz cansada de há muitos anos. «A mãe caiu nas escadas no mês passado. Nada de grave. Mas já não consegue subir as escadinhas de Alfama sozinha.»'),
  t('你在德州有一个家，在里斯本有一个妈妈。中间隔着十一个小时的飞机。','You have a home in Texas and a mother in Lisbon. Between them, eleven hours of flying.','Tens uma casa no Texas e uma mãe em Lisboa. Pelo meio, onze horas de avião.')],choices:[
  {t:t('把妈妈接到德州来','Bring Mom to Texas','Trazer a mãe para o Texas'),next:c6Say(c6Teen,t('妈妈来了，带着两个行李箱和一袋自己腌的橄榄。她说德州太热、太大、太吵，然后在第三个星期接管了店里的羽衣甘蓝汤，再也没还回来。教堂里阿尔贝蒂娜那把空椅子，现在是她的。','Your mother comes, with two suitcases and a bag of olives she cured herself. She says Texas is too hot, too big, too loud, and in her third week takes over the shop\'s kale soup and never gives it back. Albertina\'s empty chair at church is hers now.','A tua mãe vem, com duas malas e um saco de azeitonas curadas por ela. Diz que o Texas é quente demais, grande demais, barulhento demais, e à terceira semana toma conta do caldo verde do restaurante e nunca mais o devolve. A cadeira vazia da Albertina na igreja agora é dela.'),()=>{S.flags.f6_mom='texas';stat('saud',-4)})},
  {t:t('每三个月飞回去一次','Fly back every three months','Ir lá de três em três meses'),next:c6Say(c6Teen,t(`你每三个月飞一次里斯本，每次待十天。里程攒到第二年，够给${K}也买一张票。妈妈说你来得太勤了，然后每次都提前一个星期开始做饭。`,`You fly to Lisbon every three months and stay ten days each time. By the second year the air miles cover a ticket for ${K} too. Your mother says you come too often, then starts cooking a week before every visit.`,`Vais a Lisboa de três em três meses e ficas dez dias de cada vez. Ao segundo ano, as milhas já chegam para um bilhete para ${K} também. A tua mãe diz que vens vezes demais, e começa a cozinhar uma semana antes de cada visita.`),()=>{S.flags.f6_mom='fly';S.cash-=Math.min(Math.max(S.cash,0),1200)})},
  {t:t('出钱，让鲁伊在河边给她找一套有电梯的公寓','Pay for a flat by the river with a lift; Rui does the rest','Pagar um apartamento junto ao rio com elevador; o Rui trata do resto'),next:c6Say(c6Teen,t(`你出钱，鲁伊出力，给妈妈在河边找了一套有电梯的公寓。她抱怨电梯“像个棺材”，可每天傍晚都坐着它下楼，去河边看船。每个星期天，她在视频里给${K}讲哪条船去了哪里。`,`You put up the money, Rui does the legwork, and Mom gets a flat by the river with a lift. She complains the lift is "like a coffin," but rides it down every evening to watch the boats. Every Sunday, on video, she tells ${K} where each boat was going.`,`Tu pões o dinheiro, o Rui trata do resto, e a mãe fica com um apartamento junto ao rio, com elevador. Queixa-se de que o elevador «parece um caixão», mas desce nele todas as tardes para ver os barcos. Todos os domingos, por videochamada, conta a ${K} para onde ia cada barco.`),()=>{S.flags.f6_mom='rui';S.cash-=Math.min(Math.max(S.cash,0),2000)})}]};
}
function c6Teen(){
 const K=c6K();
 return {title:t('十六岁','Sixteen','Dezasseis anos'),meta:C6M('第十七年','Year seventeen','Décimo sétimo ano'),text:[
  t(`十六岁的${K}已经比你高了。周末在烤架前一站就是一整天，用葡语骂炭，用英语招呼客人，把小费存进一个咖啡罐。`,`At sixteen ${K} is taller than you. Weekends at the grill all day long, cursing the coals in Portuguese, greeting customers in English, saving tips in a coffee can.`,`Aos dezasseis anos, ${K} já te passou em altura. Aos fins de semana passa o dia inteiro à grelha, a ralhar com as brasas em português, a cumprimentar os clientes em inglês e a guardar as gorjetas numa lata de café.`),
  t(`一个星期天晚上关了店，${K}把一张纸推到你面前。最上面写着三个字：我的计划。`,`One Sunday night after closing, ${K} slides a sheet of paper across to you. At the top it says: MY PLAN.`,`Num domingo à noite, depois de fechar, ${K} empurra uma folha na tua direção. Em cima diz: O MEU PLANO.`)],choices:[
  {t:t('奥斯汀的得州大学：“我想学工程。”','UT Austin: "I want to study engineering."','Universidade do Texas, em Austin: «Quero estudar engenharia.»'),next:c6Say(c6Letters,t(`“一个小时车程，”${K}说，“周末我还回来翻炭。”你知道这句话十个周末里能兑现三个。三个就够了。`,`"It's an hour's drive," ${K} says. "I'll still come back weekends to work the coals." You know about three weekends in ten will really happen. Three is plenty.`,`«É uma hora de carro», diz ${K}. «Venho aos fins de semana tratar das brasas.» Sabes que, em cada dez fins de semana, três vão mesmo acontecer. Três chegam.`),()=>{S.flags.f6_future='austin'})},
  {t:t('里斯本大学：“我想去外婆那边念书。”','University of Lisbon: "I want to study over by Grandma."','Universidade de Lisboa: «Quero estudar lá, ao pé da avó.»'),next:c6Say(c6Letters,t('你看着那张纸，看了很久。二十八岁那年你从那边来到这边，现在你的孩子要从这边回到那边。你在家长签字栏签了名，写得比平时慢。','You look at the page a long time. At twenty-eight you came from there to here; now your child wants to go from here to there. You sign the parent line more slowly than usual.','Olhas para o papel muito tempo. Aos vinte e oito anos vieste de lá para cá; agora quem é teu quer ir de cá para lá. Assinas a linha do encarregado de educação mais devagar do que é costume.'),()=>{S.flags.f6_future='lisbon';stat('saud',-2)})},
  {t:t('“我要接这家店。先去社区大学念餐饮管理。”','"I\'m taking over the shop. Community college first — restaurant management."','«Vou ficar com o restaurante. Primeiro o politécnico — gestão de restauração.»'),next:c6Say(c6Letters,t(`“你不是非得这样，”你说。“我知道，”${K}说，“所以我才要。”`,`"You don't have to," you say. "I know," ${K} says. "That's why I want to."`,`«Não tens de fazer isto», dizes. «Eu sei», diz ${K}. «É por isso que quero.»`),()=>{S.flags.f6_future='shop';stat('tex',2)})}]};
}
function c6Letters(){
 const K=c6K(),n=S.letters||0;
 return {title:t('若泽的信','José\'s letters','As cartas do José'),meta:C6M('第十八年 · 毕业前夜','Year eighteen · The night before','Décimo oitavo ano · Na véspera'),text:[
  n>=12?t('毕业前一晚，你从抽屉最里面拿出那个牛皮纸袋。十二封信的复印件——原件早就寄回里斯本，留在了妈妈那里。','The night before graduation you take the manila envelope from the back of the drawer: photocopies of all twelve letters. The originals went to Lisbon long ago and stayed with your mother.','Na véspera da formatura tiras do fundo da gaveta o envelope pardo: fotocópias das doze cartas. Os originais foram para Lisboa há muito e ficaram com a tua mãe.')
   :t(`毕业前一晚，你从抽屉里拿出若泽留下的信——你找到的那 ${n} 封。你一直没找全。`,`The night before graduation you take out José's letters — the ${n} you found. You never did find them all.`,`Na véspera da formatura tiras da gaveta as cartas do José — as ${n} que encontraste. Nunca chegaste a encontrá-las todas.`),
  t(`${K}读到半夜。最后一封读完，抬起头问：“他为什么一直没回去？”`,`${K} reads until midnight. After the last one, looks up and asks: "Why did he never go back?"`,`${K} lê até à meia-noite. Depois da última, levanta os olhos e pergunta: «Porque é que ele nunca voltou?»`)],choices:[
  {t:t('“因为他怕回去以后，发现那里已经不是家了。”','"Because he was afraid he\'d go back and find it wasn\'t home anymore."','«Porque tinha medo de voltar e descobrir que aquilo já não era casa.»'),next:c6Say(c6Grad,t(`${K}想了一会儿：“那你呢？”你说：“我两边都回。所以两边都还是。”`,`${K} thinks about it. "And you?" You say: "I go back to both. So both still are."`,`${K} pensa um pouco. «E tu?» Respondes: «Eu volto aos dois. Por isso os dois ainda são.»`))},
  {t:t('“因为他在这儿等一个人。后来那个人来了——是我。”','"Because he was waiting here for someone. Then someone came. Me."','«Porque estava aqui à espera de alguém. Depois esse alguém veio. Eu.»'),next:c6Say(c6Grad,t(`${K}把信叠好放回袋子里，又抽出最后一封，夹进了自己的毕业演讲稿。`,`${K} folds the letters back into the envelope, then takes out the last one again and tucks it between the pages of the graduation speech.`,`${K} dobra as cartas e volta a pô-las no envelope, depois tira outra vez a última e mete-a entre as folhas do discurso de formatura.`))},
  {t:t('“我不知道。我一直在想。”','"I don\'t know. I still think about it."','«Não sei. Ainda penso nisso.»'),next:c6Say(c6Grad,t('你们俩在柜台边坐到天快亮，谁也没再说话。有些问题不需要答案，只需要有人陪你一起不知道。','The two of you sit at the counter till nearly dawn without another word. Some questions don\'t need answers; they just need someone to not-know them with you.','Ficam os dois ao balcão até quase de manhã, sem dizer mais nada. Há perguntas que não precisam de resposta; só precisam de alguém que não saiba contigo.'))}]};
}
function c6Grad(){
 const K=c6K(),two=S.flags.f6_two;
 return {title:t('毕业典礼','Graduation','A formatura'),meta:C6M('第十八年 · 五月','Year eighteen · May','Décimo oitavo ano · maio'),text:[
  t('圣鲁伊斯高中的毕业典礼在橄榄球场上办：八十七个毕业生，一千个家长，五月的风把学位帽吹得满场跑。','San Luís High holds graduation on the football field: eighty-seven graduates, a thousand parents, and a May wind sending mortarboards skittering across the turf.','A formatura do liceu de San Luís é no campo de futebol americano: oitenta e sete finalistas, mil pais, e um vento de maio a fazer voar os capelos pelo relvado.'),
  S.flags.f6_mom==='texas'?t('妈妈坐在你旁边，戴着一顶德州草帽。她说这顶帽子是“德州唯一做对了的东西”。','Your mother sits beside you in a Texas straw hat, which she says "is the one thing Texas got right."','A tua mãe está sentada ao teu lado com um chapéu de palha texano, que diz ser «a única coisa que o Texas fez bem».')
   :t('妈妈在里斯本。手机架在你膝盖上，屏幕朝着球场。','Your mother is in Lisbon. The phone is propped on your knee, its screen facing the field.','A tua mãe está em Lisboa. O telemóvel está apoiado no teu joelho, com o ecrã virado para o campo.'),
  two==='baby'?t('看台上，家里的老二举着一块自己画的牌子，有一个字母写错了。','Up in the stands, the younger one holds a homemade sign with one letter wrong.','Lá em cima, na bancada, o mais novo da casa segura um cartaz feito à mão, com uma letra trocada.')
   :two==='foster'?t(`那个背着一书包石头来的男孩，今年也毕业。排队入场时，他偷偷往${res(K,'zh')}的礼服口袋里塞了一块石头。`,`The boy who arrived with a backpack full of rocks is graduating too. Lining up, he slips a stone into the pocket of ${res(K,'en')}'s gown.`,`O rapaz que chegou com uma mochila cheia de pedras também acaba o liceu. Na fila, mete uma pedra no bolso da beca de ${res(K,'pt')}.`):'',
  F1.L('grad'),
  t(`${K}是学生代表之一，上台讲话。讲到一半，${K}换成葡语说了一句，然后又换回英语，没有翻译。`,`${K} is one of the student speakers. Halfway through, ${K} switches to Portuguese for a single sentence, then back to English, and doesn't translate.`,`${K} é um dos oradores. A meio, muda para português numa frase, depois volta ao inglês, e não traduz.`)].filter(Boolean),choices:[
  {t:t('你听懂了那一句','You understood that sentence','Percebeste aquela frase'),next:c6Say(c6End,t('那句话是：“我爸说，家不是你出生的地方，是你每天早上开门的地方。”你从来没说过这句话。你决定，从今天起，你说过。','The sentence was: "My father says home isn\'t where you\'re born; it\'s where you open the door every morning." You never said that. You decide that, as of today, you did.','A frase era: «O meu pai diz que casa não é onde se nasce; é onde se abre a porta todas as manhãs.» Nunca disseste isso. Decides que, a partir de hoje, disseste.'))},
  {t:t('站起来，第一个鼓掌','Stand up and be the first to clap','Levantar-te e ser o primeiro a aplaudir'),next:c6Say(c6End,t('你站起来的时候，忘了手里还拿着一盒蛋挞。蛋挞撒了一地。后排的人笑了，然后所有人都站了起来。','When you stand you forget you\'re holding a box of custard tarts. They go everywhere. The row behind laughs, and then everybody is on their feet.','Quando te levantas esqueces-te de que tens uma caixa de pastéis de nata na mão. Voam para todo o lado. A fila de trás ri-se, e depois estão todos de pé.'))}]};
}
function c6End(){
 const K=c6K(),f=S.flags.f6_future||'shop';S.flags.f6_done=true;
 log('第六章「根」完','Chapter 6, "Roots," complete','Capítulo 6, «Raízes», concluído');
 return {title:t('招牌','The sign','A tabuleta'),meta:C6M('那年九月','That September','Nesse setembro'),text:[
  {shop:t(`九月，社区大学开学第一天，${K}先来店里开了门，才去上课。招牌下面多了一行小字，是${K}自己刷上去的：“若泽的，然后是我们的。”`,`In September, on the first day of community college, ${K} opens the shop before going to class. Under the sign there's a new line of small letters, painted by ${K}: "José's, then ours."`,`Em setembro, no primeiro dia de aulas no politécnico, ${K} abre o restaurante antes de ir para a escola. Por baixo da tabuleta há uma linha nova de letras pequenas, pintada por ${K}: «Do José, depois nossa.»`),
   austin:t(`九月，你开车把${K}送到奥斯汀的宿舍楼下。回来的路上，副驾驶座空着。到了店门口，你发现招牌亮着——${K}走之前，修好了那个暗了十年的字母。`,`In September you drive ${K} to a dorm in Austin. The passenger seat is empty on the way home. Pulling up at the shop, you find the sign lit: before leaving, ${K} fixed the letter that had been dark for ten years.`,`Em setembro levas ${K} de carro até à residência em Austin. No regresso, o lugar do pendura vai vazio. Quando chegas ao restaurante vês a tabuleta acesa: antes de partir, ${K} arranjou a letra que estava apagada há dez anos.`),
   lisbon:t(`九月，你在奥斯汀机场送${K}上飞机，就是你当年那条航线，反过来。安检口前，${K}回头说：“我会回来的。不是‘明年’那种。”`,`In September you see ${K} off at the Austin airport: your own route from all those years ago, in reverse. At security ${K} turns back. "I'll come back. Not the 'next year' kind."`,`Em setembro despedes-te de ${K} no aeroporto de Austin: a tua rota de há tantos anos, ao contrário. No controlo de segurança, ${K} volta-se: «Eu volto. E não é daquele "para o ano".»`)}[f],
  t(`那天晚上，你和${P1()}坐在后门台阶上。空地上的罗勒，已经是阿尔贝蒂娜那批种子的第八代了。`,`That night you and ${P1()} sit on the back step. The basil on the lot is the eighth generation from Albertina's seed.`,`Nessa noite tu e ${P1()} sentam-se no degrau das traseiras. Os manjericos do terreno já são a oitava geração das sementes da Albertina.`)],choices:[
  {t:t('关掉招牌的灯','Switch off the sign','Apagar a tabuleta'),next:c6Fin},
  {t:t('让它亮一整夜','Leave it lit all night','Deixá-la acesa a noite toda'),fx:()=>{S.flags.f6_light=1},next:c6Fin}]};
}

/* ---------- Chapter 5 «Ficar»: staying without marrying ---------- */
const s5P=()=>!!(S.settled&&NPCS[S.settled]&&S.flags.f5_unwed);
function SOLO5(finalScene){F1.fin=finalScene;return s5Open()}
function s5Open(){
 return {title:t('签证只认店','The visa knows the shop','O visto conhece o restaurante'),meta:S5M('一周年之后','After the year','Depois do ano'),text:[
  t('格蕾丝的文件签完了，店是你的了。她又推过来一个文件夹：“现在说说你那张签证。”','Grace\'s papers are signed; the shop is yours. She slides another folder across. "Now let\'s talk about that visa of yours."','Os papéis da Grace estão assinados; o restaurante é teu. Ela empurra outra pasta. «Agora vamos falar desse teu visto.»'),
  t('“条约投资者签证可以一直续下去，但永远不会变成绿卡。只要店真在营业、真在雇人，不只是你给自己买的一份工作，就能续。每隔几年，你得回里斯本，去美国大使馆，当面再证明一次。”','"A treaty investor visa can be renewed again and again, but it never turns into a green card. As long as the shop is a real business — really trading, really hiring, not just a job you bought yourself — you can keep it. Every few years you go back to Lisbon, to the U.S. embassy, and prove it in person."','«O visto de investidor por tratado pode ser renovado vezes sem conta, mas nunca se transforma num green card. Enquanto o restaurante for um negócio a sério — a faturar a sério, a empregar a sério, e não só um emprego que compraste para ti — podes mantê-lo. De tantos em tantos anos voltas a Lisboa, à embaixada americana, e provas isso em pessoa.»'),
  s5P()?t(`${P1()}坐在你旁边，一直没说话。出门的时候才开口：“我不需要一张纸来证明我睡在哪儿。可你需要一张纸来证明你能留下。那我们就把这家店弄得谁也挑不出毛病。”`,`${P1()} sits beside you and says nothing the whole time. Only on the way out: "I don't need a piece of paper to prove where I sleep. You need one to prove you can stay. So let's make this shop something nobody can question."`,`${P1()} fica ao teu lado sem dizer nada. Só à saída: «Eu não preciso de um papel para provar onde durmo. Tu precisas de um para provar que podes ficar. Então vamos fazer deste restaurante uma coisa que ninguém possa pôr em causa.»`)
   :t('你一个人走回店里。主街上有人跟你打招呼，叫的是你的名字，不是“那个葡萄牙人”。','You walk back to the shop alone. Someone on Main Street calls hello — by your name, not "that Portuguese fella."','Voltas sozinho para o restaurante. Alguém na rua principal cumprimenta-te — pelo nome, não por «aquele português».')],choices:[
  {t:t('雇一个镇上的人，全职，带医保','Hire someone from town full-time, with health insurance','Contratar alguém da vila a tempo inteiro, com seguro de saúde'),next:c6Say(s5Thanks,t('你雇了马丽索尔的侄子胡利奥。他第一周烧糊了三锅豆子，第二周一锅都没糊。格蕾丝在文件里写下：“创造就业：一个。”她说一个就有分量。','You hire Marisol\'s nephew Julio. He burns three pots of beans his first week and none the second. In the file Grace writes: "Jobs created: one." One counts, she says.','Contratas o sobrinho da Marisol, o Julio. Queima três panelas de feijão na primeira semana e nenhuma na segunda. No processo, a Grace escreve: «Postos de trabalho criados: um.» Um conta, diz ela.'),()=>{S.flags.f5_inv='hire';S.rep+=1})},
  {t:t('把钱投进厨房：第二个烟熏炉、新排风','Put the money into the kitchen: a second smoker, new extraction','Pôr o dinheiro na cozinha: um segundo fumeiro, exaustão nova'),req:MONEY(1500),next:c6Say(s5Thanks,t('账上大半的钱进了厨房。格蕾丝把每一张发票都复印了两份。“大使馆的人最喜欢发票，”她说，“比喜欢人还喜欢。”','Most of the account goes into the kitchen. Grace photocopies every invoice twice. "Embassy people love invoices," she says. "More than they love people."','A maior parte da conta vai para a cozinha. A Grace fotocopia cada fatura duas vezes. «Na embaixada adoram faturas», diz ela. «Mais do que adoram pessoas.»'),()=>{S.flags.f5_inv='kitchen';S.cash-=1500;stat('oficio',1)})},
  {t:t('什么都不加，只把账记得干干净净','Add nothing; just keep the books spotless','Não acrescentar nada; só manter as contas impecáveis'),next:c6Say(s5Thanks,t('格蕾丝皱了皱眉：“干净的账本是好事。只是别让它干净得像一份没人要的工作。”','Grace frowns slightly. "Clean books are good. Just don\'t let them look like a job nobody else wanted."','A Grace franze ligeiramente a testa. «Contas limpas são boas. Só não as deixes parecer um emprego que mais ninguém queria.»'),()=>{S.flags.f5_inv='lean'})}]};
}
function s5Thanks(){
 return {title:t('孤儿感恩节','The orphans\' Thanksgiving','O Dia de Ação de Graças dos órfãos'),meta:S5M('第二年 · 十一月','Year two · November','Segundo ano · novembro'),text:[
  t('感恩节这天，大多数人都回家了。你在店门上挂了一块牌子：“没地方去的人，今晚来这儿。”','On Thanksgiving most people go home. You hang a sign on the door: "Nowhere to go? Come here tonight."','No Dia de Ação de Graças a maioria vai para casa. Penduras um letreiro na porta: «Não tens para onde ir? Vem cá hoje à noite.»'),
  t('来了十九个人：三个回不了家的卡车司机，玛雅的几个外州学生，值班间隙跑过来的汉娜医生，还有厄尔——他说他有地方去，只是不想去。','Nineteen people come: three truckers who can\'t make it home, a handful of Maya\'s out-of-state students, Dr. Hannah between calls, and Earl — who says he has somewhere to go, he just doesn\'t want to.','Vêm dezanove pessoas: três camionistas que não conseguem ir a casa, uns quantos alunos da Maya de outros estados, a Dra. Hannah entre duas chamadas, e o Earl — que diz que tem para onde ir, só não lhe apetece.'),
  s5P()?t(`${P1()}负责切火鸡，切得很糟，还不让任何人帮忙。`,`${P1()} carves the turkey, badly, and won't let anyone help.`,`${P1()} trincha o peru, mal, e não deixa ninguém ajudar.`):''].filter(Boolean),choices:[
  {t:t('做葡式的：鳕鱼和羽衣甘蓝汤','Portuguese: salt cod and kale soup','À portuguesa: bacalhau e caldo verde'),next:c6Say(s5God,t('一个卡车司机吃了三盘鳕鱼，问这道菜叫什么。你告诉了他。“我会记住的，”他说，“明年还来。”第二年他真来了。','One trucker eats three plates of salt cod and asks what it\'s called. You tell him. "I\'ll remember," he says. "Be back next year." The next year, he is.','Um camionista come três pratos de bacalhau e pergunta como se chama. Dizes-lhe. «Vou lembrar-me», diz ele. «Para o ano cá estou.» No ano seguinte, lá está.'),()=>stat('saud',-2))},
  {t:t('做德州的：烟熏炉里熏一只火鸡','Texan: a turkey in the smoker','À texana: um peru no fumeiro'),next:c6Say(s5God,t('火鸡在烟熏炉里待了十四个小时。厄尔说这是他吃过第二好的火鸡。最好的那只是若泽熏的，九九年。','The turkey spends fourteen hours in the smoker. Earl says it\'s the second-best turkey he ever ate. The best was José\'s, back in \'99.','O peru passa catorze horas no fumeiro. O Earl diz que é o segundo melhor peru que já comeu. O melhor foi o do José, em 99.'),()=>stat('tex',2))},
  {t:t('让每个人带一道自己家乡的菜','Ask everyone to bring a dish from home','Pedir a cada um que traga um prato da sua terra'),next:c6Say(s5God,t('桌上有了墨西哥玉米粽、明尼苏达的砂锅、一个学生从尼日利亚带来的辣椒酱。你的沙丁鱼摆在正中间。厄尔带来的是一瓶波本。','The table fills with tamales, a Minnesota hotdish, a pepper sauce one student brought from Nigeria. Your sardines sit right in the middle. Earl brings a bottle of bourbon.','A mesa enche-se de tamales, de um guisado do Minnesota, de um molho picante que um aluno trouxe da Nigéria. As tuas sardinhas ficam mesmo ao meio. O Earl traz uma garrafa de bourbon.'),()=>{S.rep+=2})}]};
}
function s5God(){
 return {title:t('教父','Padrinho','O padrinho'),meta:S5M('第二年 · 冬天','Year two · Winter','Segundo ano · inverno'),text:[
  t('马丽索尔生了个儿子。洗礼前一周，她在牧场厨房里把你按在一张凳子上：“你来当教父。不许说不。”','Marisol has had a baby boy. A week before the baptism she sits you down on a stool in the ranch kitchen. "You\'re going to be his godfather. You don\'t get to say no."','A Marisol teve um menino. Uma semana antes do batizado senta-te num banco na cozinha do rancho. «Vais ser o padrinho. Não podes dizer que não.»'),
  t('在葡萄牙，教父得在孩子的一辈子里出现：生日、第一次领圣餐、第一次失恋。你算了算，至少二十年。','In Portugal a godfather turns up for a whole life: birthdays, first communion, first heartbreak. You do the math. Twenty years at least.','Em Portugal, um padrinho aparece a vida inteira: aniversários, primeira comunhão, primeiro desgosto de amor. Fazes as contas. Vinte anos, pelo menos.')],choices:[
  {t:t('把若泽抽屉里那枚圣安东尼小银章送给孩子','Give the baby the little silver Saint Anthony medal from José\'s drawer','Dar ao bebé a medalhinha de prata de Santo António da gaveta do José'),next:c6Say(s5Embassy,t('你把小银章别在了洗礼服上。马丽索尔说：“现在他有两个国家保佑了。”','You pin the medal to the christening gown. Marisol says: "Now he\'s got two countries looking out for him."','Prendes a medalha à roupa de batizado. A Marisol diz: «Agora tem dois países a olhar por ele.»'),()=>{S.flags.f5_god='medal';stat('saud',-1)})},
  {t:t('在洗礼簿上签字，再加一句承诺','Sign the register, and add a promise','Assinar o livro e acrescentar uma promessa'),next:c6Say(s5Embassy,t('签名下面，你用谁也看不懂的葡语加了一行：“十岁那年，教你翻炭。”','Under your signature you add a line in Portuguese nobody else can read: "At ten, I\'ll teach you the coals."','Por baixo da assinatura acrescentas uma linha em português que mais ninguém consegue ler: «Aos dez anos, ensino-te as brasas.»'),()=>{S.flags.f5_god='grill';stat('oficio',1)})},
  {t:t('“我怕我做不好。”——然后答应','"I\'m afraid I won\'t be any good at it." — then say yes','«Tenho medo de não ser bom nisto.» — e depois aceitar'),next:c6Say(s5Embassy,t('马丽索尔哼了一声：“谁做得好？若泽是我的教父，他把我的生日记错了二十年。可他每年都来。”','Marisol snorts. "Who\'s good at it? José was my godfather. He got my birthday wrong for twenty years. But he came every year."','A Marisol bufa. «Quem é que é bom nisso? O José foi meu padrinho. Enganou-se no meu aniversário durante vinte anos. Mas vinha todos os anos.»'),()=>{S.flags.f5_god='honest';addTrust('marisol',1)})}]};
}
function s5Embassy(){
 const ok=()=>{S.flags.f5_visa='ok'};
 return {title:t('里斯本的美国大使馆','The U.S. embassy in Lisbon','A Embaixada dos EUA em Lisboa'),meta:S5M('第三年 · 春天','Year three · Spring','Terceiro ano · primavera'),text:[
  t('护照里的签证快到期了。续签只能回里斯本，到美国大使馆当面面谈。你把店交给厄尔照看，飞了十一个小时。','The visa in your passport is running out. Renewal means Lisbon: an in-person interview at the U.S. embassy. You leave Earl to keep an eye on the shop and fly eleven hours.','O visto no teu passaporte está a acabar. Renovar quer dizer Lisboa: entrevista presencial na embaixada americana. Deixas o Earl a tomar conta do restaurante e voas onze horas.'),
  t('窗口后的签证官翻着你的文件：“您这门生意，除了养活您自己，还养活了谁？”','Behind the glass the consular officer leafs through your file. "Your business — besides supporting you, who else does it support?"','Atrás do vidro, o cônsul folheia o teu processo. «O seu negócio — além de o sustentar a si, sustenta mais quem?»')],choices:[
  {t:t('一个一个说店里的人','Talk about the people in the shop, one by one','Falar das pessoas do restaurante, uma a uma'),req:()=>S.flags.f5_inv==='hire'||(S.staff||[]).length>0||NEED(t('雇了员工','Staff on the payroll','Ter funcionários')),next:c6Say(s5Mom,t('谁的医保、谁的房租、谁上大学的学费，是从那几个烤架上挣出来的。签证官在表格上打了个勾：“下一位。”','Whose health insurance, whose rent, whose college tuition comes off those grills. The officer ticks a box. "Next."','O seguro de saúde de quem, a renda de quem, as propinas de quem saem daquelas grelhas. O cônsul faz um visto no formulário. «Próximo.»'),ok)},
  {t:t('从窗口下面推进去那一摞发票','Push the stack of invoices under the glass','Passar a pilha de faturas por baixo do vidro'),req:()=>S.flags.f5_inv==='kitchen'||NEED(t('投资过厨房','Having invested in the kitchen','Ter investido na cozinha')),next:c6Say(s5Mom,t('签证官翻了三张就停了：“够了。您是在建东西，不是在躲在东西后面。”','The officer stops after three. "That\'s enough. You\'re building something, not hiding behind it."','O cônsul para à terceira. «Chega. O senhor está a construir uma coisa, não a esconder-se atrás dela.»'),ok)},
  {t:t('用最正式的英语，一口气讲完营业额、雇员和税单','In your most formal English, rattle off turnover, staff and tax returns in one breath','No inglês mais formal que tens, despachar faturação, empregados e impostos de um fôlego'),req:()=>S.accent!=='浓'||NEED(t('口音不能太浓','An accent that isn\'t heavy','Um sotaque que não seja carregado')),next:c6Say(s5Mom,t('签证官抬起头：“您在德州待了几年？”“三年。”“听不出来。”你不知道这算不算夸奖。','The officer looks up. "How long have you been in Texas?" "Three years." "Can\'t tell." You\'re not sure that\'s a compliment.','O cônsul levanta os olhos. «Há quantos anos está no Texas?» «Três.» «Não se nota.» Não sabes bem se é um elogio.'),()=>{ok();stat('tex',1)})},
  {t:t('说实话：“主要是养活我自己。”','The truth: "Mostly me."','A verdade: «Sobretudo a mim.»'),fx:()=>{S.flags.f5_visa='wait'},next:s5Stuck}]};
}
function s5Stuck(){
 return {title:t('行政审查','Administrative processing','Processamento administrativo'),meta:S5M('三个星期','Three weeks','Três semanas'),text:[
  t('签证官递出来一张蓝色的纸：“需要进一步审查，一般几个星期。”你的护照被留下了。','The officer slides out a blue slip. "Further administrative processing. Usually a few weeks." Your passport stays behind.','O cônsul passa-te um papel azul. «Processamento administrativo adicional. Normalmente umas semanas.» O passaporte fica lá.'),
  t('你在里斯本困了三个星期。厄尔每天发来一张照片：开着的店门，门口排队的人，一块黑板上写着“老板在葡萄牙，菜照样好吃”。','You\'re stuck in Lisbon for three weeks. Earl sends a photo every day: the shop door open, a line outside, a chalkboard reading BOSS IS IN PORTUGAL. FOOD STILL GOOD.','Ficas preso em Lisboa três semanas. O Earl manda uma fotografia por dia: a porta do restaurante aberta, uma fila lá fora, um quadro a dizer O PATRÃO ESTÁ EM PORTUGAL. A COMIDA CONTINUA BOA.'),
  t('第三个星期二，护照寄回来了，里面贴着新签证。你发现自己有一点舍不得。','On the third Tuesday the passport comes back in the post with the new visa inside. You find you\'re a little sorry.','À terceira terça-feira o passaporte chega pelo correio com o visto novo lá dentro. Descobres que tens um bocadinho de pena.')],choices:[
  {t:t('收拾行李','Pack your bags','Fazer as malas'),fx:()=>{stat('saud',-4);addTrust('earl',1)},next:s5Mom}]};
}
function s5Mom(){
 return {title:t('妈妈的厨房','Mom\'s kitchen','A cozinha da mãe'),meta:S5M('里斯本 · 最后一晚','Lisbon · The last night','Lisboa · A última noite'),text:[
  t('走之前最后一晚，妈妈做了羽衣甘蓝汤，做得太多，像要喂一整条街。','Your last night, your mother makes kale soup — far too much, as if feeding the whole street.','Na última noite a tua mãe faz caldo verde — demais, como se fosse para a rua inteira.'),
  t('她洗着碗，背对着你：“你舅舅当年也这样。每次回来都说下次待久一点。后来就不回来了。”','Washing up with her back to you, she says: "Your uncle was the same. Every visit he said next time he\'d stay longer. Then he stopped coming."','A lavar a loiça, de costas para ti, diz: «O teu tio era igual. Sempre que vinha dizia que da próxima ficava mais tempo. Depois deixou de vir.»')],choices:[
  {t:t('“我每年都回来。说到做到。”','"I\'ll come back every year. And I mean it."','«Venho todos os anos. E é a sério.»'),next:c6Say(s5After,t('她没回头：“那你六月回来。圣安东尼节，阿尔法马的沙丁鱼。”你说好。后来你真的每年六月都回来了，只有一年，飞机晚点了一天。','She doesn\'t turn round. "Then you come in June. Santo António, Alfama sardines." You say yes. And you do, every June, except the one year the plane was a day late.','Ela não se vira. «Então vens em junho. Santo António, sardinhas de Alfama.» Dizes que sim. E vens mesmo, todos os junhos, menos no ano em que o avião se atrasou um dia.'),()=>{S.flags.f5_mom='yearly';stat('saud',-2)})},
  {t:t('“妈，夏天来德州吧。”','"Mom, come to Texas for the summer."','«Mãe, vem passar o verão ao Texas.»'),next:c6Say(s5After,t('“德州？”她把同一个盘子擦了三遍，“那么热的地方？”第二年七月，她在你的柜台后面站了整整一个月，纠正每一个人说的葡语“谢谢”。','"Texas?" She dries the same plate three times. "That hot place?" The next July she spends a whole month behind your counter, correcting everybody\'s "obrigado."','«O Texas?» Seca o mesmo prato três vezes. «Aquele sítio tão quente?» No julho seguinte passa um mês inteiro atrás do teu balcão, a corrigir o «obrigado» de toda a gente.'),()=>{S.flags.f5_mom='visit'})},
  {t:t('走过去，从后面抱住她','Go over and hug her from behind','Ir abraçá-la por trás'),next:c6Say(s5After,t('她的手还泡在水里。你们就那样站着，水龙头一直开着，谁也没去关。','Her hands are still in the water. You stand like that with the tap running. Neither of you turns it off.','Tem as mãos ainda na água. Ficam assim, com a torneira aberta. Nenhum dos dois a fecha.'),()=>{S.flags.f5_mom='hug';stat('saud',-1)})}]};
}
// someone who never quite left your life (only when you stayed on your own)
function s5LateId(){if(S.settled)return null;const c=Object.keys(NPCS).filter(k=>NPCS[k].romance&&rel(k).met&&rel(k).like>=4).sort((a,b)=>rel(b).like-rel(a).like);return c[0]||null}
function s5After(){const id=s5LateId();return id?s5Late(id):s5New()}
function s5Late(id){
 return {title:t('谁在门口','Someone at the door','Alguém à porta'),meta:S5M('第三年 · 夏天','Year three · Summer','Terceiro ano · verão'),text:[
  t(`你接手店满三年那天，在门口挂了一串灯。打烊的时候，${NM(id)}还坐在靠窗的那张桌子，咖啡早就凉了。`,`On your third anniversary running the shop, you hang a string of lights over the door. At closing time ${NM(id)} is still at the window table, the coffee long cold.`,`No dia em que fazes três anos à frente do restaurante, penduras um fio de luzes à porta. À hora de fechar, ${NM(id)} ainda está na mesa da janela, com o café frio há muito.`),
  t(`“我一直在等，”${SH(id)}说，“等你哪天不忙。三年了，你一直很忙。”`,`"I've been waiting," ${SH(id)} says. "For a day when you're not busy. It's been three years. You're always busy."`,`«Estive à espera», diz ${SH(id)}. «De um dia em que não estivesses ocupado. Já lá vão três anos. Estás sempre ocupado.»`)],choices:[
  {t:t('“明天不忙。星期天早上，喝咖啡？”','"Tomorrow I\'m not. Sunday morning — coffee?"','«Amanhã não estou. Domingo de manhã — um café?»'),next:c6Say(s5New,t(`${SH(id)}笑了，把凉咖啡一口喝完：“这一杯不算。”`,`${SH(id)} laughs and drinks the cold coffee in one gulp. "This one doesn't count."`,`${SH(id)} ri-se e bebe o café frio de um trago. «Este não conta.»`),()=>{S.flags.f5_late=id;addLike(id,2);addTrust(id,1)})},
  {t:t('“我会一直很忙。对不起。”','"I\'ll always be busy. I\'m sorry."','«Vou estar sempre ocupado. Desculpa.»'),next:c6Say(s5New,t(`${SH(id)}点点头，把钱压在杯子底下，走的时候顺手把门口那串灯插上了。`,`${SH(id)} nods, leaves the money under the cup, and on the way out plugs in the string of lights for you.`,`${SH(id)} acena, deixa o dinheiro debaixo da chávena e, à saída, liga-te o fio de luzes.`))}]};
}
function s5New(){
 return {title:t('下一个','The next one','O próximo'),meta:S5M('第五年 · 八月','Year five · August','Quinto ano · agosto'),text:[
  t('一个八月的傍晚，灰狗巴士停在那个只有一盏路灯的站台，下来一个年轻人，拖着箱子，背着吉他。他叫拉斐尔，从巴西米纳斯来，口袋里有一张纸条，写着“若泽烧烤店”。','One August evening the Greyhound stops at the stop with the single streetlight, and a young man gets off dragging a suitcase, a guitar on his back. His name is Rafael, from Minas Gerais in Brazil, and in his pocket is a slip of paper that says "Zé\'s Churrasco."','Numa tarde de agosto o Greyhound para na paragem do candeeiro único e sai um rapaz a arrastar uma mala, com uma guitarra às costas. Chama-se Rafael, vem de Minas Gerais, no Brasil, e tem no bolso um papel a dizer «Zé\'s Churrasco».'),
  t('“有人说这儿的老板会说葡语，”他说，“还雇人。”他的口音比你当年还重。','"Someone said the owner here speaks Portuguese," he says. "And hires people." His accent is heavier than yours ever was.','«Disseram-me que o dono daqui fala português», diz ele. «E que dá trabalho.» O sotaque dele é mais carregado do que o teu alguma vez foi.')],choices:[
  {t:t('把楼上的小房间给他','Give him the little room upstairs','Dar-lhe o quartinho lá de cima'),next:c6Say(s5End,t('你早就搬去了镇上，楼上那间小房间一直空着。你换了床单，学若泽的样子，在桌上留了一封信：“欢迎。门没锁。”','You moved into town long ago, and the little room upstairs has stood empty. You change the sheets and, the way José did, leave a letter on the table: "Welcome. The door isn\'t locked."','Há muito que te mudaste para a vila, e o quartinho lá de cima estava vazio. Mudas os lençóis e, como o José fazia, deixas uma carta em cima da mesa: «Bem-vindo. A porta não está trancada.»'),()=>{S.flags.f5_new='room'})},
  {t:t('先让他上烤架试一天','Put him on the grill for a day first','Pô-lo um dia à grelha primeiro'),next:c6Say(s5End,t('他烤糊了两条沙丁鱼，第三条烤对了。你想起了自己的第一个星期，什么也没说，又递给他第四条。','He burns two sardines and gets the third right. You remember your own first week, say nothing, and hand him a fourth.','Queima duas sardinhas e acerta à terceira. Lembras-te da tua primeira semana, não dizes nada e passas-lhe a quarta.'),()=>{S.flags.f5_new='grill';stat('oficio',1)})},
  {t:t('告诉他：在这儿，口音是本钱，也是账单','Tell him: here, your accent is your capital and your bill','Dizer-lhe: aqui, o sotaque é capital e é conta'),next:c6Say(s5End,t('他想了想，用那口浓得化不开的口音说：“那我先赊着。”柜台另一头，来吃午饭的厄尔笑出了声。','He thinks it over and says, in that accent thick enough to stand a spoon in: "Then I\'ll run a tab." At the far end of the counter, Earl, in for lunch, laughs out loud.','Pensa um bocado e responde, com aquele sotaque tão carregado que se lhe espetava uma colher: «Então fico a dever.» Na outra ponta do balcão, o Earl, que veio almoçar, ri-se alto.'),()=>{S.flags.f5_new='talk';stat('charme',1)})}]};
}
function s5End(){
 S.flags.f5_done=true;log('第五章「留下」完','Chapter 5, "Staying," complete','Capítulo 5, «Ficar», concluído');
 const late=S.flags.f5_late&&NPCS[S.flags.f5_late]?S.flags.f5_late:null;
 return {title:t('十年','Ten years','Dez anos'),meta:S5M('第十年','Year ten','Décimo ano'),text:[
  t('第十年，你的签证续到了第四次。大使馆的签证官换了人，新来的那位看着你的文件说：“十年了，您还在烤沙丁鱼。”你说：“还在。”','Year ten. The visa is on its fourth renewal. The consular officer has changed; the new one reads your file and says, "Ten years, and you\'re still grilling sardines." You say: "Still."','Décimo ano. O visto vai na quarta renovação. O cônsul mudou; o novo lê o teu processo e diz: «Dez anos e ainda grelha sardinhas.» Respondes: «Ainda.»'),
  t('马丽索尔的儿子十岁了，周末在店里跟你学翻炭。','Marisol\'s boy is ten now and spends weekends at the shop learning the coals from you.','O filho da Marisol já tem dez anos e passa os fins de semana no restaurante a aprender as brasas contigo.'),
  s5P()?t(`${P1()}还是没跟你去领那张纸。“十年了，”${P1()}说，“那张纸要证明的东西，我们早就证明完了。”`,`${P1()} still hasn't signed that piece of paper with you. "Ten years," ${P1()} says. "Whatever it was supposed to prove, we proved it a long time ago."`,`${P1()} continua sem assinar esse papel contigo. «Dez anos», diz ${P1()}. «O que quer que ele devesse provar, já o provámos há muito tempo.»`)
   :late?t(`星期天早上的咖啡，你和${SH(late)}一次都没落下。`,`Sunday morning coffee with ${SH(late)}: you haven't missed one.`,`O café de domingo de manhã com ${SH(late)}: ainda não falharam nenhum.`)
   :t('你还是一个人住。可星期天的店里，从来没有一张空桌子。','You still live alone. But on Sundays there\'s never an empty table in the shop.','Continuas a viver sozinho. Mas aos domingos nunca há uma mesa vazia no restaurante.')],choices:[
  {t:t('开门','Open up','Abrir a porta'),next:c6Fin},
  {t:t('先给下一个来的人写一封信','First, write a letter for whoever comes next','Primeiro, escrever uma carta a quem vier a seguir'),fx:()=>{S.flags.f5_letter=1;stat('saud',-1)},next:c6Fin}]};
}

/* entries: the year-end "Stay" without a partner, and «we don't need the paper» at the post-year proposal */
(function(){
 const base=c5Propose;
 c5Propose=function(){const sc=base();sc.choices=sc.choices.concat([{t:t('“我们不需要那张纸。”','"We don\'t need the paper."','«Não precisamos do papel.»'),fx:()=>{S.flags.f5_unwed=true;addTrust(F1.id(),1)},next:s5Open}]);return sc};
 const fam=FAMILY_EXTRA;
 FAMILY_EXTRA=choice=>{
  if(choice==='stay'&&S.flags&&S.flags.f6_done){
   const K=F1.kid(),f=S.flags.f6_future;
   const L=[{shop:t(`很多年以后，${K}接手了店。菜单改了三分之一，招牌一个字没改。你每天早上还是第一个到——只是现在，你负责喝咖啡。`,`Years later ${K} takes over the shop. A third of the menu changes; not a letter of the sign does. You're still the first one in every morning — only now your job is drinking the coffee.`,`Anos depois, ${K} fica com o restaurante. Um terço da ementa muda; a tabuleta não muda uma letra. Continuas a ser o primeiro a chegar todas as manhãs — só que agora o teu trabalho é beber o café.`),
     austin:t(`很多年以后，${K}在奥斯汀造桥，周末开一个小时的车回来翻炭——十个周末里有三个。三个就够了。`,`Years later ${K} builds bridges in Austin and drives an hour home on weekends to work the coals — three weekends in ten. Three is plenty.`,`Anos depois, ${K} constrói pontes em Austin e faz uma hora de carro aos fins de semana para vir tratar das brasas — três fins de semana em cada dez. Três chegam.`),
     lisbon:t(`很多年以后，${K}在里斯本的河边教书，每年六月带着学生飞回圣鲁伊斯过圣安东尼节。`,`Years later ${K} teaches by the river in Lisbon, and every June flies a class of students back to San Luís for Santo António.`,`Anos depois, ${K} dá aulas junto ao rio, em Lisboa, e todos os junhos traz uma turma de alunos a San Luís para o Santo António.`)}[f]||''];
   if(S.flags.f6_mom==='texas')L.push(t('妈妈在圣鲁伊斯住了很多年，和教会的老太太们吵了很多年，赢了大多数。','Your mother lived in San Luís for many years, argued with the church ladies for many years, and won most of them.','A tua mãe viveu muitos anos em San Luís, discutiu muitos anos com as senhoras da igreja e ganhou quase todas as discussões.'));
   return L.filter(Boolean);
  }
  if(choice==='stay'&&S.flags&&S.flags.f5_done){
   const L=[];
   if(s5P())L.push(t(`很多年以后，你和${res(SH(S.settled),'zh')}还是没有结婚。镇上的人早就不问了，管你们叫“那两个”，就像叫一对老夫妻。`,`Years later you and ${res(SH(S.settled),'en')} still haven't married. The town stopped asking long ago; they call you "those two," the way you'd talk about an old married couple.`,`Anos depois tu e ${res(SH(S.settled),'pt')} continuam sem casar. A vila deixou de perguntar há muito; chamam-vos «aqueles dois», como quem fala de um casal de velhos.`));
   L.push(t('拉斐尔后来在韦科开了自己的店。开张那天，他在门上挂了一块牌子：“门没锁。”','Rafael eventually opened his own place in Waco. On opening day he hung a sign on the door: "The door isn\'t locked."','O Rafael acabou por abrir uma casa sua em Waco. No dia da inauguração pendurou um letreiro na porta: «A porta não está trancada.»'));
   return L;
  }
  return fam(choice);
 };
})();

const EVENTS=[
 {id:'albertina',when:()=>S.week===1&&S.day===3&&S.slot===0,run:()=>{const r=rel('albertina');r.met=true;r.like=3;S.flags.church=1;log('认识了阿尔贝蒂娜太太，教堂解锁','Met Dona Albertina; church unlocked','Conheceste a Dona Albertina; igreja desbloqueada');
  return {title:NM('albertina'),meta:tt(NPCS.albertina.role),text:[t('一个矮小的老太太推门进来，手里提着一个用报纸包着的面包。“早上好，孩子。”她的葡语带着六十年前的亚速尔腔。','A tiny old woman pushes the door open with a loaf wrapped in newspaper. "Bom dia, menino" — good morning, boy. Her Portuguese carries a sixty-year-old Azorean lilt.','Uma senhora pequenina empurra a porta com um pão embrulhado em jornal. «Bom dia, menino.» O português dela tem o sotaque açoriano de há sessenta anos.'),t('“若泽每个星期天都来教堂。你也来。”她不是在邀请你。','"José came to church every Sunday. You\'ll come too." It isn\'t an invitation.','«O José ia à missa todos os domingos. Tu também vais.» Não é um convite.')],choices:[{t:t('谢谢您，阿尔贝蒂娜太太。','"Thank you, Dona Albertina."','Obrigado, Dona Albertina.'),fx:()=>{stat('saud',3);S.lusoThisWeek=true}}]}}},
 {id:'lucia',when:()=>S.week===2&&S.day===2&&S.slot===0,run:()=>{S.flags.ranch=1;log('雷耶斯牧场解锁','Reyes Ranch unlocked','Rancho Reyes desbloqueado');return meetScene('lucia')}},
 {id:'travis',when:()=>S.week===3&&S.day===1&&S.slot===1,run:()=>{S.flags.gym=1;rel('travis').met=true;rel('travis').like=2;log('铁马健身房解锁','Iron Mustang Gym unlocked','Ginásio Iron Mustang desbloqueado');

 {id:'delphine',when:()=>S.week===8&&S.day===5&&S.slot===2,run:()=>{rel('delphine').met=true;

 {id:'rui2',when:()=>S.week===9&&S.day===6&&S.slot===2,run:()=>say(t('又是鲁伊','Rui again','Outra vez o Rui'),t('“妈的检查结果出来了，没大事。她让我告诉你，别光顾着赚钱，要交朋友。”弟弟顿了顿，“还有，她问你什么时候回来。”','"Mom\'s results came back. Nothing serious. She says don\'t just make money — make friends." A pause. "And she asked when you\'re coming home."','«Saíram os resultados da mãe. Nada de grave. Diz para não andares só a ganhar dinheiro — arranja amigos.» Uma pausa. «E perguntou quando voltas.»'))},

function fairScene(){
 return {title:t('七月四日集市','The Fourth of July fair','A feira do 4 de Julho'),meta:t('第一章 · 章末','Chapter 1 · Finale','Capítulo 1 · Final'),text:[t('主街封路，烟花店把货摆到了人行道上，每个摊位都插着星条旗。你的摊位在烤肉队和教堂义卖之间。','Main Street is closed off, the fireworks stand has spilled onto the sidewalk, and every booth flies the Stars and Stripes. Your booth sits between the barbecue team and the church bake sale.','A rua principal está fechada, a loja de foguetes invadiu o passeio e todas as bancas têm a bandeira americana. A tua fica entre a equipa do churrasco e a venda de bolos da igreja.'),t('这一天，整个圣鲁伊斯都会记住你站在哪一边。','Today all of San Luís will remember which side you stood on.','Hoje toda a San Luís vai lembrar-se de que lado estiveste.')],choices:[
  {t:t('摆葡萄牙摊：沙丁鱼、蛋挞、法多','A Portuguese stand: sardines, custard tarts, fado','Banca portuguesa: sardinhas, natas e fado'),fx:()=>{stat('saud',10);S.rep+=6;S.cash+=180;addLike('albertina',2);S.flags.fair='luso'}},
  {t:t('加入烤肉队，学做烟熏牛胸肉','Join the barbecue team, learn brisket','Juntar-te à equipa do churrasco e aprender a fumar peito de vaca'),req:()=>S.stats.oficio>=35||NEED(t('手艺 35','Craft 35','Ofício 35')),fx:()=>{stat('tex',10);S.rep+=6;addTrust('beto',1);addTrust('earl',1);S.flags.fair='tex'}},
  {t:t('卖融合菜：牛胸肉夹包','Sell fusion: the brisket sandwich','Vender fusão: a bifana de peito fumado'),req:()=>S.fusion.unlocked||t('先研发融合菜','Develop fusion dishes first','Primeiro cria os pratos de fusão'),fx:()=>{stat('tex',6);stat('saud',6);S.rep+=10;S.cash+=320;S.flags.fair='fusion'}},
  {t:`[${faceWord()}] `+t('站在摊位前拉客','Stand out front and pull people in','Ficar à frente da banca a chamar clientes'),req:CHARM_REQ(55),fx:()=>{S.cash+=240;S.rep+=3;flirt();S.flags.fair='face'}}].map(c=>Object.assign(c,{next:chapterEnd}))};
}
function chapterEnd(){
 const f={luso:t('你守住了里斯本。葡裔老人们说，这是五十年来集市上第一次有人唱法多。','You held on to Lisbon. The Portuguese elders say it\'s the first fado at the fair in fifty years.','Guardaste Lisboa. Os velhotes dizem que foi o primeiro fado na feira em cinquenta anos.'),tex:t('你学会了烤牛胸肉。贝托当着所有人的面拍了你的背。','You learned brisket. Beto slapped your back in front of everyone.','Aprendeste a fumar peito de vaca. O Beto deu-te uma palmada nas costas à frente de toda a gente.'),fusion:t('牛胸肉夹包 卖到了下午两点就断货。德尔菲娜发了一条动态：未来在这里。','The brisket sandwich sold out by 2 p.m. Delphine posted: the future is here.','A bifana de peito fumado esgotou às duas da tarde. A Delphine publicou: o futuro está aqui.'),face:t('你卖得最好，但第二天镇上记住的是你的脸，不是你的菜。','You sold the most, but the next day the town remembered your face, not your food.','Vendeste mais do que ninguém, mas no dia seguinte a vila lembrava-se da tua cara, não da tua comida.')}[S.flags.fair]||'';
 return {title:t('第一章 · 夏：到来　完','End of Chapter 1 · Summer: Arrival','Fim do Capítulo 1 · Verão: Chegada'),meta:t(`第 12 周 · 现金 $${Math.round(S.cash)} · 口碑 ${Math.round(S.rep)}`,`Week 12 · Cash $${Math.round(S.cash)} · Reputation ${Math.round(S.rep)}`,`Semana 12 · Dinheiro $${Math.round(S.cash)} · Reputação ${Math.round(S.rep)}`),text:[f,t(`魅力 ${charm()} · 手艺 ${S.stats.oficio} · 德州味 ${S.stats.tex} · 乡愁 ${S.stats.saud}。若泽的信，你找到了 ${S.letters} 封。`,`Charm ${charm()} · Craft ${S.stats.oficio} · Texanness ${S.stats.tex} · Homesickness ${S.stats.saud}. You\'ve found ${S.letters} of José\'s letters.`,`Charme ${charm()} · Ofício ${S.stats.oficio} · Texanidade ${S.stats.tex} · Saudade ${S.stats.saud}. Encontraste ${S.letters} cartas do José.`),t('第二章「秋：名声」开始了。','Chapter 2, "Fall: Fame," begins.','Começa o Capítulo 2, «Outono: Fama».')],choices:[{t:t('继续这一年','Carry on with the year','Continuar o ano')}]};
}
function crisisScene(){
 S.negWeeks=0;
 return {title:t('卖店危机','Pressure to sell','Pressão para vender'),meta:t('连续三周亏损','Three losing weeks in a row','Três semanas seguidas de prejuízo'),text:[t('特拉维斯又来了，这次带着一张支票。“$40,000，现金。你可以回里斯本，买间好公寓。”','Travis is back, this time with a check. "$40,000, cash. Go back to Lisbon, buy yourself a nice apartment."','O Travis voltou, desta vez com um cheque. «Quarenta mil dólares. Voltas para Lisboa e compras um bom apartamento.»'),t('厄尔在旁边吧台上喝咖啡，没说话。','Earl drinks his coffee at the counter and says nothing.','O Earl bebe o café ao balcão e não diz nada.')],choices:[
  {t:t('拒绝，找厄尔借 $500','Refuse, borrow $500 from Earl','Recusar e pedir $500 emprestados ao Earl'),fx:()=>{S.cash+=500;addTrust('earl',1);log('向厄尔借了 $500','Borrowed $500 from Earl','Pediste $500 ao Earl')}},
  {t:t('拒绝，硬撑','Refuse and tough it out','Recusar e aguentar'),fx:()=>stat('tex',3)}]};

function yearEnd(){
 S.ended=true;
 const trustSum=Object.keys(S.npc).reduce((a,k)=>a+(S.npc[k].met?S.npc[k].trust:0),0);
 const end=ch=>{
  const tx=S.stats.tex,sd=S.stats.saud,c=charm();
  if(ch==='home'){const lb=rel('lucia').trust>=5;const buyer=lb?SH('lucia'):SH('earl');return [t('归途','The way home','O regresso'),t(`你把店卖给了 ${buyer}，带着一袋德州辣椒种子回到阿尔法马。妈妈的阳台上，第二年长出了 墨西哥辣椒。`,`You sell the shop to ${buyer} and fly back to Alfama with a bag of Texas pepper seeds. The next year, jalapeños grow on your mother\'s balcony.`,`Vendes o restaurante ${lb?'à':'ao'} ${buyer} e voltas para Alfama com um saco de sementes de malagueta do Texas. No ano seguinte, nascem jalapeños na varanda da tua mãe.`)]}
  if(ch==='austin')return [t('奥斯汀','Austin','Austin'),t('你一半留下，一半走了。周末回圣鲁伊斯吃饭，店交给雇来的伙计。这是最开放的一种结局。','Half of you stays, half of you goes. Weekends you drive back to San Luís to eat; hired hands run the shop. The most open ending of all.','Metade de ti fica, metade parte. Aos fins de semana voltas a San Luís para comer; o restaurante fica entregue a empregados. O final mais em aberto de todos.')];
  if(c>=80&&trustSum<20&&!S.settled&&!S.flags.married)return [t('花瓶','Pretty face','Cara bonita'),t('你和特拉维斯合伙开了一家网红餐厅。很红。没有人叫你的名字。','You and Travis open a viral restaurant together. It\'s a hit. Nobody calls you by your name.','Abres com o Travis um restaurante viral. É um sucesso. Ninguém te trata pelo nome.')];
  if(tx>=70&&sd<=40)return [t('孤星之子','Son of the Lone Star','Filho da Estrela Solitária'),t('你戴着牛仔帽站在店门口，招牌改成了英文的“泽家烧烤”。妈妈的来电，你没接。','You stand outside in a cowboy hat under a new sign: "Zé\'s BBQ." Your mother calls. You don\'t pick up.','Estás à porta de chapéu de cowboy, debaixo de uma tabuleta nova: «Zé\'s BBQ». A tua mãe liga. Não atendes.')];
  if(tx>=50&&sd>=50&&trustSum>=40)return [t('两个家','Two homes','Duas casas'),t('圣安东尼节上，牛仔和亚速尔老人一起跳舞。鲁伊从里斯本飞来了，站在人群里冲你挥手。','At the Santo António festival, cowboys and Azorean old-timers dance together. Rui has flown in from Lisbon and waves at you from the crowd.','Na festa de Santo António, cowboys e velhotes açorianos dançam juntos. O Rui veio de Lisboa e acena-te do meio da multidão.')];
  if(S.settled)return [t('体面的异乡人','A decent stranger','Um estrangeiro digno'),t('店开着，朋友常来。有些夜里你还是会放一段法多，只是现在，总有人坐下来陪你听。小城接受了你，你自己也快接受了。','The shop is open, friends drop by. Some nights you still put on a fado — only now someone always sits down to listen with you. The town has accepted you. You\'re nearly there yourself.','O restaurante está aberto, os amigos aparecem. Há noites em que ainda pões um fado — só que agora há sempre alguém que se senta a ouvir contigo. A vila aceitou-te. Tu estás quase lá.')];
  return [t('体面的异乡人','A decent stranger','Um estrangeiro digno'),t('店开着，朋友常来。只是每天夜里，你还是一个人听法多。小城接受了你，你还没完全接受小城。','The shop is open, friends drop by. But every night you still listen to fado alone. The town has accepted you. You haven\'t quite accepted the town.','O restaurante está aberto, os amigos aparecem. Mas todas as noites continuas a ouvir fado sozinho. A vila aceitou-te. Tu ainda não aceitaste bem a vila.')];
 };
 const fin=ch=>()=>{const [h,b]=end(ch);const extra=[...(S.settled&&ROMX[S.settled]&&ROMX[S.settled].epilogue?[tt(ROMX[S.settled].epilogue)]:[]),...ENDING_EXTRA(ch),...FAMILY_EXTRA(ch)];
 return {title:t('结局 · ','Ending · ','Final · ')+h,meta:t('一周年','One year','Um ano'),text:[b,...extra,S.letters>=12?t('尾声：你把若泽的 12 封信寄回了里斯本。三十年后，妈妈终于读到了哥哥写的话。','Epilogue: you mail all 12 of José\'s letters to Lisbon. Thirty years late, your mother finally reads her brother\'s words.','Epílogo: mandas as 12 cartas do José para Lisboa. Trinta anos depois, a tua mãe lê finalmente as palavras do irmão.'):t(`若泽的信你找到了 ${S.letters} 封。`,`You found ${S.letters} of José\'s letters.`,`Encontraste ${S.letters} cartas do José.`),t('谢谢游玩《里斯本·孤星》。','Thank you for playing Lisboa, Lone Star.','Obrigado por jogares Lisboa, Estrela Solitária.')],choices:[{t:t('从头再来','Start over','Recomeçar'),fx:()=>{tryRemove();S=null;queue=[];render()}}]}};
 return {title:t('一周年','One year','Um ano'),meta:NM('grace'),text:[t('格蕾丝把文件推到你面前：“条件达成了。店和房子都是你的。”','Grace slides the papers across. "Conditions met. The shop and the house are yours."','A Grace empurra os papéis na tua direção. «Condições cumpridas. O restaurante e a casa são teus.»'),t('她停了一下：“所以——你要留下吗？”','She pauses. "So — are you staying?"','Faz uma pausa. «Então — vais ficar?»')],choices:[
  {t:t('留下','Stay','Ficar'),next:()=>(S.settled&&typeof CH5==='function')?CH5(fin('stay')):SOLO5(fin('stay'))},
  {t:t('回里斯本','Go back to Lisbon','Voltar para Lisboa'),req:()=>S.stats.saud>=70||NEED(t('乡愁 70','Homesickness 70','Saudade 70')),next:fin('home')},
  {t:t('去奥斯汀','Go to Austin','Ir para Austin'),req:()=>rel('maya').like>=7||S.settled==='maya'||NEED(t('玛雅好感 7','Maya\'s affection 7','afeto da Maya 7')),next:fin('austin')}]};
}

/* ---------- save ---------- */
function save(){try{if(S)localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const x=localStorage.getItem(SAVE_KEY);if(!x)return null;const s=ensureState(JSON.parse(x));s.log=(s.log||[]).map(l=>typeof l==='string'?{z:l,e:l,p:l}:l);return s}catch(e){return null}}
function tryRemove(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}

/* ---------- render ---------- */
function langSwitch(){return `<span class="langs" role="group" aria-label="Language">${[['zh','中文'],['en','EN'],['pt','PT']].map(([k,n])=>`<button data-lang="${k}" class="${LANG===k?'on':''}" aria-pressed="${LANG===k}">${n}</button>`).join('')}</span>`}
let mview='act',lastCur=null;
function mnavHTML(){const it=[['story','✎',t('故事','Story','História')],['act','◆',t('行动','Actions','Ações')],['map','◎',t('地图','Map','Mapa')],['panel','☰',t('面板','Panel','Painel')]];
