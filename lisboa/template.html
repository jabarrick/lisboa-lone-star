 <label>${t('口音（之后可在店里的镜子前每周调一档）','Accent (change it one step a week at the shop mirror)','Sotaque (podes mudá-lo um passo por semana ao espelho do restaurante)')}</label>
 <div class="acc">
  <label><input type="radio" name="acc" value="浓">${ACC('浓')}<br><span class="mini">${t('魅力 +12，初见 +20；沟通成本高','Charm +12, +20 on first meeting; hard to understand','Charme +12, +20 no primeiro encontro; difícil de entender')}</span></label>
  <label><input type="radio" name="acc" value="中" checked>${ACC('中')}<br><span class="mini">${t('魅力 +6；偶尔说错','Charm +6; occasional slips','Charme +6; alguns deslizes')}</span></label>
  <label><input type="radio" name="acc" value="淡">${ACC('淡')}<br><span class="mini">${t('魅力 +0；正式场合 +5','Charm +0; +5 in formal settings','Charme +0; +5 em contextos formais')}</span></label>
 </div>
 <button class="go" id="go">${t('坐上灰狗巴士','Board the Greyhound','Apanhar o Greyhound')}</button></div>`;
}
function bindStart(){
 const c=$('#cont');if(c)c.onclick=()=>{S=load();if(!S.goals.length)mondaySystems();queue=[];cur=null;render()};
 $('#go').onclick=()=>{
  const name=($('#pname').value||'Tiago').trim().slice(0,16);
  const acc=(document.querySelector('input[name=acc]:checked')||{}).value||'中';
  S=newState(name,acc);
  S.npc.grace.met=true;S.npc.grace.like=1;S.npc.grace.trust=1;mondaySystems();
  log('抵达圣鲁伊斯','Arrived in San Luís','Chegaste a San Luís');
  queue=[];cur=null;
  push({title:t('灰狗巴士，傍晚六点','Greyhound, 6 p.m.','Greyhound, seis da tarde'),meta:t('第一章 · 夏：到来（Chegada）','Chapter 1 · Summer: Arrival','Capítulo 1 · Verão: Chegada'),text:[
   t(`38°C。巴士把 ${name} 放在一个只有一盏路灯的站台。没人来接。`,`100°F. The bus drops ${name} at a stop with a single streetlight. Nobody\'s there to meet you.`,`38 °C. O autocarro deixa ${name} numa paragem com um só candeeiro. Não está ninguém à tua espera.`),
   t('你拖着箱子走了二十分钟，看见一块褪色的招牌：若泽烧烤店。门没锁。烤架坏了一半，冰箱里只剩几盒沙丁鱼和一袋冻猪肉。','You drag your suitcase for twenty minutes and find a faded sign: Zé\'s Churrasco. The door isn\'t locked. Half the grill is broken; the fridge holds a few tins of sardines and a bag of frozen pork.','Arrastas a mala durante vinte minutos até veres uma tabuleta desbotada: Zé\'s Churrasco. A porta não está trancada. Metade da grelha está estragada; no frigorífico só há umas latas de sardinha e um saco de porco congelado.'),
   t('桌上压着一张律师名片——格蕾丝·霍洛韦，市政律师——和一个牛皮纸袋。袋子里是一封没有寄出的信，收信人是你妈妈。','On the table: a lawyer\'s card — Grace Holloway, town attorney — and a manila envelope. Inside is an unsent letter, addressed to your mother.','Em cima da mesa: o cartão de uma advogada — Grace Holloway, advogada municipal — e um envelope pardo. Lá dentro, uma carta por enviar, dirigida à tua mãe.')],
   choices:[{t:t('把信收好，睡一觉','Put the letter away and sleep','Guardar a carta e ir dormir')}]});
  push({title:NM('grace'),meta:tt(NPCS.grace.role)+' · '+GRP('root'),text:[t('第二天一早，律师准时出现。“遗嘱条件很简单：你亲自经营满 48 周，店和房子归你。中途离开，一切归市政慈善基金。”','The attorney arrives on the dot next morning. "The will is simple: run the place yourself for 48 weeks and the shop and house are yours. Leave early and it all goes to the town charity fund."','A advogada chega à hora certa na manhã seguinte. «O testamento é simples: geres o restaurante durante 48 semanas e ficas com ele e com a casa. Se saíres antes, vai tudo para o fundo de caridade da vila.»'),t('她看了一眼你的箱子：“若泽说你会来的。我本来不信。”','She glances at your suitcase. "José said you\'d come. I didn\'t believe him."','Olha de relance para a tua mala. «O José disse que virias. Eu não acreditei.»')],
   choices:[{t:t('“我会留下来的。至少一年。”','"I\'m staying. At least a year."','«Vou ficar. Pelo menos um ano.»'),fx:()=>addTrust('grace',1)},{t:`[${faceWord()}] `+t('“有你这样的律师，我舍不得走。”','"With a lawyer like you, how could I leave?"','«Com uma advogada assim, como é que me ia embora?»'),req:()=>charm(true)>=45||NEED(t('魅力 45','Charm 45','Charme 45')),fx:()=>{addLike('grace',2);flirt()}}]});
 };
}
function bind(){
 const r2=$('#restart2');if(r2&&r2.addEventListener)r2.onclick=()=>{if(r2.dataset.sure){tryRemove();S=null;queue=[];cur=null;render()}else{r2.dataset.sure=1;r2.textContent=res(t('再点一次确认','Tap again to confirm','Toca outra vez para confirmar'))}};
 $('#restart').onclick=()=>{const b=$('#restart');if(b.dataset.sure){tryRemove();S=null;queue=[];cur=null;render()}else{b.dataset.sure=1;b.textContent=t('再点一次确认','Click again to confirm','Clica outra vez para confirmar')}};
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.c));
 document.querySelectorAll('.act').forEach(b=>b.onclick=()=>{if(b.classList.contains('off')){toast(b.dataset.why||'');return}const [l,id]=b.dataset.a.split('|');const a=actions().find(x=>x.loc===l&&x.id===id);if(a)doAction(a)});
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 bindWikiDebug();
 document.querySelectorAll('select[data-m]').forEach(s=>s.onchange=()=>{const v=s.value||null;S.menu[+s.dataset.m]=v;save();toast(v?t('菜单加入 ','Added to menu: ','Na ementa: ')+tt(DISH[v].n):t('清空槽位','Slot cleared','Lugar vazio'))});
 document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const k=b.dataset.buy;const p=Math.round(unitPrice(k)*10);if(S.cash<p){toast(t('钱不够','Not enough money','Não tens dinheiro'));return}S.cash-=p;S.wk.spend+=p;if(k==='imp')S.incoming+=10;else S.inv[k]+=10;log(`进货 ${ING[k].n[0]} 10 份 −$${p}`,`Bought 10 ${ING[k].n[1]} −$${p}`,`Compraste 10 ${ING[k].n[2]} −$${p}`);save();render()});
 document.querySelectorAll('.txm-city').forEach(g=>g.addEventListener('click',()=>{if(g.dataset.city==='home'&&!away())return;if(g.dataset.city!=='home'){MAP_FOCUS=g.dataset.city;if(MAP_RG!=='all'&&CITIES[MAP_FOCUS]&&CITIES[MAP_FOCUS].region!==MAP_RG)MAP_RG='all'}tab='map';mview='panel';render();const pn=$('#panel');if(pn&&pn.scrollIntoView)pn.scrollIntoView({behavior:'smooth',block:'start'})}));
 document.querySelectorAll('[data-mpg]').forEach(b=>b.onclick=()=>{MAP_PG=+b.dataset.mpg;MAP_FOCUS=null;render()});
 document.querySelectorAll('[data-mrg]').forEach(b=>b.onclick=()=>{MAP_RG=b.dataset.mrg;MAP_PG=0;MAP_FOCUS=null;render()});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const box=b.closest('.txm-travel')||b.closest('#panel')||document;const w=box.querySelector('select');goTrip(b.dataset.go,w&&w.value?w.value:null)});
 document.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>{S.price=b.dataset.price;save();render()});
 const sp=$('#special');if(sp&&sp.addEventListener)sp.onchange=()=>{S.special=sp.value||null;save();render()};
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{buyUpgrade(b.dataset.up);save();render()});
 document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>{const k=b.dataset.hire;if(S.staff.length>=STAFF_MAX)return;S.staff.push(k);smOf(k);log(`雇用了 ${tt(STAFF[k].n)}`,`Hired ${tt(STAFF[k].n)}`,`Contrataste ${tt(STAFF[k].n)}`);toast(tt(STAFF[k].n)+t(' 加入了店里',' joined the team',' entrou para a equipa'));save();render()});
 document.querySelectorAll('[data-contract]').forEach(b=>b.onclick=()=>{const k=b.dataset.contract;S.contract=S.contract||{};const q=S.contract[k]||0;S.contract[k]=q===0?10:q===10?20:0;save();render()});
 document.querySelectorAll('[data-fire]').forEach(b=>b.onclick=()=>{const k=b.dataset.fire;S.staff=S.staff.filter(x=>x!==k);log(`解雇了 ${tt(STAFF[k].n)}`,`Let ${tt(STAFF[k].n)} go`,`Despediste ${tt(STAFF[k].n)}`);save();render()});
}
// keep the token table small on long sessions: drop entries no live scene still points at
function gc(){if(REG.length-gc.dead<20000)return;const live=new Set();const scan=x=>{for(const m of String(x).matchAll(TOK)){const id=+m[1];if(!live.has(id)){live.add(id);const r=REG[id];if(r)r.forEach(scan)}}};scan(JSON.stringify([cur,queue,S&&S.rumor]));for(const [k,id] of REGI){if(!live.has(id)){REG[id]=null;REGI.delete(k);gc.dead++}}}
gc.dead=0;
document.documentElement.lang={zh:'zh-CN',en:'en',pt:'pt-PT'}[LANG];
document.title=res(t('里斯本·孤星','Lisboa, Lone Star','Lisboa, Estrela Solitária'));
render();
</script>
</body>
